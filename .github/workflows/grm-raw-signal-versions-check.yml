name: raw_signal versions SQL checks
# [원문 갱신 규칙 R1 2026-11-12] 148_raw_signal_versions.sql 의 함수 계약(지문 검증·낙관적 동시성·
# 옛 판 보관·baseline 규칙·권한)을 격리 PostgreSQL 에서 확인한다. 운영 DB 에는 닿지 않는다.
on:
  pull_request:
    paths:
      - 'web/migrations/*raw_signal*'
      - 'tests/sql/raw_signal_versions.sql'
      - '.github/workflows/grm-raw-signal-versions-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check raw_signal_apply_version in an isolated PostgreSQL database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createdb raw_signal_versions_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d raw_signal_versions_test -f tests/sql/raw_signal_versions.sql
