name: GRM MFDS Deep Backfill (findings)

# 국내(식약처) data.go.kr 계열 과거분 딥 백필 — 1회성 수동 실행.
#
# 배경: 매일 크론(grm-intake.yml)은 창이 짧아 국내 소스의 과거분이 영영 안 들어온다.
# 2026-08-05 실측으로 admin-action 은 2026-04-28 이전이 raw_signals 에 하나도 없다.
# data.go.kr 행정처분/회수 API 는 과거분 노출을 보장하지 않는 소멸성 데이터라 넓은 창을
# 한 번에 수집해 Supabase 에 직접 적재한다(collect_mfds_backfill.py).
#
# ★핵심 제약:
#   - git 쓰기 없음(checkout=read-only). Notion 무접촉(append 가 raw_signals + findings 를
#     PostgREST 로 직접 적재) → 주간 브리프 파이프라인 무간섭. 과거분은 7일 창 밖이라
#     News 카드로도 안 나간다.
#   - 멱등: raw_signal_id / finding_id 는 (source, document_id) 해시라 이미 보유한 최근분
#     재적재도 중복 0. 실패 시 잔여만 재적재하면 됨.
#   - ★상한이 창보다 먼저 걸린다. 두 수집기 모두 페이지 상한이 있고 날짜 필터가 서버측이
#     아니라 클라이언트측이라, 창만 넓히면 아무것도 더 안 들어온다. max_pages 로 올린다.
#     상한 도달(truncated)은 exit 3 으로 잡(job)이 빨갛게 끝난다 — 침묵 통과 금지.
#   - dry_run=true(기본값)로 먼저 실행해 collected/date_min/date_max/by_month 를 확인한 뒤
#     dry_run=false 로 재실행해 실적재한다.
#   - ENABLE_MFDS_URL_VERIFY 는 절대 켜지 않는다(건별 nedrug 접속 — 해외 IP 차단). 이
#     워크플로는 그 값을 env 로 넘기지 않으며, 켜진 채로 들어오면 스크립트가 자체 중단한다.
#   - MFDS findings 는 전건 KO 라 EU NCR 백필과 달리 **적재 후 번역 단계가 없다.**
on:
  workflow_dispatch:
    inputs:
      source:
        description: '백필 대상 data.go.kr 수집기.'
        type: choice
        options:
          - admin-action
          - recall
        default: admin-action
      from_date:
        description: '처분/공표일 창 시작(ISO).'
        type: string
        default: '2025-02-01'
      to_date:
        description: '창 끝(ISO). 빈값이면 오늘.'
        type: string
        default: ''
      max_pages:
        description: '수집기 MAX_PAGES 덮어쓰기(0 = 기본값 admin 20 / recall 25). 창이 넓으면 반드시 올릴 것.'
        type: string
        default: '0'
      dry_run:
        description: 'true = 수집만(Supabase 적재 없음). 먼저 이걸로 건수를 확정한다.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # 매일 크론(MFDS 수집)과 data.go.kr 호출을 놓고 경합하지 않도록 직렬화.
  group: mfds-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Deep-backfill MFDS into findings (raw + findings, no git writes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # DATA_GO_KR_SERVICE_KEY / SUPABASE_* 는 grm-intake.yml 이 이미 쓰는 동일 secret/var
      # 재사용 — 신규 등록 불필요. dispatch 입력은 env 로만 받아 shell 본문 삽입을 피한다.
      - name: Run MFDS deep backfill
        id: backfill
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRM_SOURCE: ${{ inputs.source }}
          GRM_FROM_DATE: ${{ inputs.from_date }}
          GRM_TO_DATE: ${{ inputs.to_date }}
          GRM_MAX_PAGES: ${{ inputs.max_pages }}
          GRM_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--source "$GRM_SOURCE" --from-date "$GRM_FROM_DATE"
                --max-pages "${GRM_MAX_PAGES:-0}" --output backfill_report.json)
          if [ -n "$GRM_TO_DATE" ]; then
            ARGS+=(--to-date "$GRM_TO_DATE")
          fi
          if [ "$GRM_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python collect_mfds_backfill.py "${ARGS[@]}"

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### GRM MFDS Deep Backfill"
            echo ""
            echo "source: \`${{ inputs.source }}\` / from_date: \`${{ inputs.from_date }}\` / to_date: \`${{ inputs.to_date }}\` / max_pages: \`${{ inputs.max_pages }}\` / dry_run: \`${{ inputs.dry_run }}\`"
            echo ""
            if [ -f backfill_report.json ]; then
              echo '```json'
              cat backfill_report.json
              echo '```'
              echo ""
              echo "exit 3 = 페이지 상한 도달(truncated). max_pages 를 올려 재실행하라(멱등)."
            else
              echo "backfill_report.json 미생성 — 인자/인증/수집 실패로 조기 종료 가능"
              echo "(DATA_GO_KR_SERVICE_KEY / SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 확인)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
