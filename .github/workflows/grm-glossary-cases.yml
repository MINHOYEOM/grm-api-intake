name: GRM Glossary Cases Refresh

# 용어사전 "이 용어로 찾은 지적사례 N건 보기" 링크의 건수를 주 1회 자동 재측정한다
# (glossary_cases_refresh.py). 자료실 자동 갱신(grm-library-staging.yml, 일요일 18:23 UTC =
# 월요일 03:23 KST)과 **다른 요일**에 잡는다 — 같은 시간대에 겹치면 두 워크플로우가 각자
# web/tests/golden 을 재동결해 main 기준으로 순차 PR 을 만들 때 두 번째 PR 이 첫 번째의
# 골든 변경을 못 본 채로 브랜치를 따서(둘 다 main 에서 분기) 머지 경합/충돌 가능성이 생긴다.
# → 목요일 18:15 UTC(= 금요일 03:15 KST)로 분리한다. 자료실=일→월 새벽, 용어사전=목→금 새벽 —
# 서로 다른 조용한 새벽 창이라 겹칠 일이 없고, 기존 크론 목록(전 워크플로우) 어디와도 안 겹친다.
#
# 흐름은 grm-library-staging.yml 과 같은 사상: refresh(항목별 격리 실패·게이트 판정) →
# 변경 있으면 골든 재동결 → PR 생성 → 게이트 통과분만 CI 디스패치 후 자동 머지, 경고가 있으면
# automation-warning 라벨을 붙여 사람 검토로 남긴다. 새 시크릿/변수 없음 — SUPABASE_URL·
# SUPABASE_ANON_KEY(둘 다 repo Variables, grm-web-deploy.yml/grm-supabase-keepalive.yml 과
# 공유)와 GH_TOKEN 시크릿 폴백 체인(grm-library-staging.yml 과 동일)을 그대로 재사용한다.

on:
  schedule:
    - cron: '15 18 * * 4'
  workflow_dispatch:
    inputs:
      large_change_percent:
        description: '항목별 findings 변동 상한 %(초과 시 리포트에 표시 — 값은 반영됨)'
        required: true
        default: '50'
      fail_abort_percent:
        description: '전체 항목 중 재측정 실패 비율 상한 %(도달 시 전면 중단, 파일 미기록)'
        required: true
        default: '20'
      shrink_review_percent:
        description: '두 언어 사례 링크 합계가 이 비율(%) 이상 줄면 자동 머지 대신 사람 검토'
        required: true
        default: '20'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: grm-glossary-cases-auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LARGE_CHANGE_PCT: ${{ inputs.large_change_percent || '50' }}
      FAIL_ABORT_PCT: ${{ inputs.fail_abort_percent || '20' }}
      SHRINK_PCT: ${{ inputs.shrink_review_percent || '20' }}
      BRANCH: automation/glossary-cases-auto-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GRM_PUBLISH_TOKEN || secrets.ADMIN_GITHUB_ACTIONS_TOKEN || github.token }}
      DATA_PATH: web/data/glossary_cases.json
      DATA_PATH_EN: web/data/glossary_cases_en.json
      REPORT_PATH: web/data/glossary_cases_refresh_report.json
      REPORT_PATH_EN: web/data/glossary_cases_en_refresh_report.json
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create isolated candidate branch
        run: git switch -c "$BRANCH"
      - name: Record pre-refresh case-link counts
        id: before
        run: |
          set -euo pipefail
          count() { [ -f "$1" ] && jq '.items | length' "$1" || echo 0; }
          # 한쪽만 줄어도 가드가 보게 두 언어를 합친다. 영문 첫 생산 전에는 0이다.
          echo "items=$(( $(count "$DATA_PATH") + $(count "$DATA_PATH_EN") ))" >> "$GITHUB_OUTPUT"
      # ── 재측정(항목별 격리 실패·0건 유지·±50% 표시). ≥fail_abort_percent% 실패면 이 스텝이
      #    exit 1 로 하드 실패한다(library_staging_build.py 의 "과반 실패 시 전면 중단"과 같은
      #    관례) — 파일은 이미 아무것도 못 썼으므로 아래 diff 스텝도 어차피 변경 0 이 되지만,
      #    "실패로 끝낸다"를 잡 상태(빨강)로도 드러내기 위해 continue-on-error 를 두지 않는다.
      - name: Refresh glossary case counts (findings_search RPC, anon)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # 같은 화면의 두 언어판이므로 둘이 연달아 성공해야만 아래에서 커밋한다.
          # anon만 쓴다. service role은 RLS를 우회해 공개 페이지에 없는 수를 광고한다.
          run_pass() { # $1=data path $2=report path $3=orig-lang
            python glossary_cases_refresh.py \
              --supabase-url "$SUPABASE_URL" \
              --supabase-anon-key "$SUPABASE_ANON_KEY" \
              --large-change-pct "$LARGE_CHANGE_PCT" \
              --fail-abort-pct "$FAIL_ABORT_PCT" \
              --path "$1" \
              --orig-lang "$3" \
              --report "$2"
          }
          run_pass "$DATA_PATH" "$REPORT_PATH" "" || exit 1
          run_pass "$DATA_PATH_EN" "$REPORT_PATH_EN" "en" || exit 1
      - name: Detect meaningful changes
        id: changes
        run: |
          if git diff --quiet -- "$DATA_PATH" "$DATA_PATH_EN"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No glossary case count changes; no PR will be created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze renderer-produced goldens
        if: steps.changes.outputs.changed == 'true'
        run: python web/tests/test_render.py --freeze
      - name: Read combined gate decision
        if: steps.changes.outputs.changed == 'true'
        id: gate
        run: |
          set -euo pipefail
          allowed=true
          for report in "$REPORT_PATH" "$REPORT_PATH_EN"; do
            if [ "$(jq -r '.gate.automatic_merge_allowed' "$report")" != true ]; then
              allowed=false
            fi
          done
          count() { [ -f "$1" ] && jq '.items | length' "$1" || echo 0; }
          BEFORE='${{ steps.before.outputs.items }}'
          AFTER=$(( $(count "$DATA_PATH") + $(count "$DATA_PATH_EN") ))
          if [ "$BEFORE" -gt 0 ] && [ $(( (BEFORE - AFTER) * 100 )) -ge $(( BEFORE * SHRINK_PCT )) ]; then
            allowed=false
            echo "사례 링크 수 ${BEFORE} → ${AFTER} (축소 ${SHRINK_PCT}% 이상) — 사람 검토로 남깁니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
      - name: Commit and open candidate PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATA_PATH" "$DATA_PATH_EN" "$REPORT_PATH" "$REPORT_PATH_EN" web/tests/golden
          git commit -m "chore: refresh glossary case counts"
          git push -u origin "$BRANCH"
          COUNTS=$(for report in "$REPORT_PATH" "$REPORT_PATH_EN"; do jq -r '(.orig_lang // "ko") as $lang | .counts | "\($lang): 갱신 \(.updated) · 무변동 \(.unchanged) · 0건 \(.zero_kept) · 변동큼 \(.large_change) · 실패 \(.failed)"' "$report"; done)
          REASONS=$(for report in "$REPORT_PATH" "$REPORT_PATH_EN"; do jq -r '(.orig_lang // "ko") as $lang | if (.gate.review_reasons | length) == 0 then "- \($lang): None (automatic merge eligible)" else .gate.review_reasons | map("- \($lang): " + .) | join("\n") end' "$report"; done)
          WARNINGS=$(for report in "$REPORT_PATH" "$REPORT_PATH_EN"; do jq -r '.warnings | if length == 0 then "" else map("- " + .) | join("\n") end' "$report"; done)
          cat > /tmp/pr-body.md <<EOF
          Automated weekly refresh of Korean and English glossary case-count links (findings_search RPC, same function as each /findings/ tree).

          ## Counts
          $COUNTS

          ## Safety gates
          - Thresholds: large_change_pct=${LARGE_CHANGE_PCT}% (flagged, value still applied) · fail_abort_pct=${FAIL_ABORT_PCT}% (would abort with no write)
          - Korean \`q\` and \`excluded\` remain human-curated. English candidates are every \`term_en\`, queried with \`p_orig_lang=en\`; a 0-result candidate is explicitly excluded.

          ## Review reasons
          $REASONS

          ## Warnings
          $WARNINGS

          Live data and renderer-produced goldens are committed together. Automatic merge occurs only after the explicit GRM CI dispatch succeeds.
          EOF
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh glossary case counts" \
            --body-file /tmp/pr-body.md
          PR_NUMBER=$(gh pr view "$BRANCH" --json number -q .number)
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Mark review-required candidate
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed != 'true'
        run: gh pr edit "${{ steps.pr.outputs.number }}" --add-label automation-warning
      - name: Dispatch CI gate
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed == 'true'
        id: ci
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run grm-ci.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow grm-ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .createdAt >= \"$STARTED\") | .databaseId" \
              | head -n 1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -n "$RUN_ID" ] || { echo "CI dispatch run not found" >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --exit-status
      - name: Merge only after green CI
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed == 'true'
        run: gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
      - name: Summary
        if: always()
        run: |
          for report in "$REPORT_PATH" "$REPORT_PATH_EN"; do
          if [ -f "$report" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          done
