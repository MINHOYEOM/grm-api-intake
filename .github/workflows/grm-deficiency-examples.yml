name: GRM Deficiency Examples (PMDA annual list / MHRA deficiency data)

# 업체명 없는 실사 지적 사례 모음 수집 — 일본 PMDA 연차보고서 별첨 "지적사항 일람"(xlsx) ·
# 영국 MHRA GMP 지적 원자료(2018·2019 xlsx, 2015·2016 Trend PDF).
# 수집기: collect_deficiency_examples.py · 표: web/migrations/134_deficiency_examples.sql
#
# ★독립 경로 — 일일 intake(grm-intake.yml)·Notion·findings·주간 브리프와 무관하다.
# ★쓰기 게이트 두 겹: repo 변수 ENABLE_DEFICIENCY_EXAMPLES=true(기본 off) **그리고** --apply.
#   - schedule: --apply 를 넘긴다 → 변수가 off 면 dry-run(받기·파싱·구조 검증·새 파일 감지만).
#   - dispatch: dry_run=true(기본)면 --apply 를 안 넘긴다. 1회 백필 = dispatch dry_run=false.
# ★멱등: (source_key,row_no) upsert + content_hash 비교 + 이번에 없는 행 삭제. 원천 sha256 이 장부와 같으면
#   그 파일은 건너뛴다 → 매월 돌아도 바뀐 게 없으면 쓰기 0.
# ★새 연도 감지: PMDA 는 연 1회(7~11월) 새 별첨을 붙이는데 게시 달이 해마다 다르다 → 월 1회 목록 페이지를
#   다시 읽는다. 코드(SOURCES)에 없는 xlsx 가 보이면 exit 3 → schedule 이면 이슈. 사람이 SOURCES 에 한 줄
#   추가한다(형식이 바뀌었을 수 있어 자동 적재하지 않는다).
# ★실패(받기·구조 검증·DB) → exit 2 → schedule 이면 이슈(제목 고정·20시간 스로틀).
on:
  schedule:
    # 매월 9일 04:29 UTC = 13:29 KST. 일일 intake(18:17 UTC)·findings 백필(00/06/12:17 UTC)과 겹치지 않는다.
    - cron: '29 4 9 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = 쓰지 않는다(기본). false 여도 repo 변수 ENABLE_DEFICIENCY_EXAMPLES=true 일 때만 쓴다.'
        type: boolean
        default: true
      only:
        description: '쉼표 목록 — source_key(pmda:000281968) 또는 기관(pmda, mhra). 비우면 전부.'
        type: string
        default: ''

permissions:
  contents: read
  issues: write   # 마지막 스텝(schedule 실패·새 파일 이슈) 전용

concurrency:
  group: deficiency-examples
  cancel-in-progress: false

jobs:
  collect:
    name: Collect deficiency examples (no git writes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SUPABASE_* 는 grm-intake.yml 과 같은 secret/var 재사용 — 신규 등록 불필요.
      - name: Run collector
        id: run
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENABLE_DEFICIENCY_EXAMPLES: ${{ vars.ENABLE_DEFICIENCY_EXAMPLES || 'false' }}
          ONLY: ${{ inputs.only }}
        run: |
          ARGS=(--discover --output deficiency_report.json --raw-dir deficiency_raw)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS+=(--apply)
          elif [ "${{ inputs.dry_run }}" = "false" ]; then
            ARGS+=(--apply)
          fi
          if [ -n "$ONLY" ]; then
            ARGS+=(--only "$ONLY")
          fi
          python collect_deficiency_examples.py "${ARGS[@]}"

      - name: Upload raw files + report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deficiency-examples-${{ github.run_id }}
          path: |
            deficiency_report.json
            deficiency_raw/
          retention-days: 90
          if-no-files-found: warn

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### GRM Deficiency Examples"
            echo ""
            echo "event: \`${{ github.event_name }}\` · ENABLE_DEFICIENCY_EXAMPLES: \`${{ vars.ENABLE_DEFICIENCY_EXAMPLES || 'false' }}\`"
            echo ""
            if [ -f deficiency_report.json ]; then
              python - <<'PY'
          import json
          r = json.load(open("deficiency_report.json", encoding="utf-8"))
          print(f"mode: **{r['mode']}** · failures: {len(r['failures'])} {r['failures'][:5]}")
          print("")
          print("| 원천 | 기관 | 연도 | 언어 | 행 | 문장 | 조항 비율 | 쓰기 / 오류 |")
          print("|---|---|---:|---|---:|---:|---:|---|")
          for e in r["sources"]:
              s = e.get("summary") or {}
              w = e.get("error") or e.get("write") or "-"
              print(f"| {e['key']} | {e['agency']} | {e['year']} | {e['lang']} | {s.get('rows', '-')} | "
                    f"{s.get('with_statement', '-')} | {s.get('clause_rate', '-')} | {w} |")
          d = r.get("discover") or {}
          if d.get("new_files"):
              print("")
              print("**새 파일(SOURCES 에 없음):**")
              for f in d["new_files"]:
                  print(f"- {f['agency']} {f['lang']} {f['url']} — {f['label']}")
          PY
            else
              echo "deficiency_report.json 미생성 — 인자/자격증명 단계에서 조기 종료"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface scheduled failure or new file
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const fs = require('fs');
            let r = null;
            try { r = JSON.parse(fs.readFileSync('deficiency_report.json', 'utf8')); } catch (e) { r = null; }
            const failures = (r && r.failures) || [];
            const newFiles = (r && r.discover && r.discover.new_files) || [];
            let title, body;
            if (r && failures.length === 0 && newFiles.length > 0) {
              title = '실사 지적 사례 — 새 원천 파일 발견';
              body = [
                '월간 점검(grm-deficiency-examples.yml)이 목록 페이지에서 코드에 없는 xlsx 를 찾았습니다(PMDA 새 연도 별첨일 가능성이 높다).',
                '',
                `- 실행: ${runUrl}`,
                ...newFiles.slice(0, 10).map((f) => `- ${f.agency} ${f.lang}: ${f.url} — ${f.label}`),
                '',
                '할 일: 아티팩트로 파일을 열어 형식을 확인하고 collect_deficiency_examples.SOURCES 에 한 줄 추가(연도·언어·min_rows) → PR → 머지 후 dispatch dry_run=false.',
              ].join('\n');
            } else {
              const kind = (r && r.failure_kind) || '';
              title = '실사 지적 사례 수집 실패';
              let cause;
              if (kind === 'structure') {
                cause = '원인: **원천 형식 변경 의심(구조 검증 실패)** — 머리글 열·행 수 하한·제목 연도 중 하나가 걸렸다. 이 파일은 쓰지 않았다. 아티팩트의 원본으로 파서를 다시 맞춘다.';
              } else if (kind === 'fetch') {
                cause = '원인: **원천 접속 실패** — pmda.go.jp / assets.publishing.service.gov.uk 가 200 이 아니다. 봇 차단이면 우회하지 말고 판정을 다시 한다.';
              } else if (kind === 'db') {
                cause = '원인: **DB 읽기/쓰기 실패** — migration 134 적용 여부, SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY 를 확인한다.';
              } else {
                cause = '원인: 리포트가 없다 — 인자·자격증명 단계에서 멈췄다. 로그를 본다.';
              }
              body = [
                '월간 실사 지적 사례 수집(grm-deficiency-examples.yml, schedule)이 실패했습니다.',
                '',
                `- 실행: ${runUrl}`,
                `- 실패 종류: \`${kind || '알 수 없음'}\``,
                ...failures.slice(0, 10).map((f) => `- \`${f}\``),
                '',
                cause,
                '',
                '원천이 연 1회 갱신이라 한 달 늦어도 잃는 데이터는 없다. 복구되면 사람이 닫는다.',
              ].join('\n');
            }
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'automation-failure', per_page: 50,
            });
            const existing = open.find((i) => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['automation-failure'], assignees: [owner],
              });
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: existing.number, per_page: 100,
            });
            const recent = comments.some((c) => Date.now() - new Date(c.created_at).getTime() < 20 * 3600 * 1000);
            if (!recent) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: `다시 발생 (${runUrl}).\n\n${body}`,
              });
            }
