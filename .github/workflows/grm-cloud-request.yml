name: GRM Cloud Request (클라우드 요청 마커 → 허용목록 워크플로)

# 클라우드 세션은 워크플로를 직접 깨울 수 없다(`/actions` 403). 대신 브랜치 `claude/request-*` 에
# `company/requests/<id>.json` 하나를 push 하면 이 워크플로가 요청을 검증하고, **허용목록의 워크플로만** 깨운다.
# 결과는 `claude/ops-status` 브랜치의 `requests/<id>.json` 에 남는다. 형식·허용목록은 company/ops/cloud_request.py.
#
# 안전 계약
#   · 검증 코드는 main 의 것을 쓴다 — 요청 파일은 데이터로만 읽고, 요청 브랜치의 어떤 코드도 실행하지 않는다.
#   · 허용 동작: ping · ops-status-refresh · delta-bridge · web-publish · scaffold-mirror · wl-restore-plan ·
#     intake · queue-handoff-mirror.
#     발송·머지·발행 승인은 없다. 인자는 정규식·날짜 범위로 좁힌다. 같은 id 는 한 번만 · 시간당 10건.
#   · intake(일일 수집): 오늘(KST) handoff 사본이 claude/queue-handoff 에 있거나, 오늘 시작된 수집이 돌고 있거나
#     성공했으면 깨우지 않는다(outcome skipped · reason). 수집 자신의 정기 슬롯과 같은 일을 할 뿐이다.
#     사본(grm-queue-handoff-mirror, workflow_run)이 따라 돌도록 소유자 PAT(ADMIN_GITHUB_ACTIONS_TOKEN)로 깨운다.
#   · 깨우는 워크플로는 main 판으로 돈다(--ref main). 라이브 발행은 여전히 대표의 관리자 승인.
#   · 요청 한 건 = 마지막 커밋에 추가된 파일 최대 3개.

on:
  push:
    branches:
      - 'claude/request-**'
    paths:
      - 'company/requests/*.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: grm-cloud-request-${{ github.sha }}
  cancel-in-progress: false

jobs:
  handle:
    name: 요청 검증·실행
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: 처리
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_GITHUB_ACTIONS_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::sha 형식"; exit 1; }
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 2 "$REMOTE" "$SHA"
          FILES=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r --root "$SHA" -- 'company/requests/*.json' | head -3)
          [ -n "$FILES" ] || { echo "추가된 요청 파일 없음"; exit 0; }
          # 처리 이력 사본(중복·과다 판정용)
          rm -rf _res && mkdir _res
          if git ls-remote --exit-code --heads "$REMOTE" claude/ops-status >/dev/null 2>&1; then
            git fetch -q --depth 1 "$REMOTE" claude/ops-status
            git archive FETCH_HEAD requests 2>/dev/null | tar -x -C _res || true
          fi
          CR="$GITHUB_WORKSPACE/company/ops/cloud_request.py"
          for f in $FILES; do
            id=$(basename "$f" .json)
            git show "$SHA:$f" > _req.json
            verdict=$(python3 "$CR" check _req.json "$id" _res/requests); rc=$?
            echo "[$id] rc=$rc $verdict"
            if [ $rc -eq 3 ]; then continue; fi          # 이미 처리 · 과다 — 덮어쓰지 않는다
            if [ $rc -ne 0 ]; then
              echo "$verdict" | bash company/ops/ops_branch.sh "request $id rejected" python3 "$CR" result requests "$id" rejected "$SHA"
              continue
            fi
            wf=$(echo "$verdict" | python3 -c 'import json,sys; print(json.load(sys.stdin)["workflow"] or "")')
            action=$(echo "$verdict" | python3 -c 'import json,sys; print(json.load(sys.stdin)["action"])')
            pat=$(echo "$verdict" | python3 -c 'import json,sys; print("1" if json.load(sys.stdin).get("pat") else "")')
            outcome=pinged
            skip=""
            if [ "$action" = "intake" ]; then
              # 오늘 handoff 사본이 있거나 오늘 수집이 돌고 있거나 성공했으면 깨우지 않는다. 확인 실패는 깨운다.
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/grm-intake.yml/runs?branch=main&per_page=30" > _runs.json 2>/dev/null || echo '{}' > _runs.json
              : > _handoffs.txt
              if git ls-remote --exit-code --heads "$REMOTE" claude/queue-handoff >/dev/null 2>&1; then
                { git fetch -q --depth 1 "$REMOTE" claude/queue-handoff && git ls-tree --name-only FETCH_HEAD > _handoffs.txt; } || : > _handoffs.txt
              fi
              skip=$(python3 "$CR" intake-skip _runs.json _handoffs.txt)
            fi
            if [ -n "$skip" ]; then
              outcome=skipped
              echo "[$id] 건너뜀: $skip"
              verdict=$(echo "$verdict" | SKIP="$skip" python3 -c 'import json,os,sys; v=json.load(sys.stdin); v["reason"]=os.environ["SKIP"]; print(json.dumps(v, ensure_ascii=False))')
            elif [ -n "$wf" ]; then
              mapfile -t FIELDS < <(echo "$verdict" | python3 -c 'import json,sys; [print("-f\n%s=%s" % kv) for kv in json.load(sys.stdin)["args"].items()]')
              # 깨운 실행 뒤에 workflow_run 후속(사본 등)이 붙어야 하는 동작은 소유자 PAT 로 깨운다 — GITHUB_TOKEN 으로
              # 깨우면 실행의 주체가 github-actions[bot] 이 되어 후속 워크플로가 안 붙을 수 있다(GitHub 제약).
              DISPATCH_TOKEN="$GH_TOKEN"; ok=dispatched
              if [ -n "$pat" ]; then
                if [ -n "${ADMIN_TOKEN:-}" ]; then DISPATCH_TOKEN="$ADMIN_TOKEN"
                else ok=dispatched-no-pat; echo "::warning::ADMIN_GITHUB_ACTIONS_TOKEN 없음 — $wf 를 GITHUB_TOKEN 으로 깨운다(후속 사본이 안 돌 수 있음)"; fi
              fi
              if GH_TOKEN="$DISPATCH_TOKEN" gh workflow run "$wf" --ref main "${FIELDS[@]}"; then outcome=$ok; else outcome=dispatch-failed; fi
            fi
            echo "$verdict" | bash company/ops/ops_branch.sh "request $id $outcome" python3 "$CR" result requests "$id" "$outcome" "$SHA"
          done
