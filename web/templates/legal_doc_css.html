<style>
/* 개인정보처리방침·이용약관 본문(.legal-doc) — 단독 페이지(legal.html)와 가입 화면 모달이 같은 규칙을 쓴다.
   문서 하나를 두 곳에서 그리므로 본문 크기 위계도 한 곳(여기)에서만 정한다. 제목 30 → 절 18 → 본문 15.5. */
.legal-doc{max-width:780px;padding:48px 0 80px;font-family:var(--sans);color:var(--body-s);word-break:keep-all}
.legal-doc h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.2;color:var(--ink);margin:0 0 10px}
.legal-lead{font-size:14.5px;line-height:1.7;color:var(--muted)}
.legal-lead p{margin:0 0 .6em}
.legal-sec{padding:22px 0 0;margin-top:22px;border-top:1px solid var(--line-2,rgba(26,24,21,.12))}
.legal-sec h2{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.35;color:var(--ink);margin:0 0 10px}
.legal-prose{font-size:15.5px;line-height:1.8;text-wrap:pretty}
.legal-prose p{margin:0 0 .9em}
.legal-prose p:last-child{margin-bottom:0}
.legal-prose ul{margin:0;padding-left:1.15em}
.legal-prose li{margin:0 0 .6em}
.legal-prose strong{font-weight:600;color:var(--ink)}
@media (max-width:640px){.legal-doc{padding:32px 0 56px}.legal-doc h1{font-size:25px}.legal-sec h2{font-size:17px}.legal-prose{font-size:15px}}
/* 가입 화면 모달 — 페이지 이동 없이 같은 본문을 띄운다(가입 폼 입력값 유지). */
.grm-legal-pop{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(26,24,21,.5);padding:20px}
.grm-legal-pop.show{display:flex}
.grm-legal-card{position:relative;display:flex;flex-direction:column;width:100%;max-width:700px;max-height:80vh;background:var(--canvas,#fff);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55)}
.grm-legal-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:26px 30px 6px}
.grm-legal-body:focus{outline:none}
.grm-legal-body .legal-doc{max-width:none;padding:0 0 18px}
.grm-legal-body .legal-doc h1{font-size:21px;margin-bottom:8px;padding-right:28px}
.grm-legal-x{position:absolute;top:10px;right:14px;font-size:22px;line-height:1;color:var(--muted);background:transparent;border:0;cursor:pointer}
.grm-legal-foot{padding:12px 20px;border-top:1px solid var(--line-2,rgba(26,24,21,.12));text-align:right}
.grm-legal-foot button{font-family:var(--sans);font-size:14px;color:#fff;background:var(--coral,#C2603F);border:0;border-radius:var(--rad-s,8px);padding:9px 22px;cursor:pointer}
.grm-legal-x:focus-visible,.grm-legal-foot button:focus-visible{outline:2px solid var(--coral,#C2603F);outline-offset:2px}
@media (max-width:640px){.grm-legal-pop{align-items:flex-end;padding:0}.grm-legal-card{max-width:none;max-height:92vh;border-radius:16px 16px 0 0}.grm-legal-body{padding:22px 20px 4px}}
</style>
