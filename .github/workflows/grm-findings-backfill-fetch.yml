name: GRM Findings Backfill Fetch (F2b/F2c)

# [FIND-1 F2b/F2c] *Historical document fetch* backfill: pulls past FDA 483 /
# FDA Warning Letter documents in chunks and appends them directly to Supabase
# raw_signals (Notion is never written -- the weekly brief queue must not see
# backfill noise), then (unless dry_run) chains the M12 findings backfill
# (findings_supabase_backfill.py) so raw -> findings completes in the same job.
#
# Two trigger modes:
#   - workflow_dispatch (F2b, manual): human picks source/offset/max_docs/dry_run.
#   - schedule, or dispatch with auto=true (F2c, unattended): collect_fda_backfill.py
#     --auto computes everything itself -- offset per source = count of already-
#     collected document_ids, scans forward through cheap existing/gated rows,
#     fetches up to a bounded real-document budget, and attempts WL only after 483
#     is exhausted. Once BOTH backlogs are exhausted the run exits
#     cleanly after a couple of list requests with auto_complete=true in the
#     report -- no document fetches, no wasted work. Leaving the daily cron
#     enabled after backfill completes is therefore harmless and INTENTIONAL: it
#     doubles as an ongoing safety net that picks up any newly-appearing old
#     documents that fall outside the daily collection window.
#
# robots.txt design constraints (do not weaken):
#   - fda.gov robots specifies Crawl-Delay: 30 -- the collector sleeps `delay`
#     seconds (default 30) before every fda.gov request (list AJAX + each doc).
#   - FDA 483 and FDA WL live on the SAME host, so one run handles exactly one
#     source and the concurrency group below forbids two runs racing the same
#     per-host rate budget (cancel-in-progress: false -- queued, never killed).
#   - MFDS/nedrug is excluded from backfill scope entirely: its robots is
#     Disallow: / (no crawling permission).
#
# ★핵심 제약: 이 워크플로는 git 쓰기를 전혀 하지 않는다 -- checkout(read-only)
# 이후 커밋/푸시/PR 생성 스텝이 없다. dry_run=true(기본값)로 먼저 실행해
# 목록/skip 판정을 확인한 뒤, dry_run=false 로 재실행해야 실제 fetch/적재가 된다.
on:
  # F2c daily auto run: 07:17 UTC = 16:17 KST -- deliberately ~11h apart from the
  # daily collection cron (grm-intake.yml, 18:17 UTC) so the two workflows never
  # share the same fda.gov request-budget window.
  schedule:
    # Three bounded runs/day. With 300 real fetches/run and mandatory 30s delay,
    # worst-case fetch sleeping is 150 minutes/run; these windows stay clear of
    # the 18:17 UTC daily intake job.
    - cron: '17 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Which source to backfill (one per run -- same fda.gov host)'
        type: choice
        options:
          - fda483
          - fda_wl
        default: fda483
      offset:
        description: 'DataTables start offset (resume point; see previous run next_offset)'
        type: string
        default: '0'
      max_docs:
        description: 'Max documents to list/fetch this run (DataTables length)'
        type: string
        default: '200'
      dry_run:
        description: 'true = list + skip triage only (no document fetch, no POST)'
        type: string
        default: 'true'
      delay:
        description: 'Seconds to sleep between fda.gov requests (robots Crawl-Delay)'
        type: string
        default: '30'
      auto:
        description: 'true = one F2c --auto pass (ignores source/offset/max_docs/dry_run/delay above)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # 3연속 스케줄 실패 표면화 이슈 생성/코멘트/종료용(2026-09-10)

concurrency:
  group: findings-backfill-fetch
  cancel-in-progress: false

jobs:
  backfill-fetch:
    name: Fetch historical FDA docs into raw_signals (+ M12 findings chain)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # [OCR 엔진 누락 수리 2026-07-30] 이 워크플로는 483 PDF 를 grm-intake 와 **완전히
      # 동일한 코드**(collect_fda_483._fetch_fda483_pdf_text)로 연다. OCR 을 도입한 PR #456 이
      # tesseract 설치를 grm-intake 에만 넣어서, 이쪽은 하루 3회 무인으로 스캔 483 을
      # 본문 없이 raw_signals 에 영구 적재해 왔다(실측 31건 · dedup 때문에 재시도 기회 없음).
      # required=false: WL 백필은 OCR 과 무관하므로 잡을 죽이지 않는다. 대신 엔진이 없으면
      # 483 은 **적재하지 않고 건너뛴다**(collect_fda_backfill.skipped_ocr_unavailable) —
      # 빈 본문을 영구히 박아 넣는 것보다 다음 실행에 다시 시도하는 쪽이 정직하다.
      - name: Install OCR engine (tesseract)
        uses: ./.github/actions/setup-ocr
        with:
          required: 'false'

      # 목록 조회 + (dry_run 아님) 문서 fetch + raw_signals POST. Notion/git 쓰기 없음.
      # SUPABASE_SERVICE_ROLE_KEY 는 grm-intake.yml(M4)·grm-findings-backfill.yml(M12)이
      # 이미 쓰는 동일 secret 재사용 -- 신규 secret/var 등록 불필요.
      - name: Run backfill fetch (no git writes -- list/fetch + raw_signals POST only)
        id: fetch
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; then
            # F2c auto mode: never uses the manual source/offset dispatch inputs
            # (on schedule they are empty anyway). The collector computes each
            # source's scan position and enforces a real-document fetch budget; when
            # both backlogs are exhausted it exits 0 after a couple of list
            # requests with auto_complete=true (cheap steady state -- see header).
            ARGS=(--auto --max-docs 100 --auto-fetch-budget 300 --delay 30 --output fetch_report.json)
          else
            ARGS=(--source "${{ inputs.source }}"
                  --offset "${{ inputs.offset }}"
                  --max-docs "${{ inputs.max_docs }}"
                  --delay "${{ inputs.delay }}"
                  --output fetch_report.json)
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS+=(--dry-run)
            fi
          fi
          python collect_fda_backfill.py "${ARGS[@]}"
          APPENDED=$(python -c "import json; print(json.load(open('fetch_report.json'))['appended'])")
          echo "appended=${APPENDED}" >> "$GITHUB_OUTPUT"
          # [침묵 금지 2026-07-30] OCR 엔진이 없어 483 적재를 보류한 건수를 워크플로
          # 주석으로 띄운다. 단일 소스 리포트와 --auto 병합 리포트가 같은 키를 쓴다.
          SKIPPED=$(python -c "import json; print(json.load(open('fetch_report.json')).get('skipped_ocr_unavailable') or 0)")
          if [ "${SKIPPED}" != "0" ]; then
            echo "::warning title=OCR 엔진 없음(483 적재 보류)::스캔 483 ${SKIPPED}건을 본문 없이 적재하지 않고 보류했다 — 러너 tesseract 설치를 확인하라(.github/actions/setup-ocr)."
          fi

      # [2026-09-10 침묵 실패 수리] 09-09 04:48 UTC 부터 리딩룸이 Akamai 봇매니저에 막혀
      # --auto 스케줄 런이 list-config-failed:RuntimeError 로 4연속 실패했는데(이제
      # collect_fda_backfill.py 가 2차 전수 JSON 백본으로 자동 폴백하지만 그 2차마저
      # 막히면 여전히 exit 2 다), 이 워크플로는 그 실패를 어디에도 표면화하지 않았다
      # (2026-09-02 감사 지적 사항). 매 실패마다 이슈를 열면 잡음이라(하루 3회 스케줄) --
      # "3연속"(현재 실행 포함, listWorkflowRuns 로 직전 2회 확인)일 때만 표면화하고,
      # 제목을 고정해 중복 이슈를 만들지 않는다. dispatch 실패는 사람이 보고 있으므로
      # 대상에서 제외한다(grm-intake.yml 의 스케줄 전용 관용구와 동형).
      - name: Surface persistent failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'GRM Findings Backfill Fetch 연속 실패';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: runsResp } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'grm-findings-backfill-fetch.yml',
              event: 'schedule', per_page: 5,
            });
            const previous = runsResp.workflow_runs
              .filter((r) => r.id !== context.runId)
              .slice(0, 2);
            const isThirdConsecutive = previous.length === 2
              && previous.every((r) => r.conclusion === 'failure');
            if (!isThirdConsecutive) {
              console.log(
                `not yet 3 consecutive scheduled failures (previous conclusions: `
                + `${previous.map((r) => r.conclusion).join(',') || 'n/a'})`,
              );
              return;
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            await ensureLabel('grm-findings', '0e8a16', 'GRM findings pipeline');
            await ensureLabel('automation-failure', 'b60205', 'GRM automation failure');

            let reportSection;
            if (fs.existsSync('fetch_report.json')) {
              try {
                const report = JSON.parse(fs.readFileSync('fetch_report.json', 'utf8'));
                const errors = Array.isArray(report.errors) ? report.errors : [];
                reportSection = [
                  `- backbone: \`${report.backbone ?? 'unknown'}\``,
                  '- errors:',
                  ...(errors.length ? errors.map((e) => `  - \`${e}\``) : ['  - (없음)']),
                ].join('\n');
              } catch (error) {
                reportSection = `fetch_report.json 파싱 실패: ${error}`;
              }
            } else {
              reportSection = 'fetch_report.json 없음 (인자/인증 단계에서 조기 종료됐을 수 있음).';
            }

            const body = [
              'GRM Findings Backfill Fetch(F2b/F2c)가 스케줄 실행에서 3회 연속 실패했습니다.',
              '',
              `- 최신 실행: ${runUrl}`,
              '',
              reportSection,
              '',
              '483 목록은 DataTables 1차 → 전수 JSON 2차. 둘 다 죽었다면 fda.gov 가 러너 IP 를 막고 있는지 확인. 복구되면 이 이슈는 자동으로 닫힌다.',
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'automation-failure', per_page: 50,
            });
            const existing = openIssues.find((i) => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['grm-findings', 'automation-failure'], assignees: [owner],
              });
              console.log('created persistent-failure issue');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: existing.number, per_page: 100,
            });
            const twentyHoursAgoMs = Date.now() - 20 * 60 * 60 * 1000;
            const commentedRecently = comments.some(
              (c) => new Date(c.created_at).getTime() > twentyHoursAgoMs,
            );
            if (commentedRecently) {
              console.log('a comment was already posted within the last 20h -- skipping');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: `여전히 실패 중입니다 (${runUrl}).`,
            });
            console.log(`commented on existing issue #${existing.number}`);

      # 복구 확인은 스케줄 실행이 실제로 성공했을 때만 한다(dispatch 는 사람이 보고 있으므로
      # 제외 -- 위 표면화 스텝과 대칭). 열린 이슈가 없으면 조용히 아무 것도 하지 않는다.
      - name: Close persistent-failure issue on recovery
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'GRM Findings Backfill Fetch 연속 실패';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'automation-failure', per_page: 50,
            });
            const existing = openIssues.find((i) => i.title === title);
            if (!existing) {
              console.log('no open persistent-failure issue; nothing to close');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: `복구 확인: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: existing.number, state: 'closed',
            });
            console.log(`closed persistent-failure issue #${existing.number}`);

      # dry_run 이 아니고 이번 실행에서 raw_signals 가 실제 추가됐을 때만 M12 체인:
      # 방금 적재된 raw 를 같은 잡에서 findings 로 변환해 백필을 완결한다.
      # auto 경로(schedule 또는 dispatch auto=true)는 dry_run 이 아니므로 -- dispatch 의
      # dry_run 기본값('true')이 남아 있어도 -- appended>0 이면 체인이 그대로 실행된다.
      - name: Chain M12 findings backfill (raw -> findings)
        if: ${{ (github.event_name == 'schedule' || inputs.auto == true || inputs.dry_run != 'true') && steps.fetch.outputs.appended != '0' && steps.fetch.outputs.appended != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python findings_supabase_backfill.py | tee m12_report.json

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### GRM Findings Backfill Fetch (F2b/F2c)"
            echo ""
            echo "event: \`${{ github.event_name }}\` / auto: \`${{ github.event_name == 'schedule' || inputs.auto == true }}\`"
            echo ""
            echo "source: \`${{ inputs.source }}\` / offset: \`${{ inputs.offset }}\` / max_docs: \`${{ inputs.max_docs }}\` / dry_run: \`${{ inputs.dry_run }}\` / delay: \`${{ inputs.delay }}\` (dispatch inputs -- auto 실행에서는 비어 있거나 무시됨)"
            echo ""
            if [ -f fetch_report.json ]; then
              echo "#### Fetch report (collect_fda_backfill.py)"
              echo '```json'
              cat fetch_report.json
              echo '```'
            else
              echo "fetch_report.json 이 생성되지 않았습니다 (인자/인증/목록 접근 실패로 exit 2 조기 종료 가능 -- SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY 확인)."
            fi
            echo ""
            if [ -f m12_report.json ]; then
              echo "#### M12 findings backfill report (findings_supabase_backfill.py)"
              echo '```json'
              cat m12_report.json
              echo '```'
            else
              echo "(M12 체인 미실행 -- dry_run 이거나 appended=0)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
