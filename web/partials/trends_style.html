<style>
/* [F3b] 한국어 어절 줄바꿈(§1 P0, findings.html 과 동일 스코프). */
main{word-break:keep-all;overflow-wrap:anywhere}
/* [F3c] 히어로 설명 — grm.css .page-head p 의 62ch 캡(영문 기준 가독폭)을 이 페이지
   스코프에서만 해제. 한글은 음절당 폭이 넓어 62ch 이 실제로는 한 줄에 다 안 들어가는
   길이라 뷰포트 우측에 여백이 남는데도 불필요하게 2줄로 접혔다 — .wrap 폭까지 그대로
   펴지게 한다.
   [줄맞춤] balance 는 쓰지 않는다: 두 줄 길이를 맞추려고 첫 문장 한가운데를 끊어
   목적어와 서술어를 갈라 놓았다. 대신 문장마다 .ln 블록을 두어 줄바꿈을 문장 경계에
   고정하고, 한 문장이 한 줄에 안 들어가는 좁은 뷰포트에서는 그 문장 안에서만 접히게
   한다(pretty — 마지막 줄에 한 어절만 남는 고아 줄 방지). */
.page-head p{max-width:none;text-wrap:pretty}
.page-head p .ln{display:block}

/* 로딩 스켈레톤 — 은은한 펄스(절제), reduce-motion 존중. */
{#- min-height 예약(CLS): 통계 본문(#tr-content)은 hidden 으로 시작해 trends.js 가 데이터
    수신 후 공개한다. 예약 없이는 공개 전 구독밴드·푸터가 첫 화면 안(실측 ~420px)에 있다가
    공개 순간 수천 px 아래로 밀려 RUM CLS Poor(0.687)를 만들었다 — 로딩/에러 셸이 뷰포트
    잔여 높이(콘텐츠 시작 실측 ~307px + 여유)를 차지해 아래 요소를 처음부터 화면 밖에 둔다. -#}
.tr-state{padding:14px 0;min-height:max(320px,calc(100vh - 200px))}
.tr-state-error{padding:60px 20px;text-align:center;color:var(--coral-2);font-size:14px}
.tr-skel-row{height:16px;border-radius:6px;background:var(--strong);margin-bottom:12px;animation:trPulse 1.7s ease-in-out infinite}
.tr-skel-row.w1{width:60%}
.tr-skel-row.w2{width:88%}
.tr-skel-row.w3{width:72%}
@keyframes trPulse{0%,100%{opacity:.55}50%{opacity:.92}}
@media(prefers-reduced-motion:reduce){.tr-skel-row{animation:none;opacity:.7}}

/* 스탯 스트립 — 큰 세리프 숫자 + 산세리프 muted 라벨. */
.tr-stats{display:flex;flex-wrap:wrap;gap:44px;margin:6px 0 30px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.tr-stat{display:flex;flex-direction:column;gap:4px;position:relative}
.tr-stat-num{display:block;font-family:var(--serif);font-size:32px;font-weight:600;color:var(--ink);line-height:1.05;font-variant-numeric:lining-nums}
.tr-stat-lbl{display:block;font-size:12.5px;color:var(--muted)}
.tr-stat-note{display:block;font-size:11px;color:var(--muted-2);margin-top:3px;white-space:nowrap}
/* 콜아웃('먼저 알아두세요')과 첫 섹션(카테고리 순위) 사이 간격 — 예전 헤드라인이 하던
   역할을 대신한다(.imp 는 하단 margin 이 없어 헤드라인 제거 후 바짝 붙었다). */
#tr-coverage-note{margin-bottom:40px}

/* 한눈 요약 헤드라인 — 세리프 풀쿼트 톤. */

.tr-block{margin:0 0 46px}
.tr-h{font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.tr-empty{font-size:12.5px;color:var(--muted);margin:0}
.tr-note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.55;text-wrap:balance}
.tr-note[hidden]{display:none}
/* [13차] "이 그래프를 읽는 법" — 제목과 차트 사이 한두 문장. 전 직원 대상이라 전문용어를
   쓰지 않고, 폭 캡(ch)은 두지 않는다(한글 조기 wrap 방지 — §1 P0 관례). */
.tr-read{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 18px;text-wrap:pretty}
.tr-read[hidden]{display:none}
/* 섹션 안의 소제목(최근 12개월 순위·증감 2열) — .tr-h 와 같은 톤이되 한 단계 아래. */
.tr-sub-h{font-size:11.5px;font-weight:600;color:var(--muted);margin:28px 0 6px}
.tr-sub-h[hidden]{display:none}
.tr-move-cols .tr-sub-h{margin-top:0}

/* ── [최근 12개월] 월별 문서 수 막대(24개월) ──────────────────────────────
   최근 12개월은 coral, 직전 12개월은 ink 저채도로 같은 축 위에 나란히 둔다 —
   신규 팔레트 없이 두 구간을 구분한다(zone 패널의 2시리즈 관례와 동형). */

/* 최근 12개월 카테고리 순위 — 행 클릭 시 실제 지적 사례가 아래로 펼쳐진다. */
.tr-recent-cats{display:flex;flex-direction:column;gap:0}
.tr-rc-row{display:flex;align-items:center;gap:14px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:6px;cursor:pointer}
.tr-rc-row:hover,.tr-rc-row:focus-visible{background:var(--strong);outline:none}
.tr-rc-row.on{background:var(--coral-tint)}
.tr-rc-rank{flex:0 0 20px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.tr-rc-label{flex:0 0 190px;max-width:190px;font-size:14px;color:var(--body-s);line-height:1.35}
.tr-rc-track{flex:1 1 auto;height:10px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-rc-bar{height:100%;width:100%;border-radius:99px;background:var(--coral);transform-origin:left}
.tr-rc-docs{flex:0 0 auto;min-width:124px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr-rc-caret{flex:0 0 14px;text-align:center;font-size:10px;color:var(--muted-2)}

/* 실제 지적 사례 패널 — 026 findings_search(공개 게이트 RLS 통과분)로만 채운다. */
.tr-ex{margin:2px 0 10px;padding:16px 18px 14px;border:1px solid var(--line-2);border-radius:var(--rad-s);background:var(--soft)}
.tr-ex-item{padding:11px 0;border-bottom:1px solid var(--line)}
.tr-ex-item:last-of-type{border-bottom:none}
.tr-ex-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 5px}
.tr-ex-text{font-size:13px;line-height:1.75;color:var(--body-s);margin:0}
.tr-ex-foot{margin:12px 0 0;font-size:12.5px}
.tr-ex-more{font-weight:500;color:var(--coral-2)}
.tr-ex-more:hover{color:var(--coral)}

/* ── [FDA 의약품 GMP 실사 등급] 058_fda_inspection_stats() 전용 ──────────────
   findings 계열과 다른 소스라 새 톤을 만들지 않는다 — .tr-stats/.tr-cat-* 색·간격
   토큰을 그대로 재사용(신규 팔레트 0). NAI/VAI/OAI 3색은 채도 단계만 다르다
   (OAI=coral 진함, VAI=coral 옅음, NAI=line — coral 은 "문제"를 가리키는 이 페이지의
   기존 관례라 등급이 나쁠수록 coral 을 진하게 쓴다). */
.tr-fda-scope{font-size:12px;color:var(--muted);margin:0 0 5px;line-height:1.6}
/* [기준일] 059 의 scope 신선도 2키. 범위 고지(.tr-fda-scope)보다 한 톤 진하게 둔다 —
   "언제 기준 숫자인가"가 먼저 눈에 들어와야 한다. 059 미적용 라이브에서는 trends.js 가
   아무 문구도 넣지 않아 빈 문단으로 남는다(높이 0, 위아래 여백만 유지). */
.tr-fda-asof{font-size:12px;color:var(--body-s);margin:0 0 18px;line-height:1.6}
.tr-fda-stats{margin:0 0 26px;padding-bottom:0;border-bottom:none}
.tr-fda-year{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.tr-fda-y-row{display:flex;align-items:center;gap:10px;padding:6px 2px}
.tr-fda-y-label{flex:0 0 58px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr-fda-y-track{flex:1 1 auto;display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--line)}
.tr-fda-y-seg{height:100%}
.tr-fda-y-seg.nai{background:var(--line-2)}
.tr-fda-y-seg.vai{background:var(--coral);opacity:.42}
.tr-fda-y-seg.oai{background:var(--coral)}
.tr-fda-y-oai-pct{flex:0 0 78px;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--coral-2)}
.tr-fda-y-total{flex:0 0 58px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.tr-fda-y-legend{display:flex;gap:16px;margin:6px 2px 0;font-size:11px;color:var(--muted)}
.tr-fda-y-key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tr-fda-y-key.nai{background:var(--line-2)}
.tr-fda-y-key.vai{background:var(--coral);opacity:.42}
.tr-fda-y-key.oai{background:var(--coral)}
.tr-fda-country{display:flex;flex-direction:column;gap:0}
.tr-fda-c-row{display:flex;align-items:center;gap:12px;padding:7px 8px;border-bottom:1px solid var(--line);border-radius:6px}
.tr-fda-c-row.is-kr{background:var(--coral-tint);border-bottom-color:transparent}
.tr-fda-c-label{flex:0 0 130px;max-width:130px;font-size:13px;color:var(--body-s);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-fda-c-row.is-kr .tr-fda-c-label{font-weight:600;color:var(--ink)}
.tr-fda-c-track{flex:1 1 auto;height:8px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-fda-c-bar{height:100%;border-radius:99px;background:var(--coral);transform-origin:left}
.tr-fda-c-count{flex:0 0 auto;min-width:56px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr-fda-c-oai{flex:0 0 auto;min-width:126px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--coral-2)}
@media(max-width:640px){
  .tr-fda-c-label{flex-basis:90px;max-width:90px}
  .tr-fda-c-oai{min-width:96px}
}

/* ── [달라진 점] 증감 2열 ────────────────────────────────────────────────── */
.tr-move-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px 40px}
@media(max-width:760px){.tr-move-cols{grid-template-columns:1fr}}
.tr-mv-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tr-mv-row:last-child{border-bottom:none}
.tr-mv-label{flex:1 1 auto;min-width:0;font-size:13.5px;color:var(--body-s)}
/* 건수 병기 — "비중이 줄었다"가 "건수가 줄었다"로 읽히는 오독을 막는 자리다. */
.tr-mv-cnt{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted-2);margin-top:3px}
.tr-mv-shift{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;color:var(--muted-2);white-space:nowrap}
.tr-mv-badge{flex:0 0 auto;min-width:54px;text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted)}
.tr-mv-up .tr-mv-badge{color:var(--coral-2)}

/* ── [인용 조항] 조항 순위 — 행 클릭 시 사례 + 조문 링크가 펼쳐진다 ───────── */
.tr-cfr-sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.6}
.tr-cfr{display:flex;flex-direction:column;gap:0}
.tr-cf-row{display:flex;align-items:center;gap:14px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:6px;cursor:pointer}
.tr-cf-row:hover,.tr-cf-row:focus-visible{background:var(--strong);outline:none}
.tr-cf-row.on{background:var(--coral-tint)}
.tr-cf-rank{flex:0 0 20px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
/* 조항 번호는 mono 로 고정폭 — 목록에서 세로로 자릿수가 맞아야 훑어진다. */
.tr-cf-sec{flex:0 0 86px;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--coral-2)}
.tr-cf-name{flex:0 0 250px;max-width:250px;font-size:13.5px;color:var(--body-s);line-height:1.35}
.tr-cf-track{flex:1 1 auto;height:9px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-cf-bar{height:100%;width:100%;border-radius:99px;background:var(--coral);transform-origin:left}
.tr-cf-docs{flex:0 0 auto;min-width:138px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr-cf-recent{display:block;font-size:10.5px;color:var(--muted-2);margin-top:2px}
.tr-cf-caret{flex:0 0 14px;text-align:center;font-size:10px;color:var(--muted-2)}
/* 조문 링크 줄 — 사례 패널 머리에 둔다(사례보다 조문이 먼저 필요한 경우가 많다). */
.tr-cf-links{margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:12.5px}
.tr-cf-link{font-weight:500;color:var(--coral-2)}
.tr-cf-link:hover{color:var(--coral)}
.tr-cf-variants{display:block;margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--muted-2)}
/* 체크리스트 진입 — 순위(읽는 자료)에서 산출물(받아 쓰는 표)로 넘어가는 자리. */
.tr-cfr-cta{margin:16px 0 0;font-size:13px}
.tr-cfr-cta a{font-weight:500;color:var(--coral-2)}
.tr-cfr-cta a:hover{color:var(--coral)}

/* ── [업체 찾기] 검색 상자 + 결과 목록 ───────────────────────────────────── */

/* 전 기간 누적 구간 시작을 알리는 구분선 — 위 최근 12개월과 분모가 다르다는 사실을
   화면에서 한 번 끊어 알린다. */

/* 카테고리 순위 — 상위 10, coral 단색 순위별 농도(opacity, JS 계산). */
.tr-cat{display:flex;flex-direction:column;gap:2px}
.tr-cat-row{display:flex;align-items:center;gap:14px;padding:9px 6px;border-radius:8px;text-decoration:none}
.tr-cat-row:hover,.tr-cat-row:focus-visible{background:var(--strong);outline:none}
.tr-cat-row:hover .tr-cat-label,.tr-cat-row:focus-visible .tr-cat-label{color:var(--coral-2)}
.tr-cat-rank{flex:0 0 20px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.tr-cat-label{flex:0 0 200px;max-width:200px;font-size:14px;color:var(--body-s);line-height:1.35}
.tr-cat-track{flex:1 1 auto;height:10px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-cat-bar{height:100%;width:100%;border-radius:99px;background:var(--coral);transform-origin:left}
.tr-cat-count{flex:0 0 auto;min-width:66px;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
/* [13차] 구성비(%) — 절대 건수 옆에 항상 병기해 "전체에서 얼마나"를 바로 읽게 한다. */
.tr-cat-share{flex:0 0 auto;min-width:44px;text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--coral-2)}

/* 연도별 구성비 히트맵(H1) — coral 농도 테이블, 가로 스크롤(모바일 대응), 첫 열
   고정폭 좌측정렬(카테고리 라벨은 sticky 로 스크롤 시에도 식별 가능하게 유지). */
.tr-heatmap-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad-s)}
.tr-heatmap-table{border-collapse:collapse;width:100%;min-width:560px}
.tr-heatmap-caption{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tr-heatmap-corner,.tr-heatmap-rowhead{position:sticky;left:0;background:var(--canvas);z-index:1}
.tr-heatmap-corner{width:168px;min-width:168px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line-2)}
/* 연도 헤더는 연도 + 그 해 총건수(분모)를 함께 적는다 — %만 보면 표본 크기를 알 수 없어
   적은 표본의 큰 %를 과대해석하게 된다. */
.tr-heatmap-yearhead{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted);text-align:center;padding:8px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tr-heatmap-yearhead span{display:block}
.tr-heatmap-yearbase{font-size:9.5px;font-weight:400;color:var(--muted-2);margin-top:2px}
.tr-heatmap-rowhead{width:168px;min-width:168px;max-width:168px;text-align:left;font-size:13px;color:var(--body-s);font-weight:400;padding:8px 14px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-heatmap-cell{min-width:44px;height:34px;text-align:center;font-family:var(--mono);font-size:11.5px;border:1px solid var(--canvas)}
.tr-heatmap-cell-empty{background:var(--line)}
.tr-heatmap tbody tr:nth-child(odd) .tr-heatmap-rowhead{background:var(--canvas)}
.tr-heatmap tbody tr:nth-child(even) .tr-heatmap-rowhead{background:var(--soft)}

/* 연도별 공개량 — 세로 미니 바(트랙+coral 채움). 건수 아래 전체 대비 비중을 병기해
   "한 해가 전체의 몇 %를 차지하는지"(=공개 배치 편중)를 숨기지 않는다. */
.tr-year-bars{display:flex;align-items:flex-end;gap:8px}
.tr-year-col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tr-year-barwrap{height:120px;width:100%;max-width:36px;display:flex;align-items:flex-end;border-radius:6px 6px 0 0;background:var(--coral-tint);overflow:hidden}
.tr-year-bar{width:100%;background:var(--coral)}
.tr-year-lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.tr-year-count{font-family:var(--mono);font-size:10.5px;color:var(--body-s);margin-top:-2px}
.tr-year-share{font-family:var(--mono);font-size:10px;color:var(--muted-2);margin-top:-3px}

/* 업체 랭킹 Top 30 — 2열 반응형. */
.tr-firms{display:grid;grid-template-columns:1fr 1fr;gap:2px 30px}
.tr-firm-row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:6px;cursor:pointer}
.tr-firm-row:hover,.tr-firm-row:focus-visible{background:var(--strong);outline:none}
.tr-firm-row.on{background:var(--coral-tint)}
.tr-firm-rank{flex:0 0 24px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.tr-firm-name{flex:1 1 auto;min-width:0;font-size:13.5px;color:var(--body-s);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-firm-bar{flex:0 0 64px;height:6px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-firm-bar-fill{height:100%;background:var(--coral)}
.tr-firm-count{flex:0 0 42px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
@media(max-width:860px){.tr-firms{grid-template-columns:1fr}}

/* 업체 상세 패널 — 랭킹 아래 삽입, 닫기 가능. */
.tr-firm-detail{margin-top:22px;padding:24px 26px;border:1px solid var(--line-2);border-radius:var(--rad);background:var(--canvas)}
/* [업체 프로파일 진입] 패널 최상단 링크 — findings.html 의 .fnd-trends-link 관례와
   동일한 절제된 텍스트 링크(신규 CSS, grm.css 는 무변경 — 이 페이지 스코프 <style> 에만
   추가). 017_findings_stats_firm_key.sql 미적용 라이브에서는 렌더 자체가 생략된다. */
.tr-fd-profile-link{display:inline-block;margin-bottom:16px;font-size:12.5px;font-weight:500;color:var(--coral-2)}
.tr-fd-profile-link:hover{color:var(--coral)}
.tr-firm-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.tr-firm-detail-name{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);margin:0 0 4px}
.tr-firm-detail-meta{font-size:12.5px;color:var(--muted)}
.tr-firm-detail-close{font:inherit;font-size:20px;line-height:1;color:var(--muted);background:transparent;border:0;cursor:pointer;padding:2px 6px}
.tr-firm-detail-close:hover{color:var(--coral)}
.tr-firm-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:20px}
@media(max-width:640px){.tr-firm-detail-grid{grid-template-columns:1fr}}
.tr-fd-h{font-size:11px;font-weight:600;color:var(--muted);margin:0 0 12px}
.tr-fd-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.tr-fd-label{flex:0 0 130px;max-width:130px;font-size:12.5px;color:var(--body-s)}
.tr-fd-track{flex:1 1 auto;height:7px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-fd-bar{height:100%;width:100%;border-radius:99px;background:var(--coral);transform-origin:left}
.tr-fd-count{flex:0 0 auto;min-width:34px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tr-fd-year-bars{display:flex;align-items:flex-end;gap:6px}
.tr-fd-year-col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.tr-fd-year-barwrap{height:64px;width:100%;max-width:20px;display:flex;align-items:flex-end;border-radius:4px 4px 0 0;background:var(--coral-tint);overflow:hidden}
.tr-fd-year-bar{width:100%;background:var(--coral)}
.tr-fd-year-lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.tr-fd-src-list{font-size:12.5px;color:var(--body-s);line-height:1.6;margin:0}

/* 소스 구성 — 3~4행짜리 목록이라 전폭으로 늘이지 않고 읽기 좋은 폭에서 끊는다
   (13차에 옆 칸이 비면서 2열 그리드 해제). */
.tr-source{max-width:660px}
.tr-src-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.tr-src-label{flex:0 0 150px;max-width:150px;font-size:13px;color:var(--body-s);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-src-track{flex:1 1 auto;height:8px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-src-bar{height:100%;width:100%;border-radius:99px;background:var(--coral);opacity:.75;transform-origin:left}
.tr-src-count{flex:0 0 auto;min-width:52px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr-src-share{flex:0 0 auto;min-width:48px;text-align:right;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--coral-2)}

/* [해외 vs 미국 내 실사] 카테고리별 지적 패턴 비교 — 한 행에 해외/미국 점유율
   막대를 세로로 나란히 둔다. 신규 팔레트 없이 기존 coral(해외) + ink 저채도(미국)
   opacity 로만 두 시리즈를 구분한다. */
.tr-zone-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.6}
.tr-zone{display:flex;flex-direction:column;gap:14px}
.tr-zone-row{padding:10px 0;border-bottom:1px solid var(--line)}
.tr-zone-row:last-child{border-bottom:none}
.tr-zone-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tr-zone-label{font-size:14px;color:var(--body-s);font-weight:500}
/* [해외 상대비 배지] 1.5배 이상 · foreign_cnt 20건 이상인 카테고리에만 붙는다
   (trends.js ZONE_BADGE_RATIO/ZONE_MIN_FOREIGN_SAMPLE 참조). */
.tr-zone-badge{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--coral-2);background:var(--coral-tint);padding:2px 8px;border-radius:99px}
.tr-zone-bars{display:flex;flex-direction:column;gap:6px}
.tr-zone-barline{display:flex;align-items:center;gap:10px}
.tr-zone-tag{flex:0 0 32px;font-size:11px;color:var(--muted)}
.tr-zone-track{flex:1 1 auto;height:9px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-zone-bar{height:100%;width:100%;border-radius:99px;background:var(--coral);transform-origin:left}
.tr-zone-bar-us{background:var(--ink);opacity:.35}
.tr-zone-pct{flex:0 0 auto;min-width:44px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}

@media(max-width:640px){
  .tr-cat-label{flex-basis:120px;max-width:120px}
  .tr-rc-label{flex-basis:120px;max-width:120px}
  .tr-rc-docs{min-width:84px}
  .tr-stats{gap:28px}
  .tr-stat-num{font-size:26px}
  /* 24개 막대는 좁은 화면에서 라벨이 겹친다 — 막대만 남기고 눈금은 범례·툴팁으로. */
  /* 남은 폭이 20px 남짓이라 막대가 눈금 없는 조각이 된다 — 숫자만 남긴다. */
  .tr-rc-track{display:none}
  .tr-cf-track{display:none}
  /* 고정폭(250px)이면 좁은 화면에서 행 안쪽이 잘린다 — 줄여서 접히게 한다
     (min-width:0 이 없으면 flex 항목이 콘텐츠 폭 아래로 줄지 않는다). */
  .tr-cf-name{flex:1 1 auto;min-width:0;max-width:none}
  .tr-cf-sec{flex:0 0 72px}
  .tr-cf-docs{min-width:76px}
}

/* ══ [존 재편 2026-08-26] 트렌드 존 3면 공용 ══════════════════════════════════
   트렌드 한 페이지에 12개 섹션(데스크톱 10.9화면)이 쌓여 있던 것을 세 면으로
   나눴다 — 지적 경향 / 실사 결과 / 데이터 현황. 세 면이 이 파셜 하나를 함께
   include 하므로 아래 규칙은 세 면 전부에 적용된다(면별 CSS 분기 없음 —
   서브셋을 손으로 나누면 반드시 드리프트한다).
   §4 한글안전: 아래 어떤 규칙도 한글 텍스트에 자간·대문자 변환·모노폰트를 걸지
   않는다(영문 전용 eyebrow 만 base 에서 그렇게 한다). */

/* ── 면 전환 세그먼트 ─────────────────────────────────────────────────────
   nav 탭을 늘리지 않기로 했으므로(저장소 'nav 과밀 금지' 원칙) 존 안에서
   전환한다. 링크는 실제 <a> 다 — JS 없이도 세 면을 오갈 수 있어야 한다. */
.tr-seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 34px;padding-bottom:0;border-bottom:1px solid var(--line)}
.tr-seg a{display:inline-block;padding:9px 16px 11px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--tr),border-color var(--tr)}
.tr-seg a:hover{color:var(--ink)}
.tr-seg a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--coral)}
.tr-seg a:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
@media(max-width:520px){.tr-seg a{padding:9px 11px 11px;font-size:13.5px}}

/* ── 순위 보기 전환 ───────────────────────────────────────────────────────
   '최근 12개월 순위'와 '전체 기간 누적 순위'가 서로 다른 섹션으로 멀리 떨어져
   있어, 분모가 다른 두 표를 같은 것으로 읽는 오독이 구조적으로 생겼다(그 오독을
   막으려고 두 섹션 사이에 구분선 + 해설 문단을 두고 있었다). 같은 자리에서
   보기를 바꾸게 하면 두 수치가 나란히 보이지 않으므로 오독 자체가 사라진다 —
   해설로 막던 것을 구조로 막는다. '해외 vs 미국'도 같은 축(카테고리 순위)이라
   세 번째 보기로 흡수했다. */
.tr-rank-read{margin-top:12px}

/* ── 달라진 점 — 접힘 ─────────────────────────────────────────────────────
   이 섹션이 실제로 산출하는 행 수는 라이브에서 1행이다(증가 1 · 감소 0).
   한 화면을 상시 차지할 근거가 없어 기본 접힘으로 두되, 삭제하지는 않는다 —
   변화가 생기면 그때 펴 보면 된다. summary 에 현재 행 수를 적어 두어 열기 전에
   내용의 유무를 알 수 있게 한다(trends.js renderMovers 가 채운다). */
.tr-fold{border:1px solid var(--line);border-radius:var(--rad-s);background:var(--soft);padding:0}
.tr-fold>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-radius:var(--rad-s)}
.tr-fold>summary::-webkit-details-marker{display:none}
.tr-fold>summary:hover{background:var(--strong)}
.tr-fold>summary:focus-visible{outline:2px solid var(--coral);outline-offset:-2px}
.tr-fold-t{font-size:14.5px;font-weight:600;color:var(--ink)}
.tr-fold-c{font-size:12.5px;color:var(--muted)}
.tr-fold-caret{margin-left:auto;font-size:11px;color:var(--muted-2)}
.tr-fold[open] .tr-fold-caret{transform:rotate(180deg)}
.tr-fold-body{padding:2px 18px 20px}

/* ── 산출물 카드(자가점검 체크리스트) ─────────────────────────────────────
   조항 순위를 받아 쓰는 유일한 산출물인데 nav·footer 어디에도 링크가 없어,
   유일한 진입로가 이 페이지 본문 안 텍스트 링크 한 줄이었다. 같은 자리를
   카드로 키워 '읽는 페이지'에서 '쓰는 산출물'로 넘어가는 지점을 눈에 띄게 한다. */
.tr-cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:22px 0 0;padding:20px 22px;border:1px solid var(--coral);border-radius:var(--rad);background:var(--coral-tint)}
.tr-cta-b{flex:1 1 260px;min-width:0}
.tr-cta-t{display:block;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin:0 0 4px}
.tr-cta-d{display:block;font-size:13px;color:var(--body);line-height:1.6}
.tr-cta-go{flex:0 0 auto;display:inline-block;padding:11px 20px;border-radius:var(--pill);background:var(--coral);color:var(--on-coral);font-size:14px;font-weight:600;transition:background var(--tr)}
.tr-cta-go:hover{background:var(--coral-2);color:var(--on-coral)}
.tr-cta-go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── 다른 면으로 넘기는 꼬리 링크 ─────────────────────────────────────────
   섹션마다 반복되던 커버리지 해설(주석 22개·2,589자)을 '데이터 현황' 면 한 곳으로
   모으고, 각 차트에는 이 한 줄만 남긴다. */
.tr-more{margin:18px 0 0;font-size:13px;color:var(--muted)}
.tr-more a{color:var(--coral-2);border-bottom:1px solid var(--coral-tint)}
.tr-more a:hover{border-bottom-color:var(--coral)}

/* ── [062] 실사일 기준 분기 추이 ──────────────────────────────────────────────
   비율을 주 축으로 그린다(막대 길이 = OAI 비율). 길이가 고르면 "판정 강도가
   안정적"이라는 것이 한눈에 읽혀야 하므로, 분기마다 따로 정규화하지 않고 **고정
   스케일**(0~30%)을 쓴다 — 자기 최댓값 기준으로 정규화하면 모든 막대가 늘 비슷해
   보여서 안정과 변동을 구분할 수 없다. */
.tr-fq{display:flex;flex-direction:column;gap:2px}
.tr-fq-row{display:flex;align-items:center;gap:10px;padding:6px 2px}
.tr-fq-label{flex:0 0 66px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr-fq-track{flex:1 1 auto;height:11px;border-radius:99px;background:var(--coral-tint);overflow:hidden}
.tr-fq-bar{height:100%;border-radius:99px;background:var(--coral)}
.tr-fq-pct{flex:0 0 52px;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--coral-2)}
.tr-fq-total{flex:0 0 56px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.tr-fq-tag{flex:0 0 74px;font-size:11px;color:var(--muted-2)}
/* 아직 채워지는 중인 분기 — 지우지 않고 흐리게 둔다. 감추면 "최근이 없다"로 읽히고,
   그대로 두면 "최근에 줄었다"로 읽힌다. 보이되 다르게 보이는 것이 정답이다. */
.tr-fq-row.is-partial .tr-fq-bar{background:var(--line-2)}
.tr-fq-row.is-partial .tr-fq-pct,.tr-fq-row.is-partial .tr-fq-label{color:var(--muted-2)}

/* 한국 슬라이스 — 연도별 막대는 .tr-fda-y-* 를 그대로 재사용한다(신규 컴포넌트 0). */
.tr-kr-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6}

/* ── [컨셉 재정의 2026-08-26] 기관 선택 ───────────────────────────────────────
   아래 모든 수치의 **분모를 정하는** 컨트롤이라 화면 맨 위에 서고, 라벨이 질문
   형태다("어느 기관 기준으로 볼까요?") — 통계 필터가 아니라 시작 질문이라는 뜻을
   모양으로도 전한다. 선택은 aria-pressed 로 표현한다(탭이 아니라 토글 버튼 묶음 —
   URL 을 바꾸지 않고 같은 페이지의 보기를 바꾸므로 tablist 가 아니다). */
.tr-agency{margin:0 0 30px;padding:18px 20px;border:1px solid var(--line-2);border-radius:var(--rad);background:var(--soft)}
.tr-agency[hidden]{display:none}
.tr-agency-lab{display:block;font-size:13px;color:var(--muted);margin-bottom:11px}
.tr-agency-btns{display:flex;flex-wrap:wrap;gap:8px}
.tr-agency-btn{
  padding:9px 20px;font-family:var(--sans);font-size:14px;color:var(--body-s);
  background:var(--canvas);border:1px solid var(--line-2);border-radius:var(--pill);
  transition:all var(--tr);
}
.tr-agency-btn:hover{border-color:var(--muted);color:var(--ink)}
.tr-agency-btn[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--on-coral);font-weight:600}
.tr-agency-btn:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

/* 순위 섹션의 창·분모 한 줄 — 어느 기관 몇 건이 분모인지 항상 보인다. */
.tr-rank-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6}
</style>
