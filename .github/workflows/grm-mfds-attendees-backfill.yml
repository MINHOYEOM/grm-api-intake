name: GRM MFDS attendee backfill
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제 파생 표 적재. 기본값은 저장 텍스트 dry-run.'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mfds-attendees-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Parse stored text and check the agreed baseline before writing
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          ARGS=(--baseline-report docs/specs/mfds_attendees_baseline_20261019.json --report-path mfds_attendees_report.json)
          if [ "$APPLY" = true ]; then ARGS+=(--apply); fi
          python backfill_mfds_inspection_attendees.py "${ARGS[@]}"
      - name: Preserve anonymous report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mfds-attendees-report
          path: mfds_attendees_report.json
          retention-days: 30
