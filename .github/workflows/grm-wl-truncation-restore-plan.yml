name: GRM WL Truncation Restore Plan

# [WL 절단 복원 · 2026-10-31] 옛 480자 상한(PR #653 전)으로 잘린 FDA Warning Letter findings 의
# 복원 계획을 만든다. raw_signals(편지 전문)는 anon 으로 읽을 수 없어 service-role 키가 있는
# 이곳에서 지금 추출기로 블록을 다시 만들고, 기존 finding_id 에 대응시킨 계획 JSON 을
# **Actions 아티팩트**(wl-truncation-restore-plan, 90일)로 올린다.
#
# ★이 워크플로는 아무것도 쓰지 않는다 — DB 쓰기·git 쓰기 모두 없다(GET 만). 실제 교체는 일일
# 번역 세션이 `gh run download` 로 계획을 받아 국문을 채운 restore 항목을 outbox 배치에 싣고,
# grm-findings-translate-apply.yml 이 옛 본문 md5 대조 뒤 영문·국문을 한 PATCH 로 바꾼다.
# 계획은 다시 돌려도 안전하다 — 이미 복원된 행은 "…" 로 끝나지 않아 후보에서 빠진다.
on:
  workflow_dispatch:
    inputs:
      max_old_chars:
        description: '후보 상한(이 길이 이하이고 "…" 로 끝나는 행). 기본 500 = 옛 480자 절단분. 6100 = 6,000자 문장 경계 절단분(2026-11-10 상한 제거 #1467)까지 포함'
        type: string
        default: '500'

permissions:
  contents: write   # 계획 사본을 claude/ops-status 브랜치에 쓴다(아래 "사본" 스텝). 코드·main 은 건드리지 않는다.

concurrency:
  group: wl-truncation-restore-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Build WL truncation restore plan (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build restore plan (GET only — no DB/git writes)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_MAX_OLD: ${{ inputs.max_old_chars }}
        run: |
          max_old=500
          if printf '%s' "${IN_MAX_OLD:-}" | grep -qE '^[0-9]{3,5}$'; then max_old="$IN_MAX_OLD"; fi
          python backfill_wl_truncation_restore.py \
            --output wl_truncation_restore_plan.json \
            --report-path wl_truncation_restore_report.json \
            --max-old-chars "$max_old"

      - name: Upload restore plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wl-truncation-restore-plan
          path: |
            wl_truncation_restore_plan.json
            wl_truncation_restore_report.json
          retention-days: 90
          if-no-files-found: error

      - name: 클라우드용 사본 (claude/ops-status 브랜치 wl-restore/)
        # 클라우드 세션은 /actions 아티팩트를 못 받는다(company/CLOUD.md). 계획이 8MB 를 넘으면 리포트만 둔다.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash company/ops/ops_branch.sh "wl restore plan" sh -c 'rm -rf wl-restore && mkdir wl-restore && cp ../wl_truncation_restore_report.json wl-restore/ && if [ "$(wc -c < ../wl_truncation_restore_plan.json)" -lt 8000000 ]; then cp ../wl_truncation_restore_plan.json wl-restore/; else echo "계획 8MB 초과 — 사본 생략" >&2; fi'

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### GRM WL Truncation Restore Plan"
            echo ""
            if [ -f wl_truncation_restore_report.json ]; then
              echo '```json'
              cat wl_truncation_restore_report.json
              echo '```'
            else
              echo "리포트가 없습니다 — SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY 또는 조회 실패를 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
