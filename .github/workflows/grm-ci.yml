name: GRM CI (compile + tests)

# push/PR 마다 py_compile + unittest 실행 — 회귀 게이트.
# 수집/Notion 호출 없음(네트워크 불필요).
# 소요 실측: 2026-08 4m40s → 2026-09-04 **9m50s(5,392건)**. 스위트가 반년도 안 돼
# 두 배가 됐고, 10분 상한에 걸려 **테스트가 OK 를 찍은 직후 잡이 cancelled** 됐다
# (초록 로그 + 빨간 체크 — 원인을 헷갈리기 딱 좋은 실패 모양이다). 상한은 '멈춘 잡'을
# 잡으라고 있는 것이지 정상 실행을 자르라고 있는 것이 아니므로 현 소요의 약 2배로 둔다.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # 루트 평면 배치(CLAUDE.md §구조 원칙)를 그대로 신뢰해 *.py 전수 컴파일한다.
      # 수동 열거는 새 모듈이 조용히 게이트를 빠져나가므로 금지 — 목록을 늘리지 말 것.
      - name: py_compile all root modules
        run: |
          shopt -s nullglob
          files=(*.py)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::루트 .py 를 하나도 찾지 못했다 — 글롭이 무너졌다(침묵 통과 방지)"
            exit 1
          fi
          echo "compiling ${#files[@]} root modules:"
          printf '  %s\n' "${files[@]}"
          python -m py_compile "${files[@]}"
      - name: unittest
        run: python -m unittest discover -s tests -v
