name: GRM Delta Bridge (Git editorial return)

# Validates the editorial or backup return and records its delta and scaffold.
# The commit on main triggers grm-web-publish.yml.
#
# 무인 라이브 0: 이 워크플로우는 델타 커밋까지만 — main 에 직접 push 하지만 발행 PR/프리뷰/
# 라이브는 건드리지 않는다(④ grm-web-publish.yml 이하가 별도로 이어받음).
# 수집(grm-intake)·발행(grm-web-publish)·배포(grm-web-deploy)와 별도 파일·별도 트리거·
# 최소권한·독립 재실행(D8).

on:
  schedule:
    # ★ 2회 → 30분 간격 다회 + **비정각**으로 확대(2026-07-20). GitHub 예약 크론은 보장이
    #   아니라 best-effort고, 실측된 실패 양상은 "드롭"보다 **수 시간 지각**이다:
    #     07-13  00:30 미발화 · 03:30 → 04:07Z 발화(37분 지각)
    #     07-20  00:30 미발화 · 03:30 → 04:12Z 발화(42분 지각) · 워치독 01:00 → 04:28Z(3h28m 지각)
    #   두 주 모두 04:0x~04:2xZ 에 몰려 발화했다 = 정각/30분이 부하 피크라 큐가 그때야 풀린다.
    #   09:30 KST 를 약속하는데 13:12 KST 에 도는 크론은 없는 것과 같다.
    #
    #   그래서 ① 분을 **비정각(:07/:37)** 으로 옮기고(grm-intake.yml 이 `:17` 을 쓰는 것과 같은
    #   이유 — GitHub 의 부하 분산 권장) ② 기회 수를 늘린다. 백업 크론 하나를 더 다는 방식은
    #   같은 메커니즘에 기대므로 근본 대책이 아니다. 각 회차는 OPEN 델타가 없거나 이미
    #   이관됐으면 wrote=false 로 1분 내 무해 종료(delta_bridge.main: return 0)라 비용이 낮다.
    #   일 22:07~23:37 UTC = 월 07:07~08:37 KST (Routine 예치 07:30 KST 전후를 감싼다)
    - cron: '7,37 22-23 * * 0'
    #   월 00:07~05:37 UTC = 월 09:07~14:37 KST (예치 지연·크론 지각 흡수 + 백업 v17 반납 시한 13:15 뒤 세 회차)
    - cron: '7,37 0-5 * * 1'
  workflow_dispatch:
    inputs:
      publish_date:
        description: 'Publication date YYYY-MM-DD (defaults to today in KST)'
        required: false
        type: string
      compare_only:
        description: '쓰지 않고 비교만 — main 에 기록된 그 주 델타 vs claude/company-{날짜} 반납 (publish_date 필수)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 델타 커밋

concurrency:
  # ★ 예약 run 은 **하나의 그룹으로 직렬화**한다(2026-07-20). 옛 폴백은 run_id 라 회차마다
  #   그룹이 갈려 병렬 실행됐는데, 30분 간격 다회 크론에서 두 회차가 겹치면 같은 OPEN 델타를
  #   양쪽이 집어 write+push 가 충돌하고(non-fast-forward) CONSUMED 이중 처리 위험도 있다.
  #   직렬화하면 뒤 회차는 앞 회차가 끝난 뒤 돌아 "이미 이관됨"으로 무해 skip 한다.
  #   cancel-in-progress:false 유지 — 진행 중 이관을 중간에 끊지 않는다.
  group: grm-delta-bridge-${{ github.event.inputs.publish_date || github.event_name }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # ★핵심: ADMIN_GITHUB_ACTIONS_TOKEN(PAT) 로 push 해야 이 커밋이
          # grm-web-publish.yml 의 on: push 를 실제로 트리거한다(GITHUB_TOKEN push 는
          # recursion 방지로 다른 워크플로를 트리거하지 않음 — 2026-07-06 web-publish→
          # deploy 토큰 교훈 동형).
          token: ${{ secrets.ADMIN_GITHUB_ACTIONS_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 델타 브릿지 실행(select → extract → write)
        id: bridge
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ github.event.inputs.publish_date }}" ]; then
            ARGS+=(--publish-date "${{ github.event.inputs.publish_date }}")
          fi
          if [ "${{ github.event.inputs.compare_only }}" = "true" ]; then
            ARGS+=(--compare-only)
          fi
          python delta_bridge.py "${ARGS[@]}"

      - name: 두 길 비교표 보관
        if: always() && hashFiles('_delta_compare/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delta-compare-${{ github.run_id }}
          path: _delta_compare/
          retention-days: 90

      - name: 커밋 + push (wrote=true 일 때만)
        if: steps.bridge.outputs.wrote == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          U=$(echo "${{ steps.bridge.outputs.date }}" | tr '-' '_')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "web/data/deltas/delta_${U}.json"
          if [ -f "web/data/deltas/deep_${U}.json" ]; then
            git add "web/data/deltas/deep_${U}.json"
          fi
          # [대기열 3단계] git handoff 로 만든 호는 교열이 검사한 스캐폴드를 함께 동결한다(delta_bridge.write_scaffold).
          if [ -f "web/data/scaffolds/brief_web_${U}.json" ]; then
            git add "web/data/scaffolds/brief_web_${U}.json"
          fi
          SRC="${{ steps.bridge.outputs.source }}"
          # [백업 v17] 누가 쓴 반납인가 — by=editorial(편집팀) | backup(백업 v17). delta_bridge.bridge_from_git 출력.
          BY="${{ steps.bridge.outputs.by }}"
          if [ "$SRC" != "git" ]; then MSG="라우틴 델타"
          elif [ "$BY" = "backup" ]; then MSG="백업 v17 git 반납 (by=backup)"
          else MSG="편집팀 git 반납 (by=editorial)"; fi
          git commit -m "bridge(web): ${{ steps.bridge.outputs.date }} ${MSG} 커밋 (자동)"
          git push
          echo "### 브릿지 기록: ${{ steps.bridge.outputs.date }} · source=${SRC} · by=${BY:-notion} — ${MSG}" >> "$GITHUB_STEP_SUMMARY"

      - name: OPEN 델타 없음 — 클린 skip
        if: steps.bridge.outputs.wrote != 'true'
        run: echo "no OPEN web-delta — nothing to bridge (또는 이미 동일 내용 커밋됨)"
