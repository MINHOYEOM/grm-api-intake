name: Ops center SQL checks
# 운영 센터 122·123(+124·127 시드)·125(결정 쓰기)·126(업무 지시)·128(자동 측정)을 격리 PostgreSQL 에서 실제로 실행해 경계표·권한·42501·롤업을 확인하고,
# 뮤테이션(관리자 검사 우회·1.5배·worst 순서·분모 0·선 순서 제약 등)이 전부 빨개지는지 본다.
# 실서비스 DB 에는 닿지 않는다(비밀값 없음). 적용은 비서실이 SQL 검토 후 한다.
on:
  pull_request:
    paths:
      - 'web/migrations/*ops_center*'
      - 'web/migrations/*ops_home*'
      - 'web/migrations/*ops_decision*'
      - 'web/migrations/*ops_task*'
      - 'web/migrations/*ops_measure*'
      - 'web/migrations/*ops_alarm*'
      - 'tests/sql/ops_center.sql'
      - 'tests/sql/ops_center_seed.sql'
      - 'tests/sql/ops_center_decide.sql'
      - 'tests/sql/ops_center_task.sql'
      - 'tests/sql/ops_center_seed_planning.sql'
      - 'tests/sql/ops_center_measure.sql'
      - 'tests/sql/ops_center_alarm.sql'
      - 'tests/run_ops_center_sql_mutations.py'
      - '.github/workflows/grm-ops-center-sql-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run ops center SQL in an isolated PostgreSQL database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createdb ops_center_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ops_center_test -f tests/sql/ops_center.sql
      - name: Run the 125 decision-write checks (42501 · already decided · KST 08:00 · service-only)
        run: |
          sudo -u postgres createdb ops_center_decide_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ops_center_decide_test -f tests/sql/ops_center_decide.sql
      - name: Apply the 124 seed twice and check ops_home against the design appendix C
        run: |
          sudo -u postgres createdb ops_center_seed_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ops_center_seed_test -f tests/sql/ops_center_seed.sql
      - name: Run the 126 directive checks (team required · lengths · member team · 42501 · 10s duplicate · audit)
        run: |
          sudo -u postgres createdb ops_center_task_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ops_center_task_test -f tests/sql/ops_center_task.sql
      - name: Apply 124 then 127 twice and check the planning/support seed
        run: |
          sudo -u postgres createdb ops_center_plan_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ops_center_plan_test -f tests/sql/ops_center_seed_planning.sql
      - name: Run the 128 measure checks (hold on zero denominator · failure/timeout keeps value · ref guard · seed idempotent)
        run: |
          sudo -u postgres createdb ops_center_measure_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ops_center_measure_test -f tests/sql/ops_center_measure.sql
      - name: Run the 131 alarm checks (one task per issue · close/reopen · 3-day neglect once · ops_home additive · service-only)
        run: |
          sudo -u postgres createdb ops_center_alarm_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ops_center_alarm_test -f tests/sql/ops_center_alarm.sql
      - name: Prove guards fail on mutations and pass after restoration
        run: python3 tests/run_ops_center_sql_mutations.py
