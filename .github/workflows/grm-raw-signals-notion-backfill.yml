name: GRM raw_signals Notion Backfill

# [raw_signals 백필 · 2026-11-10] Notion 에만 있고 Supabase raw_signals 에 한 번도 채워지지 않은 행
# (예: WHO WHOPIR 약 170행)을 backfill_raw_signals_from_notion.py(#1372)로 채운다.
# 기본은 dry-run(apply=false) — 쓰지 않고 소스별 "없음" 개수만 보고한다. 확인 후 apply=true 로 다시 돌린다.
# 재실행은 안전하다 — 이미 있는 행은 duplicate 로 세고 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Notion Source 값. 띄어쓰기 있는 이름은 쉼표로 구분(예: "Federal Register,ECA Academy"). 쉼표가 없으면 공백 구분(예: "WHO ICH")'
        type: string
        default: 'WHO'
      apply:
        description: '실제로 쓴다(기본 false = dry-run)'
        type: boolean
        default: false
      limit:
        description: '처리할 최대 행 수(비우면 전부)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: raw-signals-notion-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill raw_signals from Notion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill (dry-run unless apply=true)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_APPLY: ${{ inputs.apply }}
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          if ! printf '%s' "${IN_SOURCES:-}" | grep -qE '^[A-Za-z0-9 ,/_.()-]*$'; then
            echo "::error::sources 에 허용되지 않는 문자가 있다"; exit 2
          fi
          if [ -n "${IN_LIMIT:-}" ] && ! printf '%s' "$IN_LIMIT" | grep -qE '^[0-9]+$'; then
            echo "::error::limit 은 숫자만 허용"; exit 2
          fi
          args=()
          if printf "%s" "$IN_SOURCES" | grep -q ","; then
            IFS="," read -ra _srcs <<< "$IN_SOURCES"
          else
            read -ra _srcs <<< "$IN_SOURCES"
          fi
          for s in "${_srcs[@]}"; do
            s="$(printf "%s" "$s" | sed -E "s/^ +| +$//g")"
            [ -n "$s" ] && args+=(--source "$s")
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::sources 가 비었다"; exit 2
          fi
          if [ "${IN_APPLY:-false}" = "true" ]; then args+=(--apply); fi
          if [ -n "${IN_LIMIT:-}" ]; then args+=(--limit "$IN_LIMIT"); fi
          python backfill_raw_signals_from_notion.py "${args[@]}" > raw_signals_notion_backfill_report.json
          rc=$?
          {
            echo "### raw_signals Notion backfill"
            echo "- sources: \`${IN_SOURCES}\` · apply: \`${IN_APPLY:-false}\` · limit: \`${IN_LIMIT:-전부}\` · exit: \`${rc}\`"
            echo '```json'
            head -c 6000 raw_signals_notion_backfill_report.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-signals-notion-backfill-report
          path: raw_signals_notion_backfill_report.json
          retention-days: 30
          if-no-files-found: warn
