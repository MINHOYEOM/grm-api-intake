<style>
  .dc-crumb{font-family:var(--sans);font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dc-crumb a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-2)}
  .dc-crumb a:hover{color:var(--coral)}
  .dc-crumb i{font-style:normal;color:var(--line-2)}
  .dc-h1{font-family:var(--serif);font-size:clamp(27px,4vw,40px);line-height:1.24;color:var(--ink);margin:12px 0 0;word-break:keep-all}
  .dc-sum{font-family:var(--sans);font-size:15px;line-height:1.7;color:var(--ink);margin:14px 0 0;max-width:780px;word-break:keep-all}
  .dc-note{font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--muted);margin:8px 0 0;max-width:780px;word-break:keep-all}
  .dc-credit{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--line-2);max-width:780px}
  .dc-credit .dc-note{margin:0}
  .dc-credit .dc-note + .dc-note{margin-top:6px}
  .dc-credit a{color:var(--coral-2);text-decoration:none}
  .dc-credit a:hover,.dc-credit a:focus-visible{color:var(--coral);text-decoration:underline}
  .dc-credit b{font-weight:600;color:var(--ink)}
  .dc-url{overflow-wrap:anywhere}
  .dc-src{font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--muted);margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px}
  .dc-src a{color:var(--coral-2);text-decoration:none}
  .dc-src a:hover,.dc-src a:focus-visible{color:var(--coral);text-decoration:underline}
  /* 화면 전환 탭 — 네 칸 한 줄(모바일 두 칸). 선택 = --coral-2 바탕 흰 글자(5.9:1). */
  .dc-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:24px 0 0}
  .dc-tabs a{display:flex;flex-direction:column;gap:2px;font-family:var(--sans);color:var(--ink);text-decoration:none;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;background:var(--paper,#FFFFFF);transition:border-color var(--tr),background var(--tr)}
  .dc-tabs a b{font-size:14.5px;font-weight:600;line-height:1.35}
  .dc-tabs a span{font-size:12.5px;color:var(--muted);line-height:1.4}
  .dc-tabs a:hover,.dc-tabs a:focus-visible{border-color:var(--coral)}
  .dc-tabs a.on,.dc-tabs a.on:hover,.dc-tabs a.on:focus-visible{border-color:var(--coral-2);background:var(--coral-2);color:#FFFFFF}
  .dc-tabs a.on span{color:#FFFFFF;opacity:.92}
  @media(max-width:560px){.dc-tabs{grid-template-columns:1fr 1fr}.dc-tabs a{padding:9px 11px}.dc-tabs a b{font-size:13.5px}}
  /* 기관 표지 — 사례마다 어느 기관 것인지 한눈에. PMDA=남색, MHRA=초록(둘 다 밝은 바탕 위 AA). */
  .dc-ag{display:inline-block;font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.04em;line-height:1;padding:4px 7px;border-radius:5px;vertical-align:1px}
  .dc-ag-pmda{background:#E7EAF4;color:#26346A}
  .dc-ag-mhra{background:#E3F0E9;color:#1B5A3F}
  .dc-sec{font-family:var(--serif);font-size:22px;line-height:1.3;color:var(--ink);margin:40px 0 6px;padding-top:22px;border-top:1px solid var(--line-2)}
  .dc-more{display:block;margin:14px auto 0;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper,#FFFFFF);border:1px solid var(--line-2);border-radius:999px;padding:9px 20px;cursor:pointer}
  .dc-more:hover,.dc-more:focus-visible{border-color:var(--coral);color:var(--coral-2)}
  .dc-more[hidden]{display:none}
  .dc-i.dc-paged{display:none}
  /* MHRA 조항 개요 — 본문(장)·부속서 두 묶음, 막대로 상대 크기. */
  .dc-ov{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;margin:22px 0 0}
  .dc-ov h2{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--muted);margin:0 0 6px}
  .dc-ov ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .dc-ov li a{display:grid;grid-template-columns:minmax(0,1fr) 92px 54px;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-family:var(--sans);font-size:14px}
  .dc-ov li a:hover,.dc-ov li a:focus-visible{background:var(--soft)}
  .dc-ov .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .dc-ov .t{min-width:0}
  .dc-ov .t small{display:block;font-size:12.5px;color:var(--muted)}
  .dc-ov .bar{display:block;height:8px;border-radius:4px;background:var(--line)}
  .dc-ov .bar i{display:block;height:100%;border-radius:4px;background:var(--coral-2)}
  @media(max-width:760px){.dc-ov{grid-template-columns:1fr}}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .dc-bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:22px 0 0}
  .dc-bar[hidden]{display:none}
  .dc-bar select,.dc-bar input{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper,#FFFFFF);border:1px solid var(--line-2);border-radius:var(--rad-s);padding:7px 10px;min-width:0;max-width:100%}
  .dc-bar input{flex:1 1 220px}
  .dc-shown{font-family:var(--sans);font-size:13px;color:var(--muted);margin:12px 0 0}
  .dc-shown b{color:var(--ink);font-weight:600}
  .dc-list{display:flex;flex-direction:column;gap:10px;margin:12px 0 0}
  .dc-i{border:1px solid var(--line-2);border-radius:10px;padding:13px 16px;background:var(--paper,#FFFFFF)}
  .dc-i[hidden]{display:none}
  .dc-i blockquote{font-family:var(--sans);font-size:14.5px;line-height:1.65;color:var(--ink);margin:0;overflow-wrap:anywhere}
  .dc-i .dc-ko{font-family:var(--sans);font-size:14.5px;line-height:1.7;color:var(--ink);margin:0;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
  .dc-i blockquote.dc-orig{font-size:13px;line-height:1.6;color:var(--muted);margin:8px 0 0;padding-left:10px;border-left:2px solid var(--line-2)}
  .dc-m{font-family:var(--sans);font-size:12.5px;line-height:1.6;color:var(--muted);margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px}
  .dc-m a{color:var(--muted);border-bottom:1px solid var(--line-2);text-decoration:none}
  .dc-m a:hover{color:var(--coral)}
  .dc-empty{font-family:var(--sans);font-size:14px;color:var(--muted);margin:14px 0 0}
  .dc-empty[hidden]{display:none}
  .dc-jump{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0;padding:0;list-style:none}
  .dc-jump a{font-family:var(--sans);font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;background:var(--paper,#FFFFFF)}
  .dc-jump a:hover{border-color:var(--coral);color:var(--coral)}
  .dc-h2{font-family:var(--serif);font-size:21px;line-height:1.3;color:var(--ink);margin:34px 0 4px;scroll-margin-top:80px}
  .dc-h2 small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
  .dc-wrapx{overflow-x:auto;margin:10px 0 0;border:1px solid var(--line-2);border-radius:var(--rad-s)}
  .dc-tbl{border-collapse:collapse;width:100%;min-width:520px;font-family:var(--sans);font-size:13.5px}
  .dc-tbl th,.dc-tbl td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dc-tbl th{color:var(--muted);font-weight:500;font-size:12.5px}
  .dc-tbl th:first-child,.dc-tbl td:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere;color:var(--ink)}
</style>
