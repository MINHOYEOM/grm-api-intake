name: GRM Findings Facets Refresh

# [검색 유입] 분류·국가·기관 모음 페이지(/findings/{c|country|agency}/)의 정본 데이터를
# 주 1회 재측정한다(findings_facets_refresh.py). 페이지에 박히는 건수·최근 사례가 이 파일에서
# 오므로, 갱신이 멈추면 화면이 조용히 낡는다(틀린 숫자가 검색 결과 설명문에 그대로 나간다).
#
# 크론 분리: 자료실=일요일 18:23 UTC, 용어사전 사례연결=목요일 18:15 UTC 를 이미 쓴다. 같은
# 창에 겹치면 둘 다 web/tests/golden 을 재동결해 main 기준 순차 PR 이 서로의 골든 변경을
# 못 본 채 분기하므로 머지 경합이 난다. → 화요일 18:20 UTC(= 수요일 03:20 KST), 기존 크론
# 어디와도 안 겹치는 조용한 새벽 창.
#
# 새 시크릿/변수 없음 — SUPABASE_URL·SUPABASE_ANON_KEY(repo Variables)를 그대로 재사용한다.
# ★anon 키를 쓴다(service-role 금지): RLS 가 공개 집합을 정의하므로 anon 으로 세야 화면에
#   실제로 보이는 수와 같다. service-role 은 비공개 행까지 세어 없는 건수를 광고하게 된다.

on:
  schedule:
    - cron: '20 18 * * 2'
  workflow_dispatch:
    inputs:
      min_findings:
        description: '페이지를 만들 최소 지적 건수(미만은 제외·사유 기록)'
        required: true
        default: '20'
      shrink_review_percent:
        description: '항목 수가 이 비율(%) 이상 줄면 자동 머지 대신 사람 검토로 남김'
        required: true
        default: '20'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: grm-findings-facets-auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIN_FINDINGS: ${{ inputs.min_findings || '20' }}
      SHRINK_PCT: ${{ inputs.shrink_review_percent || '20' }}
      BRANCH: automation/findings-facets-auto-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GRM_PUBLISH_TOKEN || secrets.ADMIN_GITHUB_ACTIONS_TOKEN || github.token }}
      DATA_PATH: web/data/findings_facets.json
      # [다국어 2026-09-04] 영어 트리용 같은 정본 — 원문이 영어인 지적만 센 값.
      DATA_PATH_EN: web/data/findings_facets_en.json
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create isolated candidate branch
        run: git switch -c "$BRANCH"

      # 갱신 전 항목 수를 기억해 둔다 — 축소 감지는 "갱신 후"만 봐서는 못 한다.
      # ★조합(`combos.items`)도 함께 센다. 단일 축만 세면 조합 51장이 통째로 사라져도
      #   숫자가 36 그대로라 가드가 침묵하고 자동 머지된다(라이브 페이지가 조용히 증발).
      - name: Record pre-refresh page counts
        id: before
        run: |
          set -euo pipefail
          count() { [ -f "$1" ] && jq '[.axes[].items[], (.combos.items // [])[]] | length' "$1" || echo 0; }
          # ★[2026-09-05 정정] 종전엔 두 언어를 **합쳐서** 셌다. 그 근거("따로 세면 한쪽이
          #   사라져도 침묵한다")는 거꾸로였다 — 언어마다 자기 숫자를 보면 그 언어가 0 이
          #   되는 순간 그 검사가 걸린다. 반대로 **합산은 한쪽 붕괴를 다른 쪽 증가로 가린다**
          #   (영어 57 → 0 인데 한국어가 57 늘면 총합이 그대로라 통과한다).
          echo "items_ko=$(count "$DATA_PATH")" >> "$GITHUB_OUTPUT"
          echo "items_en=$(count "$DATA_PATH_EN")" >> "$GITHUB_OUTPUT"

      # 스크립트가 0건 가드·표본 미달 제외·모르는 기관 코드·실패율 상한을 스스로 판정하고,
      # 위반이면 아무것도 쓰지 않은 채 exit 1 한다(잡 상태 빨강으로 드러난다).
      - name: Refresh facet data (findings_search RPC, anon)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # [2026-09-03] 재시도 추가 — 09-01 스케줄 실행이 findings_search RPC 의 일시적
          # 500 하나로 실패했고(런 33559232503), 이 워크플로는 주 1회라 공개 퍼셋 숫자가
          # 한 주 내내 낡은 채로 나갔다. 스크립트는 위반이면 **아무것도 쓰지 않고** exit 1
          # 하므로 재시도가 안전하다(멱등). 결정론적 실패(0건 가드·표본 미달·기관 코드)는
          # 3회 모두 같게 실패해 잡이 그대로 빨강으로 남는다 — 게이트는 약해지지 않는다.
          # [다국어 2026-09-04] 갈래가 둘이다 — 한국어(전체 모집단)와 영어(원문이 영어인
          # 지적만). 영어면에 한국어 집계를 실으면 화면의 건수와 그 페이지가 보내는 검색
          # 결과가 갈리므로, 사후 필터가 아니라 **서버에 다시 물어** 따로 만든다.
          run_pass() {                       # $1=라벨  $2=출력경로  $3=--orig-lang 값
            for attempt in 1 2 3; do
              if python findings_facets_refresh.py \
                   --supabase-url "$SUPABASE_URL" \
                   --supabase-anon-key "$SUPABASE_ANON_KEY" \
                   --min-findings "$MIN_FINDINGS" \
                   --orig-lang "$3" \
                   --out "$2"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::$1 퍼셋 갱신 실패(${attempt}/3) — 60초 후 재시도"
                sleep 60
              fi
            done
            echo "::error::$1 퍼셋 갱신 3회 모두 실패 — 결정론적 실패이거나 Supabase 지속 장애"
            return 1
          }
          # ★한쪽만 갱신된 상태를 커밋하지 않는다. 두 파일은 같은 화면의 두 언어판이라,
          #   한쪽이 낡으면 같은 페이지의 한국어판과 영어판이 다른 주를 말하게 된다.
          run_pass "한국어" "$DATA_PATH" "" || exit 1
          run_pass "영어" "$DATA_PATH_EN" "en" || exit 1

      - name: Detect meaningful changes
        id: changes
        run: |
          if git diff --quiet -- "$DATA_PATH" "$DATA_PATH_EN"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "모음 페이지 데이터 변경 없음 — PR 을 만들지 않습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 페이지가 크게 줄면 자동 머지하지 않는다. 축소는 정상일 수도 있으나(임계값 상향),
      # RPC 부분 장애로 축이 얇아진 것일 수도 있고 그 둘은 숫자만 봐서는 구분되지 않는다.
      # 사람이 한 번 보게 만드는 편이 라이브에서 페이지 수십 장이 사라지는 것보다 낫다.
      - name: Gate on page-count shrink
        if: steps.changes.outputs.changed == 'true'
        id: gate
        run: |
          set -euo pipefail
          count() { [ -f "$1" ] && jq '[.axes[].items[], (.combos.items // [])[]] | length' "$1" || echo 0; }
          # GHA 표현식에는 산술이 없다 — 계산은 전부 셸에서 한다.
          # 언어마다 따로 본다(합산은 한쪽 붕괴를 다른 쪽 증가로 가린다 — before 단계 주석).
          ALLOWED=true
          check_shrink() {                   # $1=라벨  $2=이전  $3=정본경로
            local before="$2" after; after=$(count "$3")
            if [ "$before" -gt 0 ] && [ $(( (before - after) * 100 )) -ge $(( before * SHRINK_PCT )) ]; then
              ALLOWED=false
              echo "$1 페이지 수 ${before} → ${after} (축소 ${SHRINK_PCT}% 이상) — 사람 검토로 남깁니다." >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          check_shrink "한국어" '${{ steps.before.outputs.items_ko }}' "$DATA_PATH"
          check_shrink "영어" '${{ steps.before.outputs.items_en }}' "$DATA_PATH_EN"
          echo "after=$(( $(count "$DATA_PATH") + $(count "$DATA_PATH_EN") ))" >> "$GITHUB_OUTPUT"
          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"

      - name: Freeze renderer-produced goldens
        if: steps.changes.outputs.changed == 'true'
        run: python web/tests/test_render.py --freeze

      - name: Commit and open candidate PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATA_PATH" "$DATA_PATH_EN" web/tests/golden
          git commit -m "chore: refresh findings facet pages"
          git push -u origin "$BRANCH"
          SUMMARY=$(jq -r '.axes[] | "- \(.axis): 페이지 \(.items | length)개 · 제외 \(.excluded | length)개"' "$DATA_PATH")
          EXCLUDED=$(jq -r '[.axes[].excluded[]] | if length == 0 then "- 없음" else map("- \(.key // "(빈 값)") \(.findings)건 — \(.reason)") | join("\n") end' "$DATA_PATH")
          TOTALS=$(jq -r '.totals | "공개 지적 \(.findings)건 · 문서 \(.documents)건"' "$DATA_PATH")
          cat > /tmp/pr-body.md <<EOF
          분류·국가·기관 모음 페이지 데이터 주간 재측정(\`findings_search\` RPC · anon 키 = 공개 RLS 그대로).

          ## 실측
          $TOTALS

          $SUMMARY

          ## 제외된 항목 (침묵시키지 않는다)
          $EXCLUDED

          ## 게이트
          - 0건 가드 · 표본 미달(<${MIN_FINDINGS}건) 제외 · 모르는 기관 코드 = 실패 · 항목 실패율 20% 초과 시 전면 중단
          - 페이지 수 ${SHRINK_PCT}% 이상 축소 시 자동 머지 대신 사람 검토

          정본 데이터와 렌더 산출 골든을 함께 커밋합니다. 자동 머지는 명시적 GRM CI 디스패치가 green 일 때만 일어납니다.
          EOF
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh findings facet pages" \
            --body-file /tmp/pr-body.md
          echo "number=$(gh pr view "$BRANCH" --json number -q .number)" >> "$GITHUB_OUTPUT"

      - name: Mark review-required candidate
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed != 'true'
        run: gh pr edit "${{ steps.pr.outputs.number }}" --add-label automation-warning

      - name: Dispatch CI gate
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run grm-ci.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow grm-ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .createdAt >= \"$STARTED\") | .databaseId" \
              | head -n 1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -n "$RUN_ID" ] || { echo "CI dispatch run not found" >&2; exit 1; }
          gh run watch "$RUN_ID" --exit-status

      - name: Merge only after green CI
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed == 'true'
        run: gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch

      - name: Summary
        if: always()
        run: |
          if [ -f "$DATA_PATH" ]; then
            jq -r '"측정일 \(.measured_on) · 공개 지적 \(.totals.findings)건", (.axes[] | "\(.axis): 페이지 \(.items | length) · 제외 \(.excluded | length)")' \
              "$DATA_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi
