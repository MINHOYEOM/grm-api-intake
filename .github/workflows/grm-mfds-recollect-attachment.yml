name: GRM MFDS GMP Attachment Recollection

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'MFDS GMP inspection document IDs (comma-separated)'
        type: string
        required: true
      apply:
        description: 'Write changes after approval'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mfds-backfill
  cancel-in-progress: false

jobs:
  recollect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require MFDS proxy
        env:
          MFDS_HTTP_PROXY: ${{ secrets.MFDS_HTTP_PROXY }}
        run: |
          if [ -z "$MFDS_HTTP_PROXY" ]; then
            echo "::error::MFDS_HTTP_PROXY is required to reach nedrug from the runner"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Probe MFDS egress
        env:
          MFDS_HTTP_PROXY: ${{ secrets.MFDS_HTTP_PROXY }}
        run: python probe_mfds_egress.py

      - name: Recollect attachments
        id: recollect
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MFDS_HTTP_PROXY: ${{ secrets.MFDS_HTTP_PROXY }}
          ENABLE_GMP_DEFICIENCY_TABLE: 'true'
          IDS: ${{ inputs.ids }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply)
          fi
          python recollect_mfds_gmp_attachment.py --ids "$IDS" --json recollect.json "${args[@]}"

      - name: Upload recollection report
        if: ${{ always() && (steps.recollect.outcome == 'success' || steps.recollect.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mfds-attachment-recollection
          path: recollect.json
          if-no-files-found: warn

      - name: Summarize recollection
        if: always()
        env:
          OUTCOME: ${{ steps.recollect.outcome }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$OUTCOME" = "failure" ]; then
            echo "::error::MFDS attachment recollection failed. See the recollection step and JSON report if available."
          fi
          {
            echo "## MFDS GMP attachment recollection"
            printf '\nApply requested: %s\n\nRecollection outcome: %s\n' "$APPLY" "$OUTCOME"
            if [ -f recollect.json ]; then
              echo
              echo "See recollect.json in the mfds-attachment-recollection artifact for per-document results."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
