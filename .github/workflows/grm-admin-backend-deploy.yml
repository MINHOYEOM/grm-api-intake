name: GRM Admin Backend Deploy

# Admin 운영 콘솔의 Supabase DB migration + Edge Functions 배포.
# 시크릿이 없으면 안전하게 skip 하고, 준비되면 workflow_dispatch 한 번으로 백엔드를 활성화한다.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/grm-admin-backend-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: grm-admin-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_GITHUB_ACTIONS_TOKEN: ${{ secrets.ADMIN_GITHUB_ACTIONS_TOKEN }}
      NEWSLETTER_API_KEY: ${{ secrets.NEWSLETTER_API_KEY }}
      GRM_NEWSLETTER_LIST_ID: ${{ vars.GRM_NEWSLETTER_LIST_ID }}
      SUPABASE_URL_PUBLIC: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Admin Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/functions/admin-supabase/index.ts \
            supabase/functions/admin-github/index.ts \
            supabase/functions/admin-brevo/index.ts
          do
            for attempt in 1 2 3; do
              if deno check "$file"; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep $((attempt * 2))
            done
          done

      - name: Resolve project ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          REF="$SUPABASE_PROJECT_REF"
          if [ -z "$REF" ] && [ -n "$SUPABASE_URL_PUBLIC" ]; then
            REF="$(printf '%s' "$SUPABASE_URL_PUBLIC" | sed -E 's#^https://([^.]+)\.supabase\.co.*#\1#')"
          fi
          echo "project_ref=$REF" >> "$GITHUB_OUTPUT"

          missing=()
          [ -z "$REF" ] && missing+=("SUPABASE_PROJECT_REF or vars.SUPABASE_URL")
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing+=("SUPABASE_DB_PASSWORD")
          [ -z "$ADMIN_GITHUB_ACTIONS_TOKEN" ] && missing+=("ADMIN_GITHUB_ACTIONS_TOKEN")
          if [ "${#missing[@]}" -gt 0 ]; then
            ready=false
          else
            ready=true
          fi

          {
            echo "## GRM Admin Backend Deploy"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            if [ -n "$REF" ]; then
              echo "| Supabase project ref | resolved: \`$REF\` |"
            else
              echo "| Supabase project ref | missing |"
            fi
            for name in SUPABASE_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_PASSWORD ADMIN_GITHUB_ACTIONS_TOKEN; do
              if [ -n "${!name:-}" ]; then
                echo "| \`$name\` | configured |"
              else
                echo "| \`$name\` | missing |"
              fi
            done
            echo "| \`NEWSLETTER_API_KEY\` | $([ -n "$NEWSLETTER_API_KEY" ] && echo configured || echo missing) |"
            echo "| \`GRM_NEWSLETTER_LIST_ID\` | $([ -n "$GRM_NEWSLETTER_LIST_ID" ] && echo configured || echo missing) |"
            echo
            if [ "$ready" = "true" ]; then
              echo "Admin backend is ready for migration and Edge Function deployment."
            else
              echo "Admin backend deployment was skipped. Add the missing GitHub Secrets/Variables, then run this workflow manually."
              echo
              echo "Missing: ${missing[*]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning::Admin backend deploy 시크릿 누락: %s. 코드만 배포되고 백엔드는 skip 됩니다.\n' "${missing[*]}"
            printf 'missing_csv=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing_csv=" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v2.1.1
        if: steps.ref.outputs.ready == 'true'

      - name: Link Supabase project
        if: steps.ref.outputs.ready == 'true'
        shell: bash
        run: supabase link --project-ref "${{ steps.ref.outputs.project_ref }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        id: dbpush
        if: steps.ref.outputs.ready == 'true'
        shell: bash
        run: |
          # ★이 저장소는 마이그레이션 채널이 둘이다:
          #   ⓐ supabase/migrations/<timestamp>_*.sql — CLI 가 관리(이 스텝이 미는 대상)
          #   ⓑ web/migrations/NNN_*.sql            — 사람이 SQL 에디터로 직접 적용
          # ⓑ 를 적용하면 원격 이력 테이블에 CLI 가 모르는 버전이 남는다. 그러면 db push 가
          # "Remote migration versions not found in local migrations directory" 로 **거부**한다
          # — 밀 것이 하나도 없어도 그렇다. 그건 배포 실패가 아니라 설계상 당연한 상태다.
          # 2026-08-26 에 실제로 여기서 막혔다: 07-13 이후 처음 도는 supabase/** 푸시였는데
          # 그 사이 ⓑ 로 쌓인 60여 버전 때문에 **Edge Function 배포가 통째로 취소**됐다
          # (함수와 아무 상관 없는 이유로). 그래서 이 드리프트만 경고로 통과시키고,
          # 그 밖의 실패(SQL 오류·인증·네트워크)는 종전대로 배포를 막는다.
          set -uo pipefail
          out="$(printf 'y\n' | supabase db push --password "$SUPABASE_DB_PASSWORD" 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$out" | grep -qF 'Remote migration versions not found in local migrations directory'; then
            printf '::warning::원격 이력에 CLI 가 모르는 버전이 있습니다(web/migrations 수동 적용분). 마이그레이션 push 는 건너뛰고 Edge Function 배포를 계속합니다.\n'
            exit 0
          fi
          exit "$rc"

      - name: Set Edge Function secrets
        if: steps.ref.outputs.ready == 'true'
        shell: bash
        run: |
          supabase secrets set --project-ref "${{ steps.ref.outputs.project_ref }}" \
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            GITHUB_ACTIONS_TOKEN="$ADMIN_GITHUB_ACTIONS_TOKEN" \
            GITHUB_REPO="$GITHUB_REPOSITORY" \
            GITHUB_REF="main" \
            NEWSLETTER_API_KEY="$NEWSLETTER_API_KEY" \
            GRM_NEWSLETTER_LIST_ID="$GRM_NEWSLETTER_LIST_ID"

      - name: Deploy Admin Edge Functions
        if: steps.ref.outputs.ready == 'true'
        shell: bash
        run: |
          supabase functions deploy admin-supabase --project-ref "${{ steps.ref.outputs.project_ref }}"
          supabase functions deploy admin-github --project-ref "${{ steps.ref.outputs.project_ref }}"
          supabase functions deploy admin-brevo --project-ref "${{ steps.ref.outputs.project_ref }}"
