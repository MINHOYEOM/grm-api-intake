name: GRM Coverage Reconciliation (weekly, non-blocking)

# [신뢰성 게이트 2026-07-12] 주간 커버리지 reconciliation — 소스별 주간 수집량이 과거
# 대비 비정상 낙차(무음 실패·피드 파손·IP 차단)인지 관측한다. 수집(grm-intake)·발행
# (grm-web-publish)과 완전히 분리된 별도 파일·별도 트리거·읽기 전용(Supabase raw_signals
# 조회만). 이상치가 있어도 파이프라인을 차단하지 않는다 — GitHub Actions ::warning:: 주석과
# STEP_SUMMARY 로만 표면화(과잉경보로 게이트가 무시되지 않도록 비차단·정밀도 우선).
#
# 기존 grm_health(수집된 항목 내부 추출품질)와 상보적: 이쪽은 "원천 대비 못 받은 누락"을
# 본다. 감사에서 MHRA 회수 전건 누락이 이렇게 조용히 방치됐던 게 이 잡의 존재 이유.

on:
  schedule:
    # 21:00 UTC 일 = 06:00 KST 월 (Routine 07:30 KST 발행 직전 — 이번 주 수집 마감 후 점검).
    - cron: '0 21 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write        # 낙차 감지 알림 이슈 생성/갱신/종료

concurrency:
  group: grm-reconciliation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests

      # ★reconciliation_audit.py 는 의도적으로 비차단이다(도크스트링 참조) — 이상 낙차나
      # evidence_url 오염이 있어도 항상 exit 0 이고, `::warning::`/"⚠️" 로만 표면화한다.
      # 그래서 exit 코드로는 "낙차가 있었는지" 를 알 수 없다. continue-on-error 는 이
      # 스텝을 **스크립트 자체가 죽었을 때**(미처리 예외 등 이례적 크래시)만 실패로 남기기
      # 위함이고, 낙차 판정은 바로 다음 스텝에서 출력 텍스트의 "⚠️" 마커로 한다.
      - name: 주간 reconciliation 실행(비차단)
        id: reconcile
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python reconciliation_audit.py | tee reconciliation_report.txt | tee -a "$GITHUB_STEP_SUMMARY"

      # exit 코드가 항상 0 이므로 리포트 본문에서 판정한다("⚠️" 는 이상 낙차·오염 두
      # 갈래 모두에서 스크립트가 실제로 찍는 마커 — reconciliation_audit.py 참조).
      - name: Detect breach from report text
        id: breach
        if: always()
        run: |
          if [ -f reconciliation_report.txt ] && grep -q '⚠️' reconciliation_report.txt; then
            echo "낙차/오염 마커 발견"
            echo "detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "마커 없음"
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update reconciliation issue
        if: steps.reconcile.outcome == 'failure' || steps.breach.outputs.detected == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[reconciliation] 원천 대비 수집량 낙차가 감지됐습니다';
            const label = 'reconciliation';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const crashed = process.env.RECONCILE_OUTCOME === 'failure';

            let report = '(reconciliation_report.txt 를 읽지 못함 — Actions 로그 참조)';
            try { report = fs.readFileSync('reconciliation_report.txt', 'utf8'); } catch (e) { /* keep default */ }
            const excerpt = report.length > 4000 ? report.slice(0, 4000) + '\n...(생략 — 전문은 Actions 로그/스텝 요약 참조)' : report;

            const lines = [];
            if (crashed) {
              lines.push('reconciliation_audit.py 실행 자체가 실패했습니다(미처리 예외 등 이례적 크래시 — 원래 이 스크립트는 비차단이라 이 자체가 이상 신호입니다).');
            } else {
              lines.push('원천(raw_signals) 대비 이번 주 수집량 낙차 또는 evidence_url 오염이 감지됐습니다.');
            }
            lines.push('');
            lines.push('**왜 이 알림이 중요한가**: 소스별 주간 수집량이 원천 대비 비정상 낙차(무음 실패·피드 파손·IP 차단)를 보여도 발행 파이프라인은 막지 않는다 — 감사에서 MHRA 회수 전건 누락이 이렇게 조용히 방치됐던 게 이 잡의 존재 이유다.');
            lines.push('');
            lines.push(`실행: ${runUrl}`);
            lines.push('');
            lines.push('```');
            lines.push(excerpt);
            lines.push('```');
            lines.push('');
            lines.push('_정상 범위로 복귀하면 자동으로 닫힙니다._');
            const body = lines.join('\n');

            async function ensureLabel(name, color, description) {
              try { await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name }); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            }
            await ensureLabel(label, 'd93f0b', '원천 대비 수집량 낙차 감지');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 20,
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `다시 감지됐습니다 — 실행 ${context.runId}`,
              });
              core.notice(`기존 이슈 #${existing.number} 갱신`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label], assignees: [context.repo.owner],
              });
              core.notice(`이슈 #${created.number} 생성`);
            }

      # ★복귀 종료는 스크립트가 실제로 정상 실행됐고(outcome success) 마커도 없을 때만.
      # 크래시(outcome failure)를 success 로 오독해 알람을 스스로 끄는 사고를 막는다.
      - name: Close reconciliation issue on recovery
        if: steps.reconcile.outcome == 'success' && steps.breach.outputs.detected == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[reconciliation] 원천 대비 수집량 낙차가 감지됐습니다';
            const label = 'reconciliation';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 20,
            });
            for (const issue of open.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `낙차/오염이 정상 범위로 복귀해 자동으로 닫습니다 (실행 ${context.runId}).`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
              core.notice(`이슈 #${issue.number} 자동 종료`);
            }
