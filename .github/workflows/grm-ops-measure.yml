name: GRM Ops Measure

# 운영 센터 자동 측정 — GitHub 갈래(설계서 2026-11-06 §2-6 · PR6). SQL 갈래는 128 의 ops_measure_all(pg_cron 03:30 KST).
# 매일 07:23 KST(22:23 UTC — 일일 연결 06:30 KST 뒤) web/ops_measure_github.py 가 gh api 로 실행 기록을 읽어
#   dev-ci · dev-pr-old · dev-link-streak · infra-deploy-fail · sr-ontime · edu-terms-week 를 계산하고
#   ops_goal_set(125) RPC 로 쓴다. 코드 팀원 dq-kg-link·infra-intake 의 마지막 성공 시각은 ops_member_touch 로.
#
# ## 안전 장치
#  - 기본은 dry-run(계산·출력만, 쓰기 0). 저장소 변수 `GRM_OPS_MEASURE_ENABLED=true` 일 때만 실제 쓰기
#    — 비서실이 128 적용·dry-run 값 확인 뒤 켠다. 수동 실행도 dry_run=false **그리고** 변수가 켜져 있어야 쓴다.
#  - 키는 기존 워크플로가 쓰는 SUPABASE_SERVICE_ROLE_KEY 그대로(새 비밀값 없음), 로그에서 가린다(::add-mask::).
#  - 실패는 이슈를 열지 않는다 — 단계 요약에만 적는다(기존 감시와 중복 금지). 실패한 측정은 쓰지 않아
#    이전 값이 낡아 주기×1.5 뒤 '측정 필요'로 자연 강등된다.
#  - 권한은 읽기 전용(contents·actions·pull-requests read). AI 호출 0 · 비용 = Actions 무료분.

on:
  schedule:
    - cron: '23 22 * * *'     # 07:23 KST 매일(정각을 피한다 — 정각 크론은 밀린다)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true=계산·출력만(쓰기 0). false=실제 쓰기(GRM_OPS_MEASURE_ENABLED 도 켜져 있어야 함)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: grm-ops-measure
  cancel-in-progress: false

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            web/ops_measure_github.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 목표 측정 + 팀원 활동
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_DRY: ${{ github.event.inputs.dry_run }}
          ENABLED: ${{ vars.GRM_OPS_MEASURE_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          DRY="--dry-run"
          if [ "$ENABLED" = "true" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              [ "$DISPATCH_DRY" = "false" ] && DRY=""
            else
              DRY=""
            fi
          fi
          python web/ops_measure_github.py $DRY
