name: GRM WL Finding Pair Restore

on:
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: 'Run ID of GRM FDA 483 OCR Recovery containing the WL plan'
        type: string
        required: true
      plan_file:
        description: 'WL plan file in the recovery report artifact'
        type: choice
        options:
          - wl_body_followup_catchup_plan.json
          - wl_body_followup_restore_plan.json
        default: wl_body_followup_catchup_plan.json
      apply:
        description: 'Set true only after a human approves the dry output'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: grm-wl-pair-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download recovery plan
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name fda-wl-body-recovery-report --dir recovery

      - name: Preview changes
        env:
          PLAN_FILE: ${{ inputs.plan_file }}
        run: python wl_pair_restore.py --plan "recovery/$PLAN_FILE"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: ${{ inputs.apply }}
        with:
          python-version: '3.12'

      - name: Install apply dependencies
        if: ${{ inputs.apply }}
        run: python -m pip install -r requirements.txt

      - name: Apply approved changes
        if: ${{ inputs.apply }}
        env:
          PLAN_FILE: ${{ inputs.plan_file }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python wl_pair_restore.py --plan "recovery/$PLAN_FILE" --apply
