name: GRM CI (compile + tests)

# push/PR 마다 py_compile + unittest 실행 — 회귀 게이트.
# 수집/Notion 호출 없음(네트워크 불필요).
# 소요 실측: 2026-08 4m40s → 2026-09-04 9m50s(5,392건) → 2026-09-04 12m09s → 20분 상한
# 초과. 상한에 걸리면 **테스트가 OK 를 찍은 직후 잡이 cancelled** 된다(초록 로그 + 빨간
# 체크 — 원인을 헷갈리기 딱 좋은 실패 모양이다).
# ★상한을 올리기 전에 **왜 느려졌는지 먼저 잰다.** 20분 초과의 원인은 스위트가 커진 것이
#   아니라 렌더가 느려진 것이었다 — 영문 용어 발췌가 더해져 단일 렌더가 10.4s → 22.9s
#   가 됐고, 대조 루프가 `sent.casefold()` 를 용어 242 개마다 다시 계산하고 있었다.
#   접은 사본을 색인에 실어 14.8s 로 되돌린 뒤(동작·골든 바이트 불변) 상한을 30분으로
#   둔다. 상한은 '멈춘 잡'을 잡으라고 있는 것이지 정상 실행을 자르라고 있는 것이 아니다.
#
# 2026-09-10: push 트리거를 `['**']` → `[main]` 으로 좁혔다. 이전엔 PR 브랜치에 커밋할
#   때마다 push 와 pull_request 두 이벤트가 동시에 열려 같은 커밋이 5,700여 건 스위트를
#   두 번(13~21분씩) 돌았다 — 실행 자체는 공개 저장소라 무료지만 큐가 배로 밀려 병합이
#   늦어졌고, 그 지연 때문에 이번 달에만 timeout-minutes 상한을 두 번 올렸다(위 이력
#   참고). PR 브랜치는 pull_request 이벤트만으로 이미 한 번 돈다 — push 를 없애도
#   커버리지가 줄지 않는다. **PR 을 열지 않고 브랜치만 푸시하면 이제 CI 가 안 돈다 —
#   의도된 동작이다**(dispatch 로 수동 실행 가능).
#   병합 게이트(`supabase/functions/admin-github/index.ts`)는 PR head sha 의
#   `/commits/{sha}/check-runs` 를 읽는데, pull_request 이벤트가 만드는 체크런도 같은
#   head sha 에 붙는다 — push 트리거를 좁혀도 게이트가 보는 체크런은 그대로다.
#   `concurrency.cancel-in-progress` 는 **같은 브랜치**(PR 헤드)에 연달아 푸시했을 때
#   앞선 런만 취소한다 — main 브랜치로 향하는 런(머지 커밋)은 `cancel-in-progress` 가
#   `false` 로 고정돼 있어 취소되지 않는다(모든 머지가 자기 자신의 CI 결과를 남긴다).
#   서로 다른 PR 브랜치끼리는 group 이 달라 애초에 서로를 취소하지 않는다.
#
# 2026-11-04: 상한 30분 → 45분. 11-03 오후 PR 런이 6,938건에 1,585~1,782초(26~30분)로
#   30분 한도에 걸려 취소됐다(#1311 취소, #1314 는 로그 OK 직후 취소). 먼저 쟀다:
#   · 동시 런 수와 무관 — 같은 날 아침 한산한 main 런도 6,929건 1,656s 였다.
#   · 같은 테스트 수에서 러너마다 ±50% 흔들린다(6,380건: 865s ↔ 6,387건: 1,438s, 10월).
#   · 스위트 자체는 완만히 자랐다(9월초 5,540건 747s → 11-03 6,938건 ~1,600s).
#   · 시간의 약 82%(1,326s/1,615s)가 web/tests/test_render.py 의 사이트 전체 빌드
#     (setUpClass 가 render_site 를 클래스마다 돈다 — 상위: WebRenderHardeningTest 233s).
#   급증한 단일 테스트(10→23초 같은)는 없어서 코드 최적화로 풀 문제가 아니다 — 평균이
#   이미 한도 근처라 러너가 느린 날 잘리는 것이다. 45분으로 여유를 두고, 근본 단축은
#   render_site 결과 공유(클래스 간 빌드 재사용)를 따로 검토한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: grm-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# 2026-11-08: unittest 를 4 샤드(matrix)로 병렬화했다 — 직렬 29분 -> 샤드당 약 8~10분.
#   나누기는 `ci_shard.py`(TestCase 클래스 단위, tests/ci_shard_timings.json 실측으로 탐욕 균형).
#   샤드 잡 이름은 `unittest (shard N)`, 이전 체크 이름 `test` 는 아래 집계 잡이 이어받는다
#   (하나라도 실패·취소면 실패). 병합 게이트(admin-github)는 head sha 의 모든 check-run 을
#   읽고, 다른 워크플로의 workflow_run 은 워크플로 전체 결론을 보므로 이름 변경에 영향이 없다.
#   timeout 은 샤드당 25분(직렬 때 45분은 29분 + 러너 흔들림 여유였다).
#   타이밍 갱신: 각 샤드가 업로드하는 `shard-timings-N` 아티팩트를
#   `python ci_shard.py --merge ... --into tests/ci_shard_timings.json` 로 합쳐 커밋한다.
jobs:
  unittest:
    name: unittest (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 11-12: GitHub 실행기 장애로 샤드가 24~25분(평소 8~10분) 걸려 25분 제한에 반복 취소됐다
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # 483 2차 판독(`collect_fda_483._reocr_483_pdf_text`)은 tesseract CLI 를 직접 부른다.
      # 엔진을 깔아 두면 `tests/test_fda483_ocr_second_chance.py` 의 실엔진 테스트가 러너에서
      # 실제로 돈다(엔진이 없으면 그 테스트만 skip — required 'false').
      - name: Setup OCR engine (tesseract)
        uses: ./.github/actions/setup-ocr
        with:
          required: 'false'
      # 루트 평면 배치(CLAUDE.md §구조 원칙)를 그대로 신뢰해 *.py 전수 컴파일한다.
      # 수동 열거는 새 모듈이 조용히 게이트를 빠져나가므로 금지 — 목록을 늘리지 말 것.
      - name: py_compile all root modules
        if: matrix.shard == 0
        run: |
          shopt -s nullglob
          files=(*.py)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::루트 .py 를 하나도 찾지 못했다 — 글롭이 무너졌다(침묵 통과 방지)"
            exit 1
          fi
          echo "compiling ${#files[@]} root modules:"
          printf '  %s\n' "${files[@]}"
          python -m py_compile "${files[@]}"
      - name: unittest (shard ${{ matrix.shard }}/4)
        run: python ci_shard.py --index ${{ matrix.shard }} --total 4 --record shard-timings-${{ matrix.shard }}.json
      - name: Upload shard timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-timings-${{ matrix.shard }}
          path: shard-timings-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  # 이전 단일 잡 이름(`test`)을 유지하는 집계 잡 — 샤드 전부 success 여야 success.
  test:
    needs: unittest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards must succeed
        run: |
          echo "unittest shards: ${{ needs.unittest.result }}"
          [ "${{ needs.unittest.result }}" = "success" ]
