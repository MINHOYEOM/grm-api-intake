name: GRM FDA 483 Body-Full Backfill

# [483 전문 소급 · 2026-11-12] 정본 raw_signals 에 전문(fda483_body_full) 없이 굳은 최근 483 을 채운다.
# backfill_483_body_full.py — ① Notion 행 원문의 전문 ② 없으면 PDF 다시 읽기(일일 수집 규칙).
# 쓰기는 원문 갱신 함수 raw_signal_apply_version(148)로만, 지금 raw 에 전문 키 하나만 더한다.
# 기본은 dry-run(apply=false). dry 에서 PDF 까지 확인하려면 probe_pdf=true(쓰지 않음).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 쓴다(기본 false = dry-run)'
        type: boolean
        default: false
      probe_pdf:
        description: 'dry-run 에서도 Notion 에 없는 행의 PDF 를 받아 판정해 본다'
        type: boolean
        default: false
      since:
        description: '게시일 하한(YYYY-MM-DD)'
        type: string
        default: '2026-06-01'
      limit:
        description: '처리할 최대 행 수(비우면 전부)'
        type: string
        default: ''
      ocr_page_budget:
        description: '스캔 PDF OCR 쪽수 상한(비우면 수집기 기본 200). 예산 소진(scan-ocr-budget)으로 남은 행을 다시 돌릴 때 올린다'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: fda483-body-full-backfill      # fda.gov 요청은 도구 안에서 30초 간격
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill fda483_body_full
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install OCR engine (tesseract)
        uses: ./.github/actions/setup-ocr
        with:
          required: 'false'

      - name: Backfill (dry-run unless apply=true)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          IN_APPLY: ${{ inputs.apply }}
          IN_PROBE: ${{ inputs.probe_pdf }}
          IN_SINCE: ${{ inputs.since }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_OCR_BUDGET: ${{ inputs.ocr_page_budget }}
        run: |
          set -uo pipefail
          if ! printf '%s' "${IN_SINCE:-}" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::since 는 YYYY-MM-DD"; exit 2
          fi
          if [ -n "${IN_LIMIT:-}" ] && ! printf '%s' "$IN_LIMIT" | grep -qE '^[0-9]+$'; then
            echo "::error::limit 은 숫자만 허용"; exit 2
          fi
          if [ -n "${IN_OCR_BUDGET:-}" ]; then
            if ! printf '%s' "$IN_OCR_BUDGET" | grep -qE '^[0-9]+$'; then
              echo "::error::ocr_page_budget 은 숫자만 허용"; exit 2
            fi
            export FDA483_OCR_PAGE_BUDGET="$IN_OCR_BUDGET"
          fi
          args=(--since "$IN_SINCE" --report fda483_body_full_report.json)
          if [ "${IN_APPLY:-false}" = "true" ]; then args+=(--apply); fi
          if [ "${IN_PROBE:-false}" = "true" ]; then args+=(--probe-pdf); fi
          if [ -n "${IN_LIMIT:-}" ]; then args+=(--limit "$IN_LIMIT"); fi
          python backfill_483_body_full.py "${args[@]}"
          rc=$?
          {
            echo "### FDA 483 body-full backfill"
            echo "- apply: \`${IN_APPLY:-false}\` · probe_pdf: \`${IN_PROBE:-false}\` · since: \`${IN_SINCE}\` · limit: \`${IN_LIMIT:-전부}\` · ocr_page_budget: \`${IN_OCR_BUDGET:-기본}\` · exit: \`${rc}\`"
            echo '```json'
            head -c 6000 fda483_body_full_report.json 2>/dev/null || echo '(리포트 없음)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fda483-body-full-report
          path: fda483_body_full_report.json
          if-no-files-found: ignore
          retention-days: 30
