name: GRM EMA Relevance Apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the verdicts to the DB (only after the dry-run table was approved)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ema-relevance-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply EMA relevance verdicts
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply)
          fi
          python ema_relevance_apply.py docs/specs/ema_relevance_decisions_2026-11-25.json --markdown "${args[@]}" | tee ema_relevance_apply.md
          cat ema_relevance_apply.md >> "$GITHUB_STEP_SUMMARY"
