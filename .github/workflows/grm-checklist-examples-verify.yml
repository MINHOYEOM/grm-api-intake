name: GRM Checklist Examples Verify

# 자가점검 체크리스트 사례 **전수 가드** — 조항마다 실린 문장이 그 조항의 지적인가.
#
# 배경(2026-09-06 사용자 신고·실측): `/findings/checklist/` 는 "조항마다 실제 지적 문장"을
# 약속하는데, 043 이 finding **앞머리**를 내려주고 화면이 240자를 잘라 찍는 구조라 두 갈래로
# 약속이 깨져 있었다 — 통짜 경고서한이 걸린 조항에는 **편지 서두**가, 조항이 본문 중간에서
# 인용된 경우에는 **다른 조항의 문장**이 실렸다. 인쇄해서 쓰는 산출물이라 이건 표시 결함이
# 아니라 정직성 결함이다. 080 이 발췌를 조항 위치에서 뜨도록 고쳤고, 이 잡이 그 수리가
# 살아 있는지 **전 조항 전수로** 계속 묻는다.
#
# ★왜 CI(코드 검사)가 아니라 별도 스케줄인가: 이 결함은 코드가 아니라 **데이터**에서 난다.
#   내일 들어오는 경고서한 하나가 파서의 degrade 경로를 타면 다시 통짜 finding 이 생기고,
#   저장소 코드는 한 글자도 안 바뀐 채 화면만 거짓이 된다. 그래서 매일 수집 뒤에 본다.
# ★읽기 전용 · anon 키. service-role 을 쓰면 RLS 를 우회해 **화면에 없는 행까지** 검사하게
#   되어, 가드가 사용자가 보는 것과 다른 세계를 검사한다(스크립트 docstring 참조).
# ★새 시크릿 없음 — SUPABASE_URL·SUPABASE_ANON_KEY(repo Variables)를 그대로 재사용한다.
on:
  schedule:
    # 매일 20:40 UTC = 익일 05:40 KST. 수집(18:17 UTC)·번역 배치 뒤라 그날 들어온 문서가
    # 이미 공개 게이트를 통과한 상태에서 본다.
    - cron: '40 20 * * *'
  workflow_dispatch:
    inputs:
      examples:
        description: '조항당 검사할 사례 수(1~5). 화면 최대치가 5다.'
        type: string
        default: '5'
      sections:
        description: '쉼표로 구분한 조항 목록(비우면 042 가 아는 전 조항).'
        type: string
        default: ''

permissions:
  contents: read
  issues: write        # 검증 실패 알림 이슈 생성/갱신/종료

concurrency:
  group: grm-checklist-examples-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Every clause's examples actually cite that clause
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: 의존성
        run: pip install -r requirements.txt

      # 판정기 자체의 오프라인 회귀(수리 전 실측 4건을 잡는가 · 수리 후 실측을 통과시키는가).
      # 라이브를 보기 전에 **검사기가 눈멀지 않았는지** 먼저 확인한다.
      - name: 판정기 오프라인 검증
        run: python -m unittest tests.test_checklist_examples_guard -v

      - name: 자격증명 선점검
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY (repo Variables) 미설정 — "\
                 "값이 없으면 스크립트가 exit 2 로 끝나 '검사했는데 통과'로 오독된다"
            exit 1
          fi

      - name: 전수 검사
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          # `inputs.*` 는 dispatch 에서만 채워진다 — 표현식에 기본값을 못박지 않으면
          # schedule 에서 빈 문자열이 인자 자리에 들어가 argparse 가 죽는다.
          EXAMPLES="${{ inputs.examples || '5' }}"
          SECTIONS="${{ inputs.sections || '' }}"
          ARGS="--examples $EXAMPLES --json checklist-examples-verify.json"
          ARGS="$ARGS --summary $GITHUB_STEP_SUMMARY"
          if [ -n "$SECTIONS" ]; then
            ARGS="$ARGS --sections $SECTIONS"
          fi
          python verify_checklist_examples.py $ARGS

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checklist-examples-verify
          path: checklist-examples-verify.json
          if-no-files-found: warn

      # continue-on-error 를 쓰지 않는다 — 잡 자체가 오늘처럼 red 로 남는 게 1차 가시성이고
      # 이슈는 2차 가시성이다. failure()/success() 는 이 잡의 앞선 스텝(오프라인 회귀·
      # 자격증명 선점검·전수 검사) 중 무엇이 실패했든 동일하게 잡는다.
      - name: Open or update checklist-verify issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[checklist-verify] 체크리스트 조항=인용문 일치 검증이 실패했습니다';
            const label = 'checklist-verify';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '체크리스트 사례 전수 가드(`grm-checklist-examples-verify.yml`)가 실패했습니다.',
              '',
              '**왜 이 알림이 중요한가**: `/findings/checklist/` 는 조항마다 실린 문장이 그 ' +
                '조항의 실제 지적이라는 걸 약속한다 — 인쇄해서 쓰는 산출물이라 이게 깨지면 ' +
                '표시 결함이 아니라 정직성 결함이고, 코드가 아니라 데이터에서 매일 새로 날 ' +
                '수 있어 계속 지켜봐야 한다.',
              '',
              `실행: ${runUrl}`,
              '',
              '흔한 원인: 판정기 오프라인 회귀 실패 · SUPABASE_URL/SUPABASE_ANON_KEY(repo ' +
                'Variables) 미설정 · 라이브 전수 검사에서 조항=인용문 불일치 발견. ' +
                '`checklist-examples-verify` 아티팩트/step summary 에서 상세를 확인하세요.',
              '',
              '_다음 실행이 성공하면 자동으로 닫힙니다._',
            ].join('\n');

            async function ensureLabel(name, color, description) {
              try { await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name }); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            }
            await ensureLabel(label, 'd93f0b', '체크리스트 조항=인용문 일치 검증 실패');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 20,
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `다시 실패했습니다 — 실행 ${context.runId}`,
              });
              core.notice(`기존 이슈 #${existing.number} 에 댓글`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label], assignees: [context.repo.owner],
              });
              core.notice(`이슈 #${created.number} 생성`);
            }

      - name: Close checklist-verify issue on recovery
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[checklist-verify] 체크리스트 조항=인용문 일치 검증이 실패했습니다';
            const label = 'checklist-verify';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 20,
            });
            for (const issue of open.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `검증이 정상 복귀해 자동으로 닫습니다 (실행 ${context.runId}).`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
              core.notice(`이슈 #${issue.number} 자동 종료`);
            }
