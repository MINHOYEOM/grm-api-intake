name: GRM Library Automatic Refresh

on:
  schedule:
    # 월요일 03:23 KST. 주간 cadence는 최신성/사이트 부하의 균형점이며 아래 게이트가 급변을 차단한다.
    - cron: '23 18 * * 0'
    # 나머지 요일 같은 시각 — **격리가 열려 있을 때만** 도는 복구 모드다(decide 잡이 판정).
    # 자료실은 주 1회라 한 번 실패하면 그대로 7일 결손이 된다. 2026-08-10 이 그랬다:
    # 같은 간헐 장애를 매일 도는 intake 는 다음 날 흡수했고 자료실은 그대로 굳었다.
    - cron: '23 18 * * 1-6'
  workflow_dispatch:
    inputs:
      max_change_count:
        description: '카탈로그별 신규+변경 허용 상한(초과 시 사람 검토)'
        required: true
        default: '20'
      max_change_percent:
        description: '카탈로그별 신규+변경 비율 상한 %(초과 시 사람 검토)'
        required: true
        default: '30'
      days:
        description: 'MFDS 수집 lookback 일수'
        required: true
        default: '120'
      retry_attempt:
        description: '자동 재시도 회차 — 사람이 넣지 않는다(격리 시 워크플로가 스스로 올린다)'
        required: false
        default: '0'

# 격리 이슈의 제목은 **여기가 단일 정의**다. decide 잡과 이슈 관리 스텝이 같은 문자열을
# 봐야 하는데, 양쪽에 따로 적으면 한쪽만 고쳐져 복구 모드가 조용히 안 도는 상태가 된다.
env:
  QUARANTINE_ISSUE_TITLE: 'GRM 자료실 수집기 실패 — 소스 격리'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: grm-library-auto-refresh
  cancel-in-progress: false

jobs:
  # 이번 실행이 돌아야 하는지만 판정한다. 평일 예약은 **격리 중일 때만** 통과시켜
  # 복구 모드로 쓰고, 평상시엔 주 1회 그대로 유지한다(사이트 부하·PR 소음 방지).
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Decide whether this run proceeds
        id: check
        env:
          GH_TOKEN: ${{ secrets.GRM_PUBLISH_TOKEN || secrets.ADMIN_GITHUB_ACTIONS_TOKEN || github.token }}
          # github.* 는 env 로만 받는다(셸 본문 직접 삽입 금지 — 저장소 규약).
          GRM_EVENT_NAME: ${{ github.event_name }}
          GRM_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GRM_EVENT_NAME" != "schedule" ]; then
            printf 'run=true\nreason=수동 실행\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # cron 은 UTC 지만 운영 기준은 KST 다(18:23 UTC = 익일 03:23 KST).
          if [ "$(TZ='Asia/Seoul' date +%u)" = "1" ]; then
            printf 'run=true\nreason=주간 정기(월요일 03:23 KST)\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OPEN=$(gh issue list --repo "$GRM_REPO" --label automation-warning --state open \
                   --json title \
                   --jq "[.[] | select(.title == \"$QUARANTINE_ISSUE_TITLE\")] | length")
          if [ "$OPEN" -gt 0 ]; then
            printf 'run=true\nreason=복구 모드(격리 이슈 열림)\n' >> "$GITHUB_OUTPUT"
          else
            printf 'run=false\nreason=평일이고 격리 없음 — 건너뜀\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        env:
          DECISION: ${{ steps.check.outputs.run }}
          DECISION_REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "판정: $DECISION — $DECISION_REASON" >> "$GITHUB_STEP_SUMMARY"

  refresh:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAX_CHANGE_COUNT: ${{ inputs.max_change_count || '20' }}
      MAX_CHANGE_PERCENT: ${{ inputs.max_change_percent || '30' }}
      LOOKBACK_DAYS: ${{ inputs.days || '120' }}
      RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
      BRANCH: automation/library-auto-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GRM_PUBLISH_TOKEN || secrets.ADMIN_GITHUB_ACTIONS_TOKEN || github.token }}
      # KR egress — **이게 이 워크플로가 MFDS 를 못 받던 진짜 이유다.** secret 은 2026-07-05
      # 부터 있었지만 넘기는 워크플로가 grm-intake 하나뿐이었다(양끝이 갖춰져 있어서
      # 배선된 줄 알았던 3주짜리 착시).
      # 2026-08-10 실측: 이 secret 을 넘긴 intake 는 같은 RSS 를 피드당 2초에 받았고(3/3),
      # 안 넘긴 이 워크플로는 7개 피드 × 재시도 3회가 전부 connect timeout 났다(0/21).
      # 새 러너로 재디스패치해도 또 0/21 — 러너 복불복이 아니라 프록시 유무가 가른다.
      # 자료실은 주 1회라 그 1회를 놓치면 곧바로 7일 결손이 된다.
      # 보드 선택(MFDS_RSS_BOARD_MODE)은 **의도적으로 넘기지 않는다** — 자료실은 7개 보드
      # 전부가 대상이고, intake 의 residual(3개)을 상속하면 커버리지가 조용히 좁아진다.
      MFDS_HTTP_PROXY: ${{ secrets.MFDS_HTTP_PROXY }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create isolated candidate branch
        run: git switch -c "$BRANCH"
      - name: Collect, stage, gate, and prepare live swap
        run: |
          set -euo pipefail
          python library_staging_build.py --swap --days "$LOOKBACK_DAYS" \
            --max-change-count "$MAX_CHANGE_COUNT" \
            --max-change-percent "$MAX_CHANGE_PERCENT"
      - name: Read quarantined sources
        # 수집에 실패한 소스는 이번 실행에서 격리되고 나머지는 계속 간다(전면 중단 아님).
        # 격리는 조용히 넘기면 안 되므로 여기서 뽑아 아래 이슈 스텝이 알린다.
        id: skipped
        if: always()
        run: |
          set -euo pipefail
          if [ -f web/data/library_staging_diff.json ]; then
            LIST=$(jq -r '(.skipped_sources // {}) | keys | join(",")' web/data/library_staging_diff.json)
          else
            LIST=""
          fi
          echo "sources=$LIST" >> "$GITHUB_OUTPUT"
          if [ -n "$LIST" ]; then
            echo "::warning title=자료실 소스 격리::수집 실패로 이번 주 제외: $LIST"
            echo "⚠️ 격리된 소스: \`$LIST\` (해당 카탈로그는 지난주 상태 유지)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Detect meaningful live changes
        id: changes
        run: |
          if git diff --quiet -- web/data/library; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No live catalogue changes; no PR will be created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Append library update history
        if: steps.changes.outputs.changed == 'true'
        run: python library_updates.py
      - name: Freeze renderer-produced goldens
        # 변경 이력을 먼저 기록해야 한다 — 아카이브·자료실 허브가 그 이력을 렌더하므로
        # 이력 기록 뒤에 동결해야 골든이 실제 발행본과 일치한다.
        if: steps.changes.outputs.changed == 'true'
        run: python web/tests/test_render.py --freeze
      - name: Re-check curated fields immediately before publishing
        if: steps.changes.outputs.changed == 'true'
        run: python library_staging_build.py --verify-curation-ref origin/main
      - name: Read gate decision
        if: steps.changes.outputs.changed == 'true'
        id: gate
        run: |
          echo "allowed=$(jq -r '.gate.automatic_merge_allowed' web/data/library_staging_diff.json)" >> "$GITHUB_OUTPUT"
          jq -r '.gate.review_reasons[]?' web/data/library_staging_diff.json > /tmp/review-reasons.txt
      - name: Commit and open candidate PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/data/library web/data/library_staging \
            web/data/library_staging_diff.json web/data/library_updates.json \
            web/tests/golden
          git commit -m "chore: refresh live regulatory library"
          git push -u origin "$BRANCH"
          REASONS=$(jq -r 'if (.gate.review_reasons | length) == 0 then "- None (automatic merge eligible)" else .gate.review_reasons | map("- " + .) | join("\n") end' web/data/library_staging_diff.json)
          SKIPPED=$(jq -r '(.skipped_sources // {}) | to_entries | if length == 0 then "none" else map("`" + .key + "` (" + .value + ")") | join(", ") end' web/data/library_staging_diff.json)
          COUNTS=$(jq -r '.sources | to_entries | map("- " + .key + ": " + (.value.baseline_count|tostring) + " → " + (.value.candidate_count|tostring) + " (new=" + (.value.new_count|tostring) + ", changed=" + (.value.changed_count|tostring) + ", removed=" + (.value.removed_count|tostring) + ")") | join("\n")' web/data/library_staging_diff.json)
          cat > /tmp/pr-body.md <<EOF
          Automated weekly regulatory-library refresh.

          ## Catalogue changes
          $COUNTS

          ## Safety gates
          - Thresholds: max ${MAX_CHANGE_COUNT} items or ${MAX_CHANGE_PERCENT}% per catalogue
          - Quarantined sources (excluded from this run): ${SKIPPED:-none}
          - Existing curated fields (`code`, `title_en`, `pdf_url`, `ko_url`, `doc_type`): preserved

          ## Review reasons
          $REASONS

          Live catalogues and renderer-produced goldens are committed together. Automatic merge occurs only after the explicit GRM CI dispatch succeeds.
          EOF
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh live regulatory library" \
            --body-file /tmp/pr-body.md
          PR_NUMBER=$(gh pr view "$BRANCH" --json number -q .number)
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Mark review-required candidate
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed != 'true'
        run: gh pr edit "${{ steps.pr.outputs.number }}" --add-label automation-warning
      - name: Dispatch CI gate
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed == 'true'
        id: ci
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run grm-ci.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow grm-ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .createdAt >= \"$STARTED\") | .databaseId" \
              | head -n 1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -n "$RUN_ID" ] || { echo "CI dispatch run not found" >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --exit-status
      - name: Merge only after green CI
        if: steps.changes.outputs.changed == 'true' && steps.gate.outputs.allowed == 'true'
        run: gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
      - name: Open, escalate, or close the quarantine issue
        # 격리를 알리는 유일한 경로. 제목+라벨로 이슈 1건만 유지하고(주마다 새 이슈 X),
        # 최초 감지일은 본문의 HTML 주석에 실어 연속 실패 주수를 계산한다(저장소 상태 없이
        # 이슈 자체가 유일 정본 — 변경 없는 주엔 커밋이 없어 파일 상태는 못 믿는다).
        if: always()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'web/data/library_staging_diff.json';
            // 리포트가 없다 = 후보 생성 자체가 중단됐다(과반 실패 등). 이건 "격리 없음"이
            // 아니라 **판정 불가**다 — 여기서 빈 객체로 읽고 이슈를 닫으면 전면 중단을
            // 복구로 오인해 알림이 사라진다. 그 경우 잡 자체가 실패하므로 손대지 않는다.
            if (!fs.existsSync(path)) {
              core.warning('library_staging_diff.json 없음 — 격리 판정 건너뜀(수집 전면 중단 추정)');
              return;
            }
            const skipped = JSON.parse(fs.readFileSync(path, 'utf8')).skipped_sources || {};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // 제목은 워크플로 상단 env 가 단일 정의다 — decide 잡이 같은 문자열로 복구
            // 모드를 판정하므로 여기서 따로 적으면 한쪽만 바뀌어 조용히 어긋난다.
            const title = process.env.QUARANTINE_ISSUE_TITLE;
            const label = 'automation-warning';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`
                         + `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            const names = Object.keys(skipped).sort();

            if (names.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `✅ 복구 확인 — 이번 실행에서 전 소스가 정상 수집됐습니다. (${runUrl})`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }

            // 최초 감지일 — 기존 이슈 본문에서 승계(없으면 오늘). 주수 계산의 기준점.
            const today = new Date().toISOString().slice(0, 10);
            const marker = /<!-- first-failed: (\d{4}-\d{2}-\d{2}) -->/;
            const firstFailed =
              (existing && (existing.body || '').match(marker) || [])[1] || today;
            const weeks = Math.floor(
              (Date.parse(today) - Date.parse(firstFailed)) / (7 * 86400 * 1000)) + 1;

            const lines = [
              `<!-- first-failed: ${firstFailed} -->`,
              `자료실 주간 자동 갱신에서 아래 소스를 **이번 실행에서 제외(격리)** 했습니다.`,
              '',
              '| 소스 | 실패 사유 |',
              '|---|---|',
              ...names.map(n => `| \`${n}\` | ${String(skipped[n]).replace(/\|/g, '\\|')} |`),
              '',
              `- 최초 감지: **${firstFailed}** · 연속 ${weeks}주차 · 최근 실행: ${runUrl}`,
              '',
              '### 지금 상태',
              '- 격리된 소스의 라이브 카탈로그는 **마지막 정상 수집 상태 그대로**입니다(삭제·손상 아님 — 이번 주 신규분만 못 받았습니다).',
              '- **나머지 소스는 정상 갱신**됐습니다. 사이트·뉴스레터도 그 소스들만 반영합니다.',
              '',
              '### 확인 방법',
              '```bash',
              `python library_staging_build.py --sources ${names.join(',')}`,
              '```',
              '원문 페이지 구조가 바뀌었으면 해당 `library_collect_<source>.py` 파서를 고치세요.',
              '',
              '### 자동 복구',
              '- 이 이슈가 열려 있는 동안 자료실 갱신은 **매일 03:23 KST** 재시도합니다(평상시 주 1회 → 복구 모드).',
              '- 격리 감지 직후에도 **새 러너로 최대 2회** 즉시 재시도합니다(같은 프로세스의 HTTP 재시도는 같은 IP라 IP 거부에 무력).',
              '- 복구되면 이 이슈는 자동으로 닫히고 주 1회로 돌아갑니다.',
            ];
            if (weeks >= 3) {
              lines.splice(1, 0,
                `> 🚨 **${weeks}주 연속 실패** — 일시 장애가 아니라 원문 구조 변경일 가능성이 높습니다. 파서 점검이 필요합니다.`,
                '');
            }
            const body = lines.join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `여전히 격리 중: \`${names.join('`, `')}\` (연속 ${weeks}주차 · ${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: [label],
              });
            }

      - name: Retry on a fresh runner when a source was quarantined
        # 같은 프로세스의 HTTP 재시도(3회·90초)는 **같은 IP** 라 IP 거부에는 무력하다.
        # 새 러너를 뽑는 유일한 방법이 새 실행이라 여기서 자기 자신을 다시 디스패치한다.
        #
        # 다만 이건 **보조 방어층**이다 — 2026-08-10 실측상 MFDS 는 프록시 없이는 러너를
        # 바꿔도 두 번 다 0/21 이었다. 진짜 수리는 위의 MFDS_HTTP_PROXY 배선이고, 이
        # 재시도는 그 밖의 소스(ema·who·pics·health_canada 등)의 일시 장애를 흡수한다.
        if: always() && steps.skipped.outputs.sources != '' && fromJSON(env.RETRY_ATTEMPT) < 2
        env:
          SKIPPED_SOURCES: ${{ steps.skipped.outputs.sources }}
          RETRY_NEXT: ${{ fromJSON(inputs.retry_attempt || '0') + 1 }}
        run: |
          set -euo pipefail
          echo "::warning title=자료실 재시도::격리($SKIPPED_SOURCES) — 새 러너로 재시도 $RETRY_NEXT/2"
          echo "🔁 격리 \`$SKIPPED_SOURCES\` 감지 → 새 러너로 재시도 $RETRY_NEXT/2" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run grm-library-staging.yml \
            -f max_change_count="$MAX_CHANGE_COUNT" \
            -f max_change_percent="$MAX_CHANGE_PERCENT" \
            -f days="$LOOKBACK_DAYS" \
            -f retry_attempt="$RETRY_NEXT"

      - name: Reconcile the published brief against the live catalogue
        # 브리프(일일 intake)와 자료실(주간 갱신)은 **서로 다른 실행**이라 원리상 어긋난다.
        # 2026-08-10 에는 그 어긋남을 잡는 층이 아예 없어서, 발행본을 눈으로 본 사람이
        # 탐지자였다. 여기서 매 실행 대조해 격차를 이슈로 남긴다.
        if: always()
        id: reconcile
        run: |
          set -euo pipefail
          python library_brief_reconcile.py --report /tmp/library-brief-gap.json > /dev/null
          MISSING=$(jq -r '.missing_count' /tmp/library-brief-gap.json)
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ "$MISSING" -gt 0 ]; then
            echo "::warning title=브리프-자료실 격차::발행 브리프에 있는 식약처 문서 ${MISSING}건이 자료실에 없다"
            {
              echo "### ⚠️ 브리프-자료실 격차 ${MISSING}건"
              jq -r '.missing[] | "- `\(.id)` \(.title)"' /tmp/library-brief-gap.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 브리프-자료실 대조: 격차 없음" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or close the brief-catalogue gap issue
        # 격리 이슈와 **분리한다** — 원인이 다르다. 격리는 "이번에 못 받았다"이고, 격차는
        # "발행본에 있는데 자료실에 없다"라서 격리가 없는데도 남을 수 있다(수록 규칙·필터
        # 문제 등). 한 이슈에 합치면 원인이 다른 사건이 한 카운터에 섞인다.
        if: always()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/library-brief-gap.json';
            if (!fs.existsSync(path)) {
              core.warning('대조 리포트 없음 — 격차 판정 건너뜀(판정 불가이지 격차 0 아님)');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'GRM 브리프-자료실 격차 — 발행본에 있는 문서가 자료실에 없음';
            const label = 'automation-warning';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`
                         + `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = issues.find(i => i.title === title);

            if (!report.missing_count) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `✅ 해소 확인 — 발행 브리프의 식약처 문서가 모두 자료실에 있습니다. (${runUrl})`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }

            const body = [
              `발행 브리프 \`${report.brief_file}\`(${report.publish_date}) 의 식약처 문서 **${report.missing_count}건** 이 자료실 카탈로그에 없습니다.`,
              '',
              '| 문서번호 | 제목 |',
              '|---|---|',
              ...report.missing.map(m => `| \`${m.id}\` | ${String(m.title || '').replace(/\|/g, '\\|')} |`),
              '',
              `- 대조 대상 보드: ${report.eligible_boards.map(b => '`' + b + '`').join(' · ')}`,
              `- 자료실 수록 ${report.library_item_count}건 / 대조한 카드 ${report.checked_card_count}건`,
              `- 최근 실행: ${runUrl}`,
              '',
              '### 왜 생기나',
              '브리프는 **매일** 도는 intake 가, 자료실은 **주 1회** 도는 갱신이 만듭니다. 자료실 수집이 한 번 실패하면 그 주 신규분이 통째로 빠지고 발행본과 어긋납니다.',
              '',
              '### 확인 순서',
              '1. 같은 실행의 격리 이슈가 열려 있는지 — 열려 있으면 원인은 수집 실패입니다(복구되면 자동 해소).',
              '2. 격리가 없는데 격차가 남으면 **수록 규칙** 문제입니다. `library_staging_build.MFDS_TYPES` 와 카드의 보드 id 를 대조하세요.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }

      - name: Summary
        if: always()
        run: |
          if [ -f web/data/library_staging_diff.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat web/data/library_staging_diff.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
