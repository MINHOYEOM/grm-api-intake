name: 'Setup OCR engine (tesseract)'
description: >
  스캔 483 OCR 이 요구하는 tesseract(+eng 언어팩)를 러너에 설치하고, 설치 결과를 반드시
  관측 가능하게 남긴다. 소비자 둘 — 빈 쪽 판독 `_ocr_483_pdf_text`(PyMuPDF get_textpage_ocr,
  tessdata 사용)와 관찰 0건 문서의 전면 재판독 `_reocr_483_pdf_text`(`tesseract` CLI 직접 실행).

# 모델 = apt `tesseract-ocr-eng`(tessdata_fast 계열). 2026-10-28 벤치마크에서 tessdata_best 는
#   쪽당 3.5s → 26.6s(7.5배)인데 판독 실패 44건 회수가 늘지 않아 채택하지 않았다
#   (근거: docs/specs/FDA483_OCR_판독개선_벤치마크_2026-10-28.md). 모델을 바꿀 땐 여기서만 바꾼다.

# 왜 복합 액션인가 (2026-07-30):
#   483 PDF 텍스트 추출 경로(`collect_fda_483._fetch_fda483_pdf_text`)는 **두 워크플로**가
#   공유한다 — 일일 수집(grm-intake)과 과거분 백필(grm-findings-backfill-fetch). 그런데
#   OCR 을 도입한 PR #456 은 tesseract 설치 스텝을 grm-intake 에만 넣었다. 백필은 같은 코드로
#   PDF 를 열면서 엔진이 없어 하루 3회·무인으로 `scan-ocr-unavailable` 을 raw_signals 에
#   영구 적재했다(실측 31건). **설치 정의가 호출지마다 복제되면 반드시 한쪽이 뒤처진다** —
#   그래서 정의를 여기 한 곳에만 둔다. 새 워크플로가 483 PDF 경로를 쓰면 이 액션을 부른다.
#
# 침묵 금지 원칙:
#   설치 실패를 삼키지 않는다. apt 출력에서 `-qq` 를 뺐고(사유가 로그에 남아야 한다),
#   검증을 별도 스텝으로 분리해 엔진 부재를 **워크플로 주석(annotation) + 잡 요약**으로
#   띄운다. `required` 로 "없으면 무의미한 워크플로"와 "degrade 해도 되는 워크플로"를 구분한다.

inputs:
  required:
    description: >
      'true'  = 엔진이 없으면 잡을 실패시킨다(OCR 이 존재 이유인 워크플로).
      'false' = 경고·요약만 남기고 계속한다(수집 자체는 graceful degrade 로 진행).
    required: false
    default: 'false'

outputs:
  available:
    description: "'true' = tesseract + eng 언어팩 사용 가능"
    value: ${{ steps.verify.outputs.available }}

runs:
  using: composite
  steps:
    # 설치는 실패해도 스텝을 죽이지 않는다 — 판정은 전적으로 verify 스텝이 한다.
    # (복합 액션의 스텝에는 continue-on-error 를 쓸 수 없어 rc 를 셸에서 흡수한다.)
    # `-qq` 를 쓰지 않는 이유: 2026-07-30 조사에서 이 스텝의 실패 사유를 로그에서 읽을 수
    # 없다는 점이 오진의 출발점이었다. 조용한 성공보다 시끄러운 로그가 낫다.
    # [2026-11-12] apt 에 시간 상한을 둔다. 11-11 14:42~16:05 UTC 러너가 Ubuntu 미러
    # (archive/security/azure.archive.ubuntu.com) 이름을 못 풀어 apt-get update 하나가 15분을 쓰고
    # 실패했다(3회 연속, 이미지 'resolute'). 그동안 다른 호스트(pypi·fda.gov)는 정상이었다.
    - name: Install tesseract (apt)
      shell: bash
      run: |
        set +e
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
        sudo timeout 300 apt-get update ${APT_OPTS}
        rc_update=$?
        sudo timeout 600 apt-get install -y ${APT_OPTS} tesseract-ocr tesseract-ocr-eng
        rc_install=$?
        echo "apt-get update rc=${rc_update} / install rc=${rc_install}"
        exit 0

    # 대체 경로 — apt 로 바이너리나 eng 언어팩을 못 얻었을 때만 conda-forge 에서 받는다
    # (micromamba 정적 바이너리는 GitHub 릴리스, 패키지는 conda.anaconda.org — Ubuntu 미러와 다른 호스트).
    # 버전 고정: micromamba 2.0.5-0. conda-forge tesseract 는 share/tessdata 에 eng 를 함께 싣는다.
    # 그래도 eng 가 없으면 tessdata_fast(4.1.0 태그)의 eng.traineddata 를 받는다 — apt 판과 같은 fast 계열.
    # 결과 판정은 여전히 verify 스텝 한 곳이 한다(여기서는 실패를 삼키고 경로만 심는다).
    - name: Install tesseract (fallback, conda-forge)
      shell: bash
      run: |
        set +e
        has_eng() { tesseract --list-langs 2>/dev/null | tail -n +2 | grep -qx eng; }
        if command -v tesseract >/dev/null 2>&1 && has_eng; then
          echo "apt 경로로 설치됨 — 대체 경로 생략"
          exit 0
        fi
        echo "::warning title=OCR 대체 설치::apt 경로 실패 — conda-forge 에서 tesseract 를 받는다"
        root="${RUNNER_TEMP}/ocr-mamba"
        prefix="${RUNNER_TEMP}/ocr-env"
        mkdir -p "${root}/bin"
        url="https://github.com/mamba-org/micromamba-releases/releases/download/2.0.5-0/micromamba-linux-64"
        for i in 1 2 3; do
          curl -fsSL --retry 3 --max-time 120 -o "${root}/bin/micromamba" "${url}" && break
          sleep 10
        done
        chmod +x "${root}/bin/micromamba"
        for i in 1 2 3; do
          timeout 600 "${root}/bin/micromamba" create -y -q -r "${root}" -p "${prefix}" -c conda-forge tesseract && break
          sleep 15
        done
        if [ ! -x "${prefix}/bin/tesseract" ]; then
          echo "conda-forge 설치 실패 — verify 스텝이 판정한다"
          exit 0
        fi
        tessdata="${prefix}/share/tessdata"
        if [ ! -f "${tessdata}/eng.traineddata" ]; then
          mkdir -p "${tessdata}"
          curl -fsSL --retry 3 --max-time 120 -o "${tessdata}/eng.traineddata" \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata"
        fi
        echo "${prefix}/bin" >> "$GITHUB_PATH"
        echo "TESSDATA_PREFIX=${tessdata}" >> "$GITHUB_ENV"
        echo "대체 경로 설치: ${prefix}/bin/tesseract / tessdata=${tessdata}"
        exit 0

    # 설치 성공을 **바이너리와 언어팩으로** 확인한다. "tesseract 는 있는데 eng 가 없다"는
    # 별개의 조용한 실패 모드다(PyMuPDF 는 tessdata 를 못 찾으면 RuntimeError 를 던진다).
    - name: Verify OCR engine
      id: verify
      shell: bash
      env:
        OCR_REQUIRED: ${{ inputs.required }}
      run: |
        set +e
        # 존재 확인은 `command -v` 로 한다 — `tesseract --version | head -1` 의 $? 는
        # **head 의 종료코드**(거의 항상 0)라서 바이너리 부재를 못 잡는다(파이프 함정).
        if command -v tesseract >/dev/null 2>&1; then
          present=1
        else
          present=0
        fi
        version="$(tesseract --version 2>&1 | head -1)"
        langs="$(tesseract --list-langs 2>&1 | tail -n +2 | tr '\n' ' ')"
        set -e

        # 바이너리 + eng 언어팩 둘 다 필요하다. "tesseract 는 있는데 eng 가 없다"는
        # 별개의 조용한 실패 모드다(PyMuPDF 가 tessdata 를 못 찾아 RuntimeError).
        ok="${present}"
        case " ${langs} " in *" eng "*) ;; *) ok=0 ;; esac

        if [ "${ok}" -eq 1 ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "OCR 엔진 정상: ${version} / langs: ${langs}"
          exit 0
        fi

        echo "available=false" >> "$GITHUB_OUTPUT"
        detail="binary_present=${present} / version='${version}' / langs='${langs}'"
        msg="OCR 엔진(tesseract+eng) 설치 실패(apt·conda-forge 둘 다) — 스캔 483 은 본문 없이 처리된다(scan-ocr-unavailable)."
        echo "::warning title=OCR 엔진 없음::${msg} ${detail}"
        {
          echo "### ⚠️ OCR 엔진 없음 (tesseract)"
          echo ""
          echo "${msg}"
          echo ""
          echo '```'
          echo "${detail}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${OCR_REQUIRED}" = "true" ]; then
          echo "::error title=OCR 엔진 필수::이 워크플로는 OCR 없이는 산출물이 무의미하다 — 실패로 종료한다."
          exit 1
        fi
        exit 0
