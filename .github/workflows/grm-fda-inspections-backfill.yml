name: GRM FDA GMP Inspection Classifications Backfill

# FDA Data Dashboard API(inspections_classifications) GMP 실사 등급(NAI/VAI/OAI) 적재 —
# **월 1회 자동 갱신 + 수동 dispatch**. public.fda_inspections(058/059, 사람이 SQL Editor 로
# 057 -> 058 -> 059 순서 적용 완료 후에만 --apply 로 돌릴 것) 에 직행 upsert 한다.
#
# ★2026-08-12 신설(월간 크론) 사유: 이 표는 2026-08-11 에 1회성 수동 실행으로 6,417건이
#   적재됐고 그 뒤로 갱신 경로가 없었다. FDA 는 새 실사 등급을 계속 등록하므로 방치하면
#   화면 숫자가 조용히 낡는다. "낡았다"를 사람이 볼 수 있게 하는 층은 둘이다 —
#   (1) 이 크론(자동 갱신), (2) 059 가 scope 에 실어 트렌드 화면에 적는 기준일 2종.
#
# ★핵심 제약:
#   - git 쓰기 없음(checkout=read-only). Notion 무접촉 -- findings 파이프라인과 무관한
#     별도 평평한 집계표라 주간 브리프에 영향 없음.
#   - 멱등: PostgREST upsert(on_conflict=inspection_id, resolution=merge-duplicates) --
#     재실행마다 최신 원천값으로 갱신된다. **실패분만 골라 재실행할 필요가 없고 전량
#     재실행이 항상 안전하다** -- 그래서 월간 크론은 부분 갱신이 아니라 회계연도 창
#     전량을 매번 다시 싣는다(수집 상태를 어디에도 저장하지 않는다 = 상태 표류 없음).
#   - dry_run=true(기본값)로 먼저 실행해 리포트의 gmp_candidates/received_total/
#     excluded_by_project_area 가 실측치(수신 11,104 / GMP 6,417 / 제외 4,687)와 맞는지
#     확인한 뒤 apply 로 재실행한다. ★dry-run 도 DDAPI 는 실제로 호출한다(Supabase 적재만
#     생략) -- FDA_API_USER/FDA_DDAPI_KEY 는 dry-run 에도 필요하다.
#     ★이 기본값은 **수동 dispatch 전용**이다. 스케줄 실행은 아래 "적재 모드 판정"에서
#     코드가 명시적으로 --apply 를 고른다(빈 문자열 폴백에 기대지 않는다).
#   - ProjectArea 는 DDAPI filters 로 걸 수 없는 반환 전용 컬럼이라(413 invalid_filters),
#     ProductType=Drugs 전량을 받아 클라이언트에서 Drug Quality Assurance 만 골라 싣는다
#     -- 058 마이그레이션 헤더/collect_fda_inspections.py 모듈독스트링 참고.
#   - 회계연도 창은 수집기가 **실행일에서 계산**한다(fiscal_year_window(), 기본 최근 7년) --
#     크론이 해를 넘겨도 창이 저절로 밀리므로 이 파일에 연도를 적지 않는다.
#
# ★비용: POST 3콜(페이지 5000×2 + 1104) + upsert 최대 7청크(1000행/청크). 수 분 내 완료 예상.
on:
  schedule:
    # ── 월간 정기 ────────────────────────────────────────────────────────────
    # 매월 1일 15:47 UTC = 매월 2일 00:47 KST.
    #  · 정각을 피한다 -- 이 저장소의 크론은 정각 부하 피크에서 상시 지각한 이력이 있다
    #    (grm-findings-classification-audit.yml 17~20행에 같은 근거가 적혀 있다).
    #  · 15시 UTC 대는 이 저장소의 다른 22개 크론이 하나도 쓰지 않는 빈 시간대다
    #    (혼잡 구간은 18~21 UTC). 요일·시각 어느 쪽으로도 겹치지 않는다.
    - cron: '47 15 1 * *'
    # ── 결손 복구(정기 실행이 실패했을 때만 실제로 돈다) ──────────────────────
    # 같은 시각, 매월 8·15·22일. **월간 크론은 지각을 흡수할 기회가 없다** -- 일일 크론은
    # 다음 날이 메워 주고 주간 크론도 6일 안에 재시도할 수 있지만, 월 1회는 한 번 실패하면
    # 그대로 한 달이 빈다(grm-library-staging.yml 이 겪은 "주 1회라 한 번 실패하면 7일
    # 결손"의 30일 버전). 아래 decide 잡이 **직전 실행 실패 이슈가 열려 있을 때만**
    # 통과시키므로 평상시에는 판정 잡 하나만 돌고 끝난다(적재·API 호출 0).
    - cron: '47 15 8,15,22 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = DDAPI 수집만(Supabase 적재 없음). 먼저 이걸로 검증. ※수동 실행에만 적용 — 스케줄은 항상 실제 적재.'
        type: boolean
        default: true
      max_pages:
        description: '안전판 페이지 상한. 꽉 찬 페이지로 소진하면 조용히 자르지 않고 실패한다. 비우면 수집기 기본값.'
        type: string
        default: '10'
      chunk_size:
        description: 'upsert POST 당 행 수. 비우면 수집기 기본값.'
        type: string
        default: '1000'

# 실패 알림 이슈의 제목은 **여기가 단일 정의**다. decide 잡(복구 모드 판정)과 이슈
# 생성/종료 스텝이 같은 문자열을 봐야 하는데, 양쪽에 따로 적으면 한쪽만 고쳐져 복구
# 모드가 조용히 안 도는 상태가 된다(grm-library-staging.yml 30~33행 선례).
env:
  FAILURE_ISSUE_TITLE: 'GRM FDA 실사등급 월간 갱신 실패'
  # 정기 크론 문자열 단일 정의. decide 잡이 `github.event.schedule` 과 **문자열 그대로**
  # 대조해 "이번 발화가 정기인가"를 판정한다 -- 실행 시각에서 날짜를 되짚지 않는다.
  # 위 `schedule:` 의 첫 항목과 반드시 같아야 하며, 어긋나면 정기 실행이 통째로
  # 복구 분기로 떨어지므로 테스트가 두 문자열의 일치를 직접 검사한다.
  REGULAR_CRON: '47 15 1 * *'

permissions:
  contents: read
  issues: write        # 스케줄 실행 실패 알림 이슈 생성/갱신/종료

concurrency:
  # 자기 자신과만 직렬화한다(월간 크론 + 수동 dispatch 둘 다 이 그룹) -- 일일 크론에는
  # 이 소스가 여전히 붙어 있지 않아 다른 워크플로와 경합할 자원이 없다. 복구 크론이
  # 정기 크론과 같은 시각이지만 날짜가 달라 동시에 뜨지 않는다.
  group: fda-inspections-backfill
  cancel-in-progress: false

jobs:
  # 이번 실행이 실제로 적재까지 가야 하는지만 판정한다. 정기(매월 1일)는 무조건 통과,
  # 복구일(8·15·22일)은 **실패 이슈가 열려 있을 때만** 통과 -- 평상시엔 여기서 끝난다.
  decide:
    name: Decide whether this run proceeds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Decide
        id: check
        env:
          GH_TOKEN: ${{ secrets.GRM_PUBLISH_TOKEN || secrets.ADMIN_GITHUB_ACTIONS_TOKEN || github.token }}
          # github.* 는 env 로만 받는다(셸 본문 직접 삽입 금지 -- 저장소 규약 W2).
          GRM_EVENT_NAME: ${{ github.event_name }}
          GRM_REPO: ${{ github.repository }}
          # ★어느 크론이 발화했는지는 GitHub 이 이벤트에 실어 준다. 실행 시각에서
          #   되짚지 않는 이유는 아래 정기 분기 주석 참고.
          GRM_SCHEDULE: ${{ github.event.schedule }}
          # 데이터 파생 결손 판정용(아래 ③). 적재 잡과 같은 자격증명을 쓴다.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          # ── ① 수동 실행 ────────────────────────────────────────────────────
          if [ "$GRM_EVENT_NAME" != "schedule" ]; then
            printf 'run=true\nreason=수동 실행\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── ② 월간 정기 ────────────────────────────────────────────────────
          # ★★판정은 `github.event.schedule`(발화한 크론 문자열) **하나로만** 한다.
          #   종전 구현은 `date -u +%d` 로 실행 시각에서 날짜를 되짚었는데, 크론이
          #   8시간 13분 넘게 지각하면 UTC 날짜가 02 로 넘어가 정기 분기를 놓치고,
          #   그 달은 복구 분기로 떨어진다. 그런데 "실행이 늦었을 뿐 실패는 아니다"라
          #   실패 이슈가 없으므로 복구도 건너뛴다 → **한 달이 통째로, 전부 초록인 채
          #   조용히 빈다.** 이 저장소는 grm-library-staging.yml 에서 같은 함정을
          #   이미 겪었다(주간 크론이 KST 화요일로 밀려 요일 검사에 안 걸림, 2026-08-11
          #   에 사람이 손으로 메움). `github.event.schedule` 은 지각과 무관하게 항상
          #   발화한 크론 문자열 그대로라 이 경로가 원천 봉쇄된다.
          if [ "$GRM_SCHEDULE" = "$REGULAR_CRON" ]; then
            printf 'run=true\nreason=월간 정기(%s)\n' "$GRM_SCHEDULE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── ③ 복구일(8·15·22일) — 두 신호를 OR 로 본다 ─────────────────────
          # (3-a) 직전 실행이 **실패**했다(실패 이슈가 열려 있다).
          # (3-b) 실패는 없는데 **표가 이번 달 것이 아니다**(= 실행이 아예 없었거나,
          #       초록으로 끝났는데 아무것도 안 실렸다). 3-a 만 보면 "실행이 없었다"를
          #       영원히 못 잡는다 -- grm-library-staging.yml 이 세 번째 분기를 추가한
          #       이유가 정확히 이것이고, 그 파일은 데이터(generated_on)에서 판정한다.
          #       여기서는 059 가 scope 에 실은 last_ingested_date_kst 를 쓴다.

          # (3-a) ★--limit 필수: gh 기본 상한은 30이고 `automation-failure` 는
          #   grm-intake.yml 이 실패일마다 **새 이슈**를 만들어 쌓는 공유 라벨이라,
          #   30건이 쌓이는 순간 제목 고정인 우리 이슈가 조회 페이지 밖으로 밀려
          #   복구가 영영 안 돈다(조용히).
          OPEN=$(gh issue list --repo "$GRM_REPO" --label automation-failure --state open \
                   --limit 200 --json title \
                   --jq "[.[] | select(.title == \"$FAILURE_ISSUE_TITLE\")] | length" \
                   2>/dev/null || true)
          case "$OPEN" in
            ''|*[!0-9]*)
              echo "::warning title=FDA 실사등급 복구 판정(실패 이슈) 불가::열린 실패 이슈를 조회하지 못했습니다 -- 아래 데이터 판정으로만 결정합니다."
              OPEN=0 ;;
          esac
          if [ "$OPEN" -gt 0 ]; then
            printf 'run=true\nreason=복구 모드(직전 월간 갱신 실패 이슈 열림)\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # (3-b) 데이터 파생 판정. 059 미적용/RPC 도달 불가면 키가 없으므로 판정을
          #   포기하고 **경고를 남긴 뒤** 건너뛴다(없는 값으로 단정하지 않는다).
          MONTH_START=$(date -u +%Y-%m-01)
          LAST=""
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            # ★파서를 쓰지 않고 grep 으로 값만 집는다. YAML `run: |` 블록 안에서는
            #   여러 줄 python -c 가 **블록 스칼라를 끊어** 워크플로 자체를 깨뜨린다
            #   (열 0 으로 떨어지는 줄이 블록을 종료시킨다 -- 실제로 한 번 밟았다).
            #   아래 case 가 형식을 검증하므로 느슨한 추출로 충분하다.
            LAST=$(curl -sS -m 30 -X POST "$SUPABASE_URL/rest/v1/rpc/fda_inspection_stats" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -d '{}' 2>/dev/null | grep -o '"last_ingested_date_kst":"[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]"' | grep -o '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]' | head -n 1 || true)
          fi
          case "$LAST" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *)
              echo "::warning title=FDA 실사등급 결손 판정 불가::last_ingested_date_kst 를 읽지 못했습니다(059 미적용 또는 RPC 도달 불가) -- 건너뜁니다."
              printf 'run=false\nreason=복구일이지만 실패 이슈 없음 + 데이터 판정 불가 -- 건너뜀\n' >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # 문자열 비교로 충분하다(YYYY-MM-DD 는 사전순 = 시간순).
          # ★거짓 양성 1종을 **알고** 받아들인다: FDA 가 이번 달에 새 실사를 한 건도
          #   등록하지 않으면 이 값이 안 움직여 복구가 헛돈다. 대가는 멱등 재적재
          #   몇 분이고, 반대 방향 오류(한 달 결손을 못 봄)는 화면 숫자가 조용히
          #   낡는 것이라 훨씬 비싸다. 신선한 쪽으로 틀리게 둔다.
          if [ "$LAST" \< "$MONTH_START" ]; then
            printf 'run=true\nreason=복구 모드(표의 마지막 유입 %s 가 이번 달(%s) 이전 -- 정기 실행이 안 돌았거나 아무것도 안 실렸다)\n' \
              "$LAST" "$MONTH_START" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'run=false\nreason=복구일이지만 실패 이슈 없음 + 표가 이번 달 것(%s) -- 건너뜀\n' \
            "$LAST" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          DECISION: ${{ steps.check.outputs.run }}
          DECISION_REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "판정: $DECISION — $DECISION_REASON" >> "$GITHUB_STEP_SUMMARY"

  backfill:
    name: Backfill FDA GMP inspection classifications (no git writes)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SUPABASE_URL 은 grm-intake.yml 이 이미 쓰는 동일 var 재사용(신규 등록 불필요).
      # FDA_API_USER/FDA_DDAPI_KEY/SUPABASE_SERVICE_ROLE_KEY 는 secrets 3개.
      - name: Run FDA GMP inspection classifications backfill
        id: backfill
        env:
          FDA_API_USER: ${{ secrets.FDA_API_USER }}
          FDA_DDAPI_KEY: ${{ secrets.FDA_DDAPI_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ★dispatch 입력과 이벤트 이름을 전부 env 로 받는다 -- 셸 본문에 ${{ }} 를 직접
          #   삽입하지 않는다(저장소 규약 W2). 스케줄 실행에서 IN_* 는 **빈 문자열**이다.
          GRM_EVENT_NAME: ${{ github.event_name }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_MAX_PAGES: ${{ inputs.max_pages }}
          IN_CHUNK_SIZE: ${{ inputs.chunk_size }}
        run: |
          set -euo pipefail
          ARGS=(--output backfill_report.json)
          # ── 적재 모드 판정 ───────────────────────────────────────────────────
          # ★스케줄 이벤트에는 dispatch 입력이 없다(전부 빈 문자열). 그래서 여기서
          #   **코드가 값을 명시**한다 -- 빈 문자열이 어느 쪽으로 떨어지는지에 기대면
          #   두 가지가 동시에 터진다:
          #     (1) `--max-pages ""` 는 argparse 를 즉시 죽인다(type=int, exit 2).
          #         실측: `--dry-run --max-pages "" --chunk-size ""` -> EXIT 2.
          #     (2) `[ "$IN_DRY_RUN" = "true" ]` 는 빈 문자열에서 else 로 빠져
          #         **사람 게이트 없이 --apply** 로 간다. (1)을 인자 폴백으로만
          #         때우면 그 순간 무인 프로덕션 적재가 된다.
          #   스케줄은 실제 적재가 **목적**이므로 --apply 가 맞지만, 그 선택은 우연이
          #   아니라 이 분기가 내려야 한다. 상한(--max-pages/--chunk-size)은 아예 넘기지
          #   않고 수집기 기본값(MAX_PAGES=10 / UPSERT_CHUNK_SIZE=1000)에 맡긴다 --
          #   같은 숫자를 여기 또 적으면 한쪽만 고쳐져 조용히 어긋난다.
          if [ "$GRM_EVENT_NAME" = "schedule" ]; then
            MODE="apply"
            ARGS+=(--apply)
          else
            if [ "$IN_DRY_RUN" = "true" ]; then
              MODE="dry-run"
              ARGS+=(--dry-run)
            else
              MODE="apply"
              ARGS+=(--apply)
            fi
            # 수동 실행에서만 상한을 넘긴다. 비워서 실행한 경우까지 방어한다(빈 문자열을
            # 그대로 넘기면 argparse 가 exit 2 로 죽는다 -- 위 (1)과 같은 함정).
            if [ -n "$IN_MAX_PAGES" ]; then ARGS+=(--max-pages "$IN_MAX_PAGES"); fi
            if [ -n "$IN_CHUNK_SIZE" ]; then ARGS+=(--chunk-size "$IN_CHUNK_SIZE"); fi
          fi
          printf 'mode=%s\n' "$MODE" >> "$GITHUB_OUTPUT"
          echo "event=$GRM_EVENT_NAME mode=$MODE args=${ARGS[*]}"
          python collect_fda_inspections.py "${ARGS[@]}"

      - name: Write step summary
        if: always()
        env:
          GRM_EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ steps.backfill.outputs.mode }}
          DECISION_REASON: ${{ needs.decide.outputs.reason }}
        run: |
          {
            echo "### GRM FDA GMP Inspection Classifications Backfill"
            echo ""
            echo "event: \`$GRM_EVENT_NAME\` / mode: \`${RUN_MODE:-미판정}\` / 판정: $DECISION_REASON"
            echo ""
            if [ -f backfill_report.json ]; then
              echo '```json'
              cat backfill_report.json
              echo '```'
            else
              echo "backfill_report.json 미생성 -- 인자/자격증명/수집 실패로 조기 종료 가능"
              echo "(FDA_API_USER/FDA_DDAPI_KEY, --apply 시 SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY 확인)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ★스케줄 실행이 조용히 실패하면 아무도 모른다 -- 이 표는 화면 숫자의 "분모"라
      #   낡아도 겉으로는 멀쩡해 보인다. 그래서 실패는 이슈 1건으로 남기고(제목 고정 ->
      #   매달 새 이슈가 쌓이지 않는다) 다음 복구일(8·15·22)에 decide 잡이 그 이슈를 보고
      #   자동 재시도한다. dispatch 실패는 이슈를 만들지 않는다(사람이 보고 있으므로) --
      #   grm-intake.yml 375~444행과 같은 관용구.
      - name: Open or update the monthly refresh failure issue
        # ★`cancelled()` 를 함께 본다 -- `timeout-minutes` 초과는 잡을 **취소**하므로
        #   `failure()` 만 걸면 하필 타임아웃(무인 월간 잡의 현실적 실패 형태)에서
        #   알림이 안 나간다. 조용한 실패를 만들지 않는다.
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const title = process.env.FAILURE_ISSUE_TITLE;
            const label = 'automation-failure';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`
                         + `/actions/runs/${process.env.GITHUB_RUN_ID}`;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            }
            await ensureLabel(label, 'd93f0b', 'GRM 자동화 스케줄 실행 실패');

            const body = [
              `FDA 실사등급(**public.fda_inspections**) 월간 자동 갱신이 실패했습니다.`,
              '',
              `- 실행: ${runUrl}`,
              '',
              '### 지금 상태',
              // ★★단정하지 않는다. 이 스텝은 exit 1(부분 성공)에서도 돈다 -- 실측:
              //   정규화 실패 1건이 섞이면 `upserted=5 / normalize_failed=1 / exit 1`,
              //   즉 **행이 실제로 적재된 채** 실패로 끝난다. 그때 "이번 달 신규 실사만
              //   못 받았습니다"라고 적으면 사람이 이슈만 보고 잘못 판단한다(#729 와 같은
              //   계열 -- 원문이 있는데 "확보하지 못해"를 발행한 사고). 표의 상태는
              //   추측하지 말고 리포트 숫자를 그대로 붙인다.
              '- 이 실행의 수집 리포트(적재 건수·오류)는 위 실행 페이지의 잡 요약에 그대로 실려 있습니다 — **먼저 그 숫자를 보십시오**(부분 적재로 끝났을 수 있습니다).',
              '- 표(`public.fda_inspections`)는 이 워크플로가 **삭제하지 않습니다**(upsert 전용). 이전 적재분은 그대로 남아 있습니다.',
              '- 트렌드 페이지의 FDA 실사 등급 섹션은 계속 표시됩니다. 059 적용 후에는 기준일 문구(`scope.last_ingested_date_kst`)가 멈춘 채로 남아 낡았다는 사실이 화면에도 드러납니다.',
              '',
              '### 자동 복구',
              '- 이 이슈가 열려 있는 동안 **매월 8·15·22일 15:47 UTC** 에 자동 재시도합니다(평상시엔 월 1회).',
              '- 성공하면 이 이슈는 자동으로 닫힙니다.',
              '',
              '### 손으로 확인할 때',
              '```bash',
              'python collect_fda_inspections.py --dry-run   # DDAPI 는 호출, 적재는 생략',
              '```',
              '자격증명(`FDA_API_USER`/`FDA_DDAPI_KEY`)·DDAPI 응답 형태·Supabase 적재 중 어디서 끊겼는지는 위 실행의 step summary 에 붙은 `backfill_report.json` 을 보세요.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `여전히 실패 중입니다 (${runUrl}).`,
              });
              core.notice(`기존 이슈 #${existing.number} 갱신`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
              core.notice(`이슈 #${created.number} 생성`);
            }

      # 복구 확인은 **실제 적재가 성공했을 때만** 한다 -- dry-run 성공으로 닫으면
      # "적재는 여전히 깨져 있는데 알림만 사라진" 상태가 된다.
      - name: Close the failure issue on a successful apply
        if: success() && steps.backfill.outputs.mode == 'apply'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const title = process.env.FAILURE_ISSUE_TITLE;
            const label = 'automation-failure';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`
                         + `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 100,
            });
            for (const issue of open.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ 복구 확인 — 적재가 성공해 자동으로 닫습니다. (${runUrl})`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
              core.notice(`이슈 #${issue.number} 자동 종료`);
            }
