name: GRM DB VACUUM FULL (manual, allow-list)

# [2026-11-20] DB 용량 확보 2단계 — 갱신이 잦아 부푼 표를 VACUUM FULL 로 압축(행은 지우지 않는다).
# 계획: _ops/reports/GRM_DB용량_확보방안_2026-11-20.md, _ops/reports/GRM_DB_2단계_findings_새벽실행안_2026-11-20.md
#
# 왜 워크플로인가: Supabase MCP execute_sql 은 모든 질의를 트랜잭션으로 감싸 VACUUM 이 거부된다.
# 접속은 grm-db-backup.yml 과 같은 방식(supabase link → 풀러 주소, 비밀번호는 같은 시크릿
# SUPABASE_DB_PASSWORD)이라 아무도 비밀값을 입력하지 않는다. 스케줄 없음 — 손으로만 실행한다.
#
# findings 는 사이트가 실시간으로 읽는다(ACCESS EXCLUSIVE). 새벽(KST 04:00 전후)에만 돌리고,
# 시작 전 DB 가 380,000,000 B 이상이면(재작성 중 ~100MB 늘어난다) findings 는 건너뛴다.

on:
  workflow_dispatch:
    inputs:
      tables:
        description: '쉼표로 구분한 표 이름(허용 목록만, 예: rpc_snapshot,findings_similar_cache). findings 는 항상 마지막으로 정렬된다.'
        type: string
        required: true
      dry_run:
        description: 'true 면 크기만 출력하고 VACUUM 은 하지 않는다.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: grm-db-vacuum
  cancel-in-progress: false

jobs:
  vacuum:
    name: 크기 기록 → VACUUM FULL(표별) → 크기 기록
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      IN_TABLES: ${{ inputs.tables }}
      IN_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate tables (allow-list)
        id: val
        shell: bash
        run: |
          set -euo pipefail
          # 허용 목록 = 2026-11-20 에 측정한 표. 실행 순서도 이 순서(작은 표 → findings 마지막).
          ALLOW=(rpc_snapshot findings_inspector_profile_cache findings_similar_cache findings_search_cache import_alert_listing fda_inspections deficiency_examples raw_signals finding_similar_text finding_similar findings)
          req="$(printf '%s' "${IN_TABLES:-}" | tr -d ' ')"
          if [ -z "$req" ]; then echo "::error::tables 가 비었다"; exit 1; fi
          IFS=',' read -r -a want <<< "$req"
          for t in "${want[@]}"; do
            ok=0
            for a in "${ALLOW[@]}"; do [ "$t" = "$a" ] && ok=1; done
            if [ "$ok" -ne 1 ]; then echo "::error::허용 목록에 없는 표: '$t'"; exit 1; fi
          done
          ordered=()
          for a in "${ALLOW[@]}"; do
            for t in "${want[@]}"; do
              if [ "$t" = "$a" ]; then ordered+=("$a"); break; fi
            done
          done
          echo "list=${ordered[*]}" >> "$GITHUB_OUTPUT"
          echo "대상(실행 순서): ${ordered[*]}"

      - name: Verify secrets and variables
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=("SUPABASE_DB_PASSWORD")
          [ -z "${SUPABASE_PROJECT_REF:-}" ] && missing+=("vars.SUPABASE_PROJECT_REF")
          if [ "${#missing[@]}" -gt 0 ]; then echo "::error::필요한 값 누락: ${missing[*]}"; exit 1; fi
          echo "::add-mask::${SUPABASE_DB_PASSWORD}"

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2

      - name: Link Supabase project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Vacuum
        shell: bash
        env:
          TABLE_LIST: ${{ steps.val.outputs.list }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          URL_FILE=supabase/.temp/pooler-url
          test -s "$URL_FILE" || { echo "::error::풀러 주소 파일 없음(supabase link 실패?)"; exit 1; }
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          q() { psql -X -v ON_ERROR_STOP=1 -tA "$(cat "$URL_FILE")" -c "$1"; }
          dbsize() { q "select pg_database_size(current_database())"; }
          relsize() { q "select pg_total_relation_size('public.$1')"; }
          DRY="${IN_DRY_RUN:-true}"
          LIMIT_BYTES=380000000
          DB0="$(dbsize)"
          {
            echo "### GRM DB VACUUM FULL ($([ "$DRY" = true ] && echo 'dry-run' || echo 'apply'))"
            echo ""
            echo "| 표 | 전(B) | 후(B) | 회수(B) | 결과 |"
            echo "|---|---:|---:|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for t in $TABLE_LIST; do
            before="$(relsize "$t")"
            echo "[$t] 전 ${before} B, DB $(dbsize) B"
            if [ "$DRY" = true ]; then
              echo "| $t | $before | - | - | dry-run |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$t" = findings ] && [ "$(dbsize)" -ge "$LIMIT_BYTES" ]; then
              echo "::warning::DB 가 ${LIMIT_BYTES} B 이상이라 findings 를 건너뛴다"
              echo "| $t | $before | - | - | 건너뜀(DB 크기 가드) |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            start=$(date +%s)
            if psql -X -v ON_ERROR_STOP=1 "$(cat "$URL_FILE")" \
                 -c "set lock_timeout='5s'" -c "set statement_timeout='300s'" -c "vacuum full public.${t}"; then
              res="완료 $(( $(date +%s) - start ))초"
            else
              res="실패(잠금·시간 초과 등, 원 표는 그대로)"
              fail=1
            fi
            after="$(relsize "$t")"
            echo "[$t] 후 ${after} B, DB $(dbsize) B — $res"
            echo "| $t | $before | $after | $((before - after)) | $res |" >> "$GITHUB_STEP_SUMMARY"
          done
          DB1="$(dbsize)"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "DB 전체: ${DB0} → ${DB1} B (한도 판단 기준 500,000,000 B)" >> "$GITHUB_STEP_SUMMARY"
          echo "DB 전체: ${DB0} → ${DB1} B"
          exit "$fail"
