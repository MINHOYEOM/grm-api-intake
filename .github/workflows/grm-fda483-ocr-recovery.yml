name: GRM FDA 483 OCR Recovery

# ★[2026-10-28] FDA Warning Letter 본문 회수(`recover-wl` 잡)도 이 워크플로가 함께 돈다.
# WL 편지 GET 이 403·5xx·타임아웃이면 행이 본문 없이 적재되고(`wl_body_status`), 이후 수집은
# 같은 document_id 를 다시 받지 않아 영구 결손이었다. 수집기의 즉시 재시도가 일시 장애를
# 대부분 넘기고, 남은 것(403 차단·재시도 초과)을 다음 날 다른 러너에서 이 잡이 되찾는다.
# 같은 fda.gov 호스트를 두드리므로 483 잡 **뒤에** 직렬로 돈다(`needs` + always()).

# ★예약 실행(2026-10-27 #1209): 매일 `recoverable` 모드로 apply 한다(상한 표식 + 엔진 부재 +
# 일시 fetch 실패 — 2026-10-27 FDA 결손 감사로 collection-capped 에서 확장). 일일 수집은 실행당
# PDF 건수 상한·OCR 페이지 예산으로 벽시계를 닫고, 상한 밖 문서를 `not-attempted` /
# `scan-ocr-budget` 으로 **본문 없이** 적재한다. 이후 수집은 이미 저장된 document_id 를 다시
# 받지 않으므로 그 문서들은 영구히 findings 0건이었다(10-26 FDA 대량 공개 때 51건). 이 예약이
# 다음 날 그 행들을 다시 읽어 제자리 교체한다. dispatch(아래 입력)는 종전 그대로 1회성 복구용.

# OCR 엔진 부재로 **빈 본문 적재된** 스캔 483 을 소급 복구한다(2026-07-30 진단 · PR #487).
# 대상은 `raw_signals` 중 source='FDA 483' 이고 `raw_json.fda483_text_status` 가
# `scan-ocr-unavailable:…` 인 행 — grm-findings-backfill-fetch 가 tesseract 없이 돌던
# 07-27~07-29 사이에 들어온 분이다. append-only + document_id dedup 이라 재수집 기회가
# 없어 영구히 빈손이므로, 이 워크플로가 원문을 다시 읽어 행을 제자리 교체한다.
#
# ★grm-fda483-ocr-backfill.yml 과 다른 워크플로다. 그쪽은 **발행본 브리프** 기준으로 deep
# 델타 패치 **아티팩트**를 만들 뿐 raw_signals 를 갱신하지 않는다. 이번 대상은 브리프에
# 발행된 적 없는 백필 행이라 그 경로로는 닿지 않는다.
#
# 재사용 배관: backfill_483_ocr_recovery.py 가 collect_fda_483 의 라이브 함수
# (_fetch_fda483_pdf_text / _extract_fda483_excerpt / _extract_483_observations_from_text /
# _to_item)와 findings_store.raw_signal_from_intake_item 을 그대로 호출해 행을 재구성한다 —
# 신규 파싱·해시 로직 없음. raw_signal_id 가 document_id 에만 의존하므로 DELETE 없이
# upsert(merge-duplicates) 한 번으로 교체된다(findings CASCADE 위험 없음). git 쓰기 전무.
#
# concurrency: 기존 FDA 483 백필들과 같은 그룹 — 같은 fda.gov 호스트를 두드리므로 직렬화한다.
#
# dry-run(기본)은 PDF fetch + 행 재구성까지 수행하고 **쓰기만** 건너뛴다. 무엇이 몇 건
# 복구되는지(관찰 수 포함) 먼저 확인한 뒤 apply=true 로 재실행한다.
# 멱등: 복구에 성공한 행은 fda483_text_status 가 사라져 다음 실행의 후보에서 자연히 빠진다.

on:
  # 일일 수집(grm-intake, 18:17 UTC 예약 · 실측 시작 21~22시 UTC)이 끝난 뒤, 백로그 모니터
  # (00:13 UTC) 전에 돌도록 둔다.
  schedule:
    - cron: '37 23 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = 실제 raw_signals upsert + findings 재생성. false(기본) = dry-run(fetch·재구성까지 하되 쓰기 없음) — 먼저 이걸로 복구 규모를 확인한다.'
        type: boolean
        default: false
      limit:
        description: '이번 실행에서 처리할 문서 수 상한(배치 분할용). 비우거나 0 이면 전건(형제 백필과 동일 규약).'
        type: string
        default: ''
      delay_seconds:
        description: 'PDF 요청 간 대기(초) — fda.gov 예의.'
        type: string
        default: '0.5'
      doc_ids:
        description: '선택: 처리할 raw_signal_id 또는 document_id 목록(공백/쉼표 구분). 비우면 대상 전건. collection-capped·recoverable 모드에서 지목하면 out-of-scope 표식 행도 다시 읽는다(게이트 수정 후 오판 표식 재회수).'
        type: string
        default: ''
      ocr_page_budget:
        description: 'OCR 페이지 예산(실행 1회당, 예약 실행은 600). 기본 200 은 **일일 수집**의 벽시계 보호용이라, 1회성 회수에서는 스캔본 ~20건에서 소진되고 나머지는 다음 실행으로 밀린다(실측: 429건 중 42건이 scan-ocr-budget). 배치를 키우려면 올린다 — 300dpi 페이지당 수 초라 워크플로 타임아웃(120분)을 넘지 않게.'
        type: string
        default: '200'
      ocr_dpi:
        description: '페이지 렌더 DPI(기본 300). 잔여 대상의 원본 스캔이 대부분 ~163dpi 라, 렌더를 키워 글리프를 크게 하면 tesseract 인식률이 오르는 경우가 있다. 400~500 시험용. ★업스케일은 정보를 늘리지 않으므로 무한정 올려도 소용없다(상한 600).'
        type: string
        default: '300'
      mode:
        description: '후보 선정 기준. ocr-unavailable(기본)=엔진 부재로 본문을 못 받은 행. missing-observations=관찰 키가 없는 행 — 상태 키가 없어 지금까지 어떤 복구 잡에도 안 걸리던 사각지대(2026-08-01 실측 417건). ★이 모드는 멱등이 아니다: 본문은 있는데 파서가 여전히 0건인 문서는 다음 실행에서도 후보로 남아 PDF 를 다시 읽는다. collection-capped=수집 상한(PDF 건수·OCR 예산)으로 본문 없이 적재된 행(not-attempted·scan-ocr-budget). recoverable=collection-capped + 엔진 부재(scan-ocr-unavailable) + 일시 fetch 실패(404 제외) — 다시 읽으면 본문이 나올 수 있는 결손 전부. 예약 실행·발행 전 게이트(grm-fda-coverage-gate)가 쓰는 모드.'
        type: choice
        options:
          - ocr-unavailable
          - missing-observations
          - collection-capped
          - recoverable
        default: ocr-unavailable
      target:
        description: '무엇을 회수하나. fda483(기본·종전 동작) = 483 본문 회수만. wl = FDA Warning Letter 본문 회수만(OCR 무관 — apply·limit·delay_seconds·doc_ids 입력을 공유). all = 둘 다. 예약 실행은 늘 all.'
        type: choice
        options:
          - fda483
          - wl
          - all
        default: fda483

permissions:
  contents: read
  issues: write   # 예약 실행 실패 경보(automation-warning)

concurrency:
  group: fda483-ocr-backfill      # 기존 483 백필들과 동일 그룹(fda.gov 동시 요청 방지)
  cancel-in-progress: false

jobs:
  recover:
    name: 스캔 483 본문 복구 → raw_signals upsert → findings 재생성
    if: ${{ github.event_name == 'schedule' || inputs.target != 'wl' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # OCR 엔진 — 이 워크플로는 **OCR 실패를 되돌리러** 왔으므로 엔진이 없으면 존재
      # 의미가 없다(전건이 still_empty 로 끝나고 fda.gov 만 두드린다). required=true.
      - name: Install OCR engine (tesseract)
        uses: ./.github/actions/setup-ocr
        with:
          required: 'true'

      # dispatch 입력은 **env 로만** 받는다 — 셸 본문 직접 삽입 금지(저장소 관례).
      # 예약 실행에는 inputs 가 비어 있으므로 여기서 예약용 값을 정한다(apply·collection-capped·
      # OCR 600쪽 ≈ 22분 — 타임아웃 120분 안). 상한 결손은 하루 수십 건 규모라 limit 은 두지 않는다.
      - name: Run FDA 483 OCR recovery
        id: recover
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_DELAY: ${{ inputs.delay_seconds || '0.5' }}
          IN_DOC_IDS: ${{ inputs.doc_ids }}
          IN_MODE: ${{ github.event_name == 'schedule' && 'recoverable' || inputs.mode }}
          FDA483_OCR_PAGE_BUDGET: ${{ github.event_name == 'schedule' && '600' || inputs.ocr_page_budget }}
          FDA483_OCR_DPI: ${{ inputs.ocr_dpi || '300' }}
        run: |
          set -euo pipefail
          ARGS=(--report-path ocr_recovery_report.json --delay-seconds "${IN_DELAY}" --mode "${IN_MODE}")
          if [ "${IN_APPLY}" = "true" ]; then
            ARGS+=(--apply)
          fi
          if [ -n "${IN_LIMIT}" ]; then
            ARGS+=(--limit "${IN_LIMIT}")
          fi
          if [ -n "${IN_DOC_IDS}" ]; then
            ARGS+=(--doc-ids "${IN_DOC_IDS}")
          fi
          python backfill_483_ocr_recovery.py "${ARGS[@]}"
          RECOVERED=$(python -c "import json; print(json.load(open('ocr_recovery_report.json'))['recovered'])")
          echo "recovered=${RECOVERED}" >> "$GITHUB_OUTPUT"

      # 복구로 observations 가 채워진 raw_signals 를 findings 로 변환한다. M12 는 "findings
      # 없는 raw_signal" 만 처리하므로 이번에 살아난 행이 그대로 대상이 된다 —
      # grm-findings-backfill-fetch.yml 이 쓰는 체인과 동일 배관(신규 로직 없음).
      - name: Chain M12 findings backfill (raw -> findings)
        if: ${{ (github.event_name == 'schedule' || inputs.apply) && steps.recover.outputs.recovered != '0' && steps.recover.outputs.recovered != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python findings_supabase_backfill.py | tee m12_report.json

      # [#1209] 주간 브리프는 Notion 의 미소비(New) 행에서 만들어진다. 위 회수는 Supabase 만
      # 고치므로, 본문 없이 들어간 Notion 483 행의 raw 를 Supabase 의 본문 있는 raw 로 채운다
      # (백필 페치가 먼저 받아 둔 문서 포함 — recovered=0 이어도 돌린다). 속성·Status 는 무접촉.
      - name: Sync empty Notion 483 rows from Supabase (weekly brief input)
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python fda483_notion_raw_sync.py --apply --report-path notion_sync_report.json

      - name: Write step summary
        if: always()
        env:
          IN_EVENT: ${{ github.event_name }}
          IN_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_DELAY: ${{ inputs.delay_seconds || '0.5' }}
          IN_DOC_IDS: ${{ inputs.doc_ids }}
          IN_MODE: ${{ github.event_name == 'schedule' && 'recoverable' || inputs.mode }}
          IN_OCR_BUDGET: ${{ github.event_name == 'schedule' && '600' || inputs.ocr_page_budget }}
          IN_OCR_DPI: ${{ inputs.ocr_dpi || '300' }}
        run: |
          {
            echo "### GRM FDA 483 OCR Recovery (\`${IN_EVENT}\`)"
            echo ""
            echo "apply: \`${IN_APPLY}\` / mode: \`${IN_MODE}\` / ocr_budget: \`${IN_OCR_BUDGET}\` / ocr_dpi: \`${IN_OCR_DPI}\` / limit: \`${IN_LIMIT}\` / delay_seconds: \`${IN_DELAY}\` / doc_ids: \`${IN_DOC_IDS}\`"
            echo ""
            if [ -f ocr_recovery_report.json ]; then
              echo "#### 복구 리포트 (backfill_483_ocr_recovery.py)"
              echo '```json'
              cat ocr_recovery_report.json
              echo '```'
            else
              echo "ocr_recovery_report.json 미생성 — 인자/인증/조회 실패로 조기 종료 가능"
              echo "(SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY 확인)."
            fi
            echo ""
            if [ -f m12_report.json ]; then
              echo "#### M12 findings 재생성 리포트"
              echo '```json'
              cat m12_report.json
              echo '```'
            else
              echo "(M12 체인 미실행 — dry-run 이거나 recovered=0)"
            fi
            echo ""
            if [ -f notion_sync_report.json ]; then
              echo "#### Notion 483 raw 동기화 리포트 (fda483_notion_raw_sync.py)"
              echo '```json'
              cat notion_sync_report.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fda483-ocr-recovery-report
          path: |
            ocr_recovery_report.json
            m12_report.json
            notion_sync_report.json
          retention-days: 30
          if-no-files-found: warn

      # [2026-10-27 FDA 결손 감사] 예약 회수가 실패하면 종전엔 Actions 실패 표시뿐이었다 —
      # 이 잡이 죽으면 그날 상한 밖 483 이 다음 회수까지 본문 없이 남는다. 운영 경고 채널
      # (automation-warning → Admin 운영 상태 센터)로 올린다. 성공하면 열린 이슈를 닫는다.
      - name: 예약 실행 실패 경보 / 해소
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'GRM FDA 483 예약 회수 실패';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'grm-fda-coverage', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (process.env.JOB_STATUS === 'success') {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `✅ 예약 회수가 다시 성공했습니다. 이슈를 닫습니다.\n\n${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }
            for (const [name, color, description] of [
              ['automation-warning', 'fbca04', 'GRM automation warning'],
              ['grm-fda-coverage', 'b60205', 'GRM pre-publish FDA body coverage gate']]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            const kstDate = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
            const body = [
              '매일 23:37 UTC 예약 회수(본문 없이 적재된 FDA 483 → Supabase·Notion)가 실패했습니다. 다음 성공까지 상한 밖 483 이 본문 없이 남고, 월요일 handoff 전이면 그 주 브리프에 묶음 카드로 실립니다.',
              '',
              `- 최신 Run: ${runUrl}`,
              `- 최신 Run date (KST): ${kstDate}`,
              '',
              '현재 경고:',
              `- [fda483-recovery-failed] 예약 회수 실패(job status: ${process.env.JOB_STATUS}) — 리포트 아티팩트·로그 확인`,
              '',
              '수동 재실행: `gh workflow run grm-fda483-ocr-recovery.yml -f apply=true -f mode=recoverable`',
            ].join('\n');
            if (!existing) {
              await github.rest.issues.create({ owner, repo, title, body,
                labels: ['automation-warning', 'grm-fda-coverage'], assignees: [owner] });
            } else {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: `⚠️ 예약 회수 다시 실패 — ${runUrl}` });
            }

  # ── FDA Warning Letter 본문 회수 ─────────────────────────────────────────────────────
  # backfill_wl_body_recovery.py 가 raw_signals(source='FDA Warning Letter') 중 `wl_body_full`
  # 이 없고 확정 사유(404·no-anchor)가 아닌 행을 다시 받아, 라이브 수집과 같은 함수
  # (collect_intake.build_wl_item → findings_store.raw_signal_from_intake_item)로 행을 재구성해
  # 제자리 upsert 한다. 이어서 M12(findings 0건인 행 → findings) · 미소비 Notion WL 행 raw 동기화.
  recover-wl:
    name: FDA WL 본문 회수 → raw_signals upsert → findings 재생성 → Notion New 행 동기화
    needs: recover
    if: ${{ always() && (github.event_name == 'schedule' || inputs.target == 'wl' || inputs.target == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # dispatch 입력은 env 로만 받는다(셸 본문 직접 삽입 금지). 대상은 하루 한 줌이라 limit 없음.
      - name: Run FDA WL body recovery
        id: recover
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_DELAY: ${{ inputs.delay_seconds }}
          IN_DOC_IDS: ${{ inputs.doc_ids }}
        run: |
          set -euo pipefail
          ARGS=(--report-path wl_recovery_report.json)
          if [ "${IN_APPLY}" = "true" ]; then
            ARGS+=(--apply)
          fi
          if [ -n "${IN_LIMIT}" ]; then
            ARGS+=(--limit "${IN_LIMIT}")
          fi
          # 483 용 기본 0.5초는 WL 에 쓰지 않는다 — 비우면 스크립트 기본(5초).
          if [ -n "${IN_DELAY}" ] && [ "${IN_DELAY}" != "0.5" ]; then
            ARGS+=(--delay-seconds "${IN_DELAY}")
          fi
          if [ -n "${IN_DOC_IDS}" ]; then
            ARGS+=(--doc-ids "${IN_DOC_IDS}")
          fi
          python backfill_wl_body_recovery.py "${ARGS[@]}"
          RECOVERED=$(python -c "import json; print(json.load(open('wl_recovery_report.json'))['recovered'])")
          echo "recovered=${RECOVERED}" >> "$GITHUB_OUTPUT"

      - name: Chain M12 findings backfill (raw -> findings)
        if: ${{ (github.event_name == 'schedule' || inputs.apply) && steps.recover.outputs.recovered != '0' && steps.recover.outputs.recovered != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python findings_supabase_backfill.py | tee wl_m12_report.json

      - name: Sync Notion WL rows without full body from Supabase (weekly brief input)
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python fda483_notion_raw_sync.py --source wl --apply --report-path wl_notion_sync_report.json

      - name: Write step summary
        if: always()
        env:
          IN_EVENT: ${{ github.event_name }}
          IN_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          {
            echo "### GRM FDA WL 본문 회수 (\`${IN_EVENT}\`, apply: \`${IN_APPLY}\`)"
            for f in wl_recovery_report.json wl_m12_report.json wl_notion_sync_report.json; do
              if [ -f "$f" ]; then
                echo ""
                echo "#### ${f}"
                echo '```json'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fda-wl-body-recovery-report
          path: |
            wl_recovery_report.json
            wl_m12_report.json
            wl_notion_sync_report.json
          retention-days: 30
          if-no-files-found: warn

      # 예약 회수가 실패하면 그날 본문 없는 WL 이 다음 회수까지 남는다 — 483 잡과 별도 이슈로
      # 운영 경고 채널(automation-warning → Admin 운영 상태 센터)에 올리고, 성공하면 닫는다.
      - name: 예약 실행 실패 경보 / 해소
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'GRM FDA WL 본문 예약 회수 실패';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'grm-fda-coverage', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (process.env.JOB_STATUS === 'success') {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `✅ WL 예약 회수가 다시 성공했습니다. 이슈를 닫습니다.\n\n${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }
            for (const [name, color, description] of [
              ['automation-warning', 'fbca04', 'GRM automation warning'],
              ['grm-fda-coverage', 'b60205', 'GRM pre-publish FDA body coverage gate']]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            const kstDate = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
            const body = [
              '매일 예약 WL 본문 회수(본문 없이 적재된 FDA Warning Letter → Supabase·Notion)가 실패했습니다. 다음 성공까지 그 편지들은 본문(심층분석 입력·위반 표제) 없이 남습니다. 회수 대상의 절반 이상이 403·5xx 로 다시 실패해도 이 경보가 납니다(러너 차단 의심).',
              '',
              `- 최신 Run: ${runUrl}`,
              `- 최신 Run date (KST): ${kstDate}`,
              '',
              '현재 경고:',
              `- [wl-body-recovery-failed] WL 예약 회수 실패(job status: ${process.env.JOB_STATUS}) — 리포트 아티팩트(fda-wl-body-recovery-report)·로그 확인`,
              '',
              '수동 재실행: `gh workflow run grm-fda483-ocr-recovery.yml -f target=wl -f apply=true`',
            ].join('\n');
            if (!existing) {
              await github.rest.issues.create({ owner, repo, title, body,
                labels: ['automation-warning', 'grm-fda-coverage'], assignees: [owner] });
            } else {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: `⚠️ WL 예약 회수 다시 실패 — ${runUrl}` });
            }
