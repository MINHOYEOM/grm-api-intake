name: GRM Findings Reclassify (taxonomy)

# grm-finding-taxonomy findings 재분류 -- workflow_dispatch 전용, cron 없음. 버전 무관
# 재사용(v3 도입 시 최초 작성, v4 도입 시 코드 변경 없이 그대로 재사용 -- 아래 스크립트가
# 항상 grm_findings.py 의 "현재" classify_finding_category/TAXONOMY_VERSION 을 참조한다).
# findings_reclassify_service.py 가 PostgREST 로 findings 전량을 페이지네이션 GET 한 뒤
# 순수 결정론 Python(classify_finding_category, LLM 0)을 각 행의 finding_text 에 재실행해
# category_code 가 달라지거나 taxonomy_version 이 아직 최신이 아닌 행만 PATCH 한다.
# finding_text/finding_text_ko/scope_status 는 절대 건드리지 않는다(스크립트 docstring
# 계약 참조).
#
# ★핵심 제약: 이 워크플로는 git 쓰기를 전혀 하지 않는다 -- checkout(read-only) 이후
# 커밋/푸시/PR 생성 스텝이 없다. dry_run 기본값 true -- 실제 PATCH 는 사람이 dispatch
# 입력을 false 로 명시할 때만 실행된다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true=변경 예정 건수/카테고리 이동 매트릭스만 출력(PATCH 없음), false=실제 PATCH 적용"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      limit:
        description: "PATCH 를 적용할 최대 건수(비우면 전체). dry_run=false 일 때만 의미 있음."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: findings-reclassify
  cancel-in-progress: false

jobs:
  reclassify:
    name: Reclassify findings.category_code under current taxonomy
    runs-on: ubuntu-latest
    # ★[2026-08-27] 45 -> 180. v10 적용에서 실제로 timeout 에 걸려 **40%(10,732/26,581)만
    # 적용된 채 잘렸다.** 이 상한은 코퍼스가 작을 때 정해진 값이고 findings 는 계속 자란다.
    #   · PATCH 는 행마다 왕복 1회라 네트워크 바운드다 — 실측 약 250행/분.
    #   · 버전을 올리는 실행은 카테고리가 안 바뀌는 행까지 **전건**을 찍는다(provenance).
    #     26,581행 = 약 106분. 45분으로는 구조적으로 못 끝낸다.
    # 잘려도 데이터는 깨지지 않는다(행 단위 멱등 + race-safe 필터) — 다시 돌리면 남은 것만
    # 집는다. 그래도 "성공처럼 보이는 부분 적용"은 다음 사람이 못 알아채므로 상한을 올린다.
    # 180분은 현재 크기의 약 1.7배까지 여유가 있다. 더 커지면 `limit` 입력으로 나눠 돌린다.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 읽기(findings 전량 GET) + PATCH(category_code/category_label_ko/taxonomy_version
      # 만) -- git add/commit/push 없음. SUPABASE_SERVICE_ROLE_KEY 는 grm-intake.yml(M4
      # 야간 적재)·grm-findings-translate-apply.yml(M9b) 이 이미 쓰는 동일 secret 재사용이며,
      # 이 워크플로를 위한 신규 secret 등록은 필요 없다.
      - name: Reclassify findings (no git writes — read + category PATCH only)
        id: reclassify
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--output reclassify_report.json"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          python findings_reclassify_service.py $ARGS

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### GRM Findings Reclassify (taxonomy)"
            echo ""
            echo "dry_run=${{ inputs.dry_run }} limit=${{ inputs.limit }}"
            echo ""
            if [ -f reclassify_report.json ]; then
              echo '```json'
              cat reclassify_report.json
              echo '```'
            else
              echo "reclassify_report.json 이 생성되지 않았습니다 (스크립트가 exit 2 로 조기 종료했을 수 있습니다 — SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY 확인)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
