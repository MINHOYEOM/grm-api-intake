{% extends "base.html" %}
{% block content %}
{#- 자료실 허브(트랙 C) — 참조형 카탈로그(ICH·MFDS)로 가는 정적 진입 페이지.
    브리프/findings 와 달리 라이브 데이터가 아니라 커밋 스냅샷을 결정론 렌더한다.
    grm.css 프리즈 보존을 위해 레이아웃은 기존 토큰만 쓰는 스코프 <style>(base 선례). -#}
<main>
  <div class="wrap page-head">
    <span class="kick reveal" style="animation-delay:.02s">Reference Library</span>
    <h1 class="reveal" style="animation-delay:.08s">{{ _('자료실') }}</h1>
    <p class="reveal" style="animation-delay:.14s">{{ _('규제 실무에서 자주 되짚는 참조 문서를 한곳에 모았습니다. 매주 흘러가는 브리프와 달리, 필요할 때 언제든 다시 찾아볼 수 있도록 카탈로그 형태로 정리하고 공식 원문 링크를 함께 제공합니다.') }}</p>
  </div>
  <div class="wrap">
    {#- 최근 업데이트(2026-07-25) — 주간 자동 갱신이 무엇을 바꿨는지. 뷰모델은
        render.load_library_updates()["latest"]: 이력 파일은 id 만 갖고 제목·링크는
        렌더 시점에 라이브 카탈로그에서 join 된다. 변경이 없으면 lib_update 가 None →
        "최근 변경 없음"으로 정직하게 표시한다(가짜 항목을 만들지 않는다).
        ⚠️ Jinja 에서 s.items 는 dict 의 메서드로 잡힌다 — 반드시 s['items']. -#}
    <section class="lib-upd reveal" aria-label="{{ _('자료실 최근 업데이트') }}">
      <div class="lib-upd-h">
        <span class="lib-upd-k"><i class="ti ti-refresh" aria-hidden="true"></i>{{ _('최근 업데이트') }}</span>
        {% if lib_update %}
        <span class="lib-upd-sum">{{ _("<b>{date}</b> · 자료 {n}건 반영", date=lib_update.date, n=lib_update.change_count) }}</span>
        {% else %}
        <span class="lib-upd-sum">{{ _('최근 변경 없음') }}</span>
        {% endif %}
      </div>
      {% if lib_update %}
      <div class="lib-upd-b">
        {% for s in lib_update.sources %}
        <div class="lib-upd-cat">
          <div class="lib-upd-cat-h">
            <a class="lib-upd-tag" href="{{ rel_root }}library/{{ s.slug }}/index.html">{{ s.short }}</a>
            <span class="lib-upd-n">{% if s.new_count %}{{ _("신규 {n}건", n=s.new_count) }}{% endif %}{% if s.new_count and s.changed_count %} · {% endif %}{% if s.changed_count %}{{ _("변경 {n}건", n=s.changed_count) }}{% endif %}{% if s.removed_count %} · {{ _("내림 {n}건", n=s.removed_count) }}{% endif %}</span>
          </div>
          <ul class="lib-upd-l">
            {% for it in s['items'] %}
{# i18n-ignore #}            <li><a href="{{ it.url }}" target="_blank" rel="noopener"><span class="lib-upd-st{% if it.state == '신규' %} is-new{% endif %}">{{ _(it.state) }}</span><span class="lib-upd-t">{{ it.title }}</span><i class="ti ti-external-link" aria-hidden="true"></i></a></li>
            {% endfor %}
            {% if s.hidden_count %}<li class="lib-upd-more"><a href="{{ rel_root }}library/{{ s.slug }}/index.html">{{ _("외 {n}건 — {short} 카탈로그에서 보기", n=s.hidden_count, short=s.short) }}</a></li>{% endif %}
          </ul>
        </div>
        {% endfor %}
      </div>
      {% endif %}
{% if lib_update.ko_only_titles %}
      {#- 한국어 원제는 그대로 싣고 **이유를 밝힌다** — 옮기면 존재하지 않는 문서를
          가리키게 된다(용어사전 출처·카탈로그 페이지와 같은 판단). -#}
      <p class="lib-upd-note">{{ _("이 목록의 {n}건은 공식 영문 제목이 없어 한국어 원제를 그대로 표시합니다.", n=lib_update.ko_only_titles) }}</p>
{% endif %}
      <p class="lib-upd-f">{{ _('규제기관·전문기관 공개 자료를 <b>매주 월요일</b> 자동으로 확인해 반영합니다 — 한 번에 크게 바뀌거나 사라지면 사람이 먼저 확인합니다.') }}</p>
    </section>
    <div class="lib-cats">
      {% for c in catalogs %}
      <a class="lib-cat reveal" style="animation-delay:{{ '%.2f'|format(0.2 + loop.index0 * 0.06) }}s" href="{{ rel_root }}library/{{ c.href }}">
        <div class="lib-cat-h">
          <h2>{{ c.title }}</h2>
          <span class="lib-cat-n">{{ c.count }}<span class="u">{{ c.unit }}</span></span>
        </div>
        <p>{{ c.blurb }}</p>
        <div class="lib-cat-f">
          {% if c.latest_published %}<span class="lib-asof">{{ _("최근 발행 {date}", date=c.latest_published) }}</span>{% else %}<span class="lib-asof"></span>{% endif %}
          <span class="lib-go">{{ _('바로가기') }} <i class="ti ti-arrow-right" aria-hidden="true"></i></span>
        </div>
      </a>
      {% endfor %}
    </div>
    <aside class="lib-x reveal">
      <div class="lib-x-t">
        <b>{{ _('규제 용어사전') }}</b>
        <span>{{ _('GMP·CAPA·데이터 완전성·무균 공정·ICH 등 자주 나오는 용어를 쉬운 풀이와 공식 출처로 설명합니다.') }}</span>
      </div>
{# [다국어 3단계] 용어사전은 풀이(easy_ko·detail_ko)가 한국어라 영어판에 없다.
   들여쓰기는 조건 안에 둔다(참일 때 원래 바이트 보존 · 거짓일 때 빈 줄 0). #}
{% if lang == 'ko' or 'glossary/' in en_paths %}      <a class="lib-x-go" href="{{ rel_root }}glossary/index.html">{{ _('용어사전 열기') }} <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
{% endif %}
    </aside>
  </div>
</main>
<style>
/* [자료실] 허브 — grm.css 토큰만 사용(프리즈 보존). 카탈로그 카드 그리드.
   폭 기준(2026-07-18): 인트로·본문·리스트는 표준 wrap 전폭 — 좁은 max-width 캡 금지·한글 keep-all. */
.page-head p{max-width:none;word-break:keep-all}  /* 공용 62ch 캡 해제 — 표준 wrap 전폭 */
/* 최근 업데이트 패널 — 카탈로그 그리드 위 얇은 알림대. 색은 기존 토큰만. */
.lib-upd{margin:24px 0 0;padding:15px 20px 13px;background:var(--soft);border:1px solid var(--line-2);border-radius:var(--rad)}
.lib-upd-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lib-upd-k{display:inline-flex;align-items:center;gap:7px;font-family:var(--serif);font-weight:600;font-size:16px;color:var(--ink)}
.lib-upd-k .ti{font-size:16px;color:var(--coral-2)}
.lib-upd-sum{font-family:var(--sans);font-size:13px;color:var(--muted)}
.lib-upd-sum b{font-weight:600;color:var(--ink)}
.lib-upd-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 26px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.lib-upd-cat{min-width:0;padding:5px 0}
.lib-upd-cat-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lib-upd-tag{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--coral-2);background:var(--coral-tint);border:1px solid rgba(194,96,63,.22);border-radius:999px;padding:2px 10px;text-decoration:none;white-space:nowrap}
.lib-upd-tag:hover{border-color:var(--coral)}
.lib-upd-n{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.lib-upd-l{list-style:none;padding:0;margin:6px 0 0}
.lib-upd-l li{padding:2px 0}
.lib-upd-l a{display:inline-flex;align-items:baseline;gap:7px;font-family:var(--sans);font-size:14px;line-height:1.55;color:var(--body);text-decoration:none;word-break:keep-all;overflow-wrap:anywhere}
.lib-upd-l a:hover{color:var(--coral-2)}
.lib-upd-st{flex:none;font-size:11px;font-weight:600;color:var(--muted);background:var(--strong);border-radius:5px;padding:2px 7px;align-self:center}
.lib-upd-st.is-new{color:#fff;background:var(--coral)}
.lib-upd-l .ti{flex:none;font-size:12.5px;color:var(--lo);align-self:center;opacity:0;transition:opacity .14s var(--ease)}
.lib-upd-l a:hover .ti{opacity:1}
.lib-upd-more a{font-size:13px;color:var(--muted)}
.lib-upd-f{font-family:var(--sans);font-size:12.5px;color:var(--lo);line-height:1.6;margin:11px 0 0;padding-top:10px;border-top:1px solid var(--line);word-break:keep-all}
.lib-upd-f b{font-weight:600;color:var(--muted)}
.lib-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding:24px 0 60px}
.lib-cat{display:flex;flex-direction:column;gap:12px;padding:26px 24px;background:var(--canvas);border:1px solid var(--line-2);border-radius:var(--rad);text-decoration:none;color:var(--ink);transition:border-color .16s var(--ease),transform .16s var(--ease),box-shadow .16s var(--ease)}
.lib-cat:hover{border-color:var(--coral);transform:translateY(-2px);box-shadow:var(--shadow)}
.lib-cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lib-cat-h h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.2;color:var(--ink);margin:0}
.lib-cat-n{flex:none;font-family:var(--serif);font-size:28px;font-weight:600;color:var(--coral-2);line-height:1}
.lib-cat-n .u{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.lib-cat p{color:var(--body);font-size:15px;line-height:1.62;margin:0;flex:1;word-break:keep-all}
.lib-cat-f{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px;padding-top:14px;border-top:1px solid var(--line)}
.lib-asof{font-family:var(--sans);font-size:12px;color:var(--lo)}  /* 한글 라벨("최근 발행") — §4 한글안전: mono 금지·자간 0 */
.lib-go{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--coral-2)}
.lib-go .ti{font-size:15px;transition:transform .16s var(--ease)}
.lib-cat:hover .lib-go .ti{transform:translateX(3px)}
.lib-x{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 60px;padding:20px 22px;background:var(--soft);border:1px solid var(--line-2);border-radius:var(--rad)}
.lib-x-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.lib-x-t b{font-family:var(--serif);font-weight:600;font-size:16px;color:var(--ink)}
.lib-x-t span{font-size:13.5px;color:var(--muted);line-height:1.55}
.lib-x-go{flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:14px;font-weight:500;color:#fff;background:var(--coral);border-radius:var(--rad-s);padding:10px 16px;text-decoration:none;transition:background .16s var(--ease)}
.lib-x-go:hover{background:var(--coral-2)}
.lib-x-go .ti{font-size:16px;transition:transform .16s var(--ease)}
.lib-x-go:hover .ti{transform:translateX(3px)}
@media (max-width:640px){ .lib-cats{padding:18px 0 44px} .lib-cat{padding:22px 20px} }
</style>
{% endblock %}
