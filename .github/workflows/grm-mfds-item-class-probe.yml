name: GRM MFDS 품목구분 프로브 (읽기 전용)

# MFDS 의약품 제품 허가정보 API 가 **품목구분**(생물의약품/첨단바이오/…)을 내주는지
# 실제로 호출해 확인한다. 2026-09-21 제품군 분류기 수리 이후 국내 카드의 제품군을
# 되살릴 유일한 고품질 경로가 이 필드이고, 스펙 문서로는 확인이 안 됐다.
#
# ★읽기 전용 — 저장소·DB 에 아무것도 쓰지 않는다. 판정만 로그로 남긴다.
# ★서비스키는 기존 MFDS 수집기와 같은 것을 재사용한다(신규 등록 불필요).
#
# 판정 후에는 이 워크플로를 지운다(1회성 조사).

on:
  workflow_dispatch:
    inputs:
      item_seq:
        description: '조회할 품목기준코드(쉼표 구분). 비우면 정답을 아는 대조군 2건.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    name: 품목구분 필드 존재 확인
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe
        id: probe
        continue-on-error: true      # '없다'도 판정이다 — 빨갛게 만들 이유가 없다
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          # KR egress 프록시 — MFDS 는 해외 러너 IP 를 막는다(2026-09-14 사고 참조).
          MFDS_HTTP_PROXY: ${{ secrets.MFDS_HTTP_PROXY }}
        run: |
          set -o pipefail
          ARGS=()
          if [ -n "${{ inputs.item_seq }}" ]; then
            IFS=',' read -ra SEQS <<< "${{ inputs.item_seq }}"
            for s in "${SEQS[@]}"; do ARGS+=(--item-seq "$(echo "$s" | xargs)"); done
          fi
          python probe_mfds_item_class.py "${ARGS[@]}" 2>&1 | tee probe_report.txt

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### MFDS 품목구분 프로브"
            echo ""
            if [ -f probe_report.txt ]; then
              echo '```'
              cat probe_report.txt
              echo '```'
            else
              echo "리포트 미생성 — 의존성 설치/체크아웃 단계에서 멈췄을 수 있습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mfds-item-class-probe
          path: probe_report.txt
          retention-days: 14
          if-no-files-found: warn
