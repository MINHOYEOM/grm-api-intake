{#- FDA 지적 조항 화면 공용 스코프 스타일(.cc-*). 순위 페이지와 조항 페이지 블록이 같이 쓴다. -#}
<style>
  .cc-sec{font-family:var(--sans)}
  .cc-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin:0}
  .cc-big b{font-family:var(--serif);font-size:34px;line-height:1.1;color:var(--ink)}
  .cc-big span{font-size:14px;color:var(--muted);word-break:keep-all}
  .cc-yrs{display:flex;gap:10px;align-items:flex-end;margin:14px 0 0}
  .cc-y{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-width:44px}
  .cc-y i{display:block;width:22px;height:48px;position:relative}
  .cc-y i u{position:absolute;left:0;right:0;bottom:0;background:var(--coral);border-radius:3px 3px 0 0;text-decoration:none}
  .cc-y b{font-weight:600;color:var(--ink);font-size:12.5px}
  .cc-note{font-size:13px;line-height:1.65;color:var(--muted);margin:12px 0 0;max-width:760px;word-break:keep-all}
  .cc-tbl{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
  .cc-tbl th{font-weight:500;font-size:12.5px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2)}
  .cc-tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:var(--ink)}
  .cc-tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cc-tbl .cc-code{font-weight:600;white-space:nowrap}
  .cc-tbl .cc-code a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-2)}
  .cc-tbl .cc-code a:hover{color:var(--coral);border-bottom-color:var(--coral)}
  .cc-tbl .cc-t{color:var(--muted);font-size:13px;line-height:1.45}
  .cc-bar{height:8px;border-radius:4px;background:var(--line-2);min-width:90px;position:relative}
  .cc-bar u{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--coral);text-decoration:none}
  .cc-mini{display:inline-flex;gap:3px;align-items:flex-end;height:26px}
  .cc-mini i{display:block;width:8px;height:100%;position:relative}
  .cc-mini i u{position:absolute;left:0;right:0;bottom:0;background:var(--muted);opacity:.55;border-radius:2px 2px 0 0;text-decoration:none}
  .cc-wrapx{overflow-x:auto}
  @media (max-width:640px){.cc-tbl .cc-hide{display:none}}
</style>
