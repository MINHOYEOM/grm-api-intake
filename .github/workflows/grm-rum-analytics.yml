name: GRM RUM Analytics Sync

# Cloudflare Web Analytics(RUM) 일별 방문·유입을 Supabase 로 옮긴다(072). 운영자가
# Cloudflare 대시보드를 읽지 않고 /admin 성장·유입 탭에서 한국어로 보게 하는 것이 목적.
#
# 시각: 16:30 UTC = 01:30 KST. 전날(KST) 이 15:00 UTC 에 이미 닫혔으므로 완결된 하루를
# 담는다. 기존 크론(18:17 intake · 21:00 backlog · 목 18:15 glossary · 일 18:23 library)
# 과 겹치지 않는 조용한 창이다.
#
# 창을 8일로 잡는 이유: 매번 최근 8일을 다시 upsert 한다. 하루치만 넣으면 한 번 실패한
# 날이 영구 구멍으로 남고, RUM 은 집계가 늦게 도착하는 경우가 있어 최근 날짜가 나중에
# 커질 수 있다. 재실행이 자기 구멍을 메우는 구조가 재시도 로직보다 단순하다.
#
# 시크릿: CLOUDFLARE_ANALYTICS_TOKEN(신규 · Account Analytics Read 전용)
#         SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY(기존 재사용)
#         NEWSLETTER_API_KEY(기존 재사용 — 077 구독자 수 스냅샷 스텝)
#         GSC_SERVICE_ACCOUNT_JSON(신규 · 078 Search Console — 서비스 계정 키 JSON 전문)
#
# [077] 2026-09-05: 같은 실행이 국가·기기(수집기 그룹 2개)와 Brevo 구독자 수(두 번째
# 스텝)까지 적재한다. 매일 아침 예약 태스크가 growth_daily_report() 로 읽어 보고한다.
# [078] 2026-09-05: 세 번째 스텝이 Search Console(검색어·노출·순위)을 적재한다.
# RUM 은 "google.com 에서 왔다"까지만 알고 **무엇을 검색했는지**는 여기서만 온다.
# 확정 데이터가 2~3일 늦으므로 이 표의 최신 날짜는 RUM 보다 뒤처진다(정상).
# 계정·사이트 식별자는 비밀이 아니다(대시보드 URL 에 그대로 노출) — repo variable 로 두되
# 미설정 시 기본값으로 폴백한다(라이브 값 = 단일 소스).

on:
  schedule:
    # 16:30 UTC(01:30 KST)가 주 실행 — 전날(KST)이 이미 닫힌 시각이다.
    # ★04:30 UTC(13:30 KST)를 더한 이유(2026-09-05): Cloudflare ABR 이 **실행마다**
    # 표본 데이터셋을 고르는 것이 실측됐다(같은 코드·같은 창이 90분 간격으로 표본 간격
    # 1.0 과 10~12.5 를 줬다). 수집기는 정확한 값을 추정값으로 덮지 않으므로 **시도가
    # 늘수록 데이터가 좋아지기만 한다** — 되돌아갈 위험이 없는 래칫이라 기회를 늘린다.
    # 실행 1회는 1분 남짓이라 Actions 분에 실질 영향이 없다.
    - cron: '30 4 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '가져올 일수(기본 8). 창을 **7일 이하**로 잡아야 전수가 온다.'
        required: false
        default: '8'
      end:
        description: '창 끝(UTC ISO, 예 2026-08-29T00:00:00Z). 비우면 실행 시각 — 과거 구간 회수용.'
        required: false
        default: ''
      probe:
        description: 'true 면 원시 GraphQL 응답만 출력하고 적재하지 않는다(필드명 검증)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: grm-rum-analytics
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Cloudflare RUM into Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GitHub Actions 표현식에는 산술이 없다 — 창 경계는 셸에서 계산한다.
      #
      # ★`end` 를 열어 둔 이유(2026-09-05): 예약 실행은 언제나 "지금"에서 거꾸로 세므로
      # **최근 N일**밖에 못 본다. 그런데 8일 이상 창은 ABR 표본(간격 10~12.5)으로 떨어져,
      # 8/24~8/28 이 추정값으로 굳은 채 어떤 재실행으로도 닿지 않았다 — 7일 이하로 좁히면
      # 그 구간이 창 밖으로 나가 버리기 때문이다. 끝을 옮길 수 있어야 **짧은 창을 과거로
      # 밀어** 회수할 수 있다.
      #
      # 입력은 env 로 넘긴다 — `${{ }}` 를 run 본문에 직접 펼치면 입력이 셸 코드가 된다.
      - name: Resolve window
        id: win
        env:
          IN_DAYS: ${{ inputs.days || '8' }}
          IN_END: ${{ inputs.end }}
        run: |
          set -eu
          case "$IN_DAYS" in
            ''|*[!0-9]*) echo "days 는 양의 정수여야 한다: '$IN_DAYS'" >&2; exit 1 ;;
            0) echo "days 가 0 이면 창이 비어 아무것도 안 받는다" >&2; exit 1 ;;
          esac
          if [ -z "$IN_END" ]; then
            END="$(date -u +%Y-%m-%dT%H:00:00Z)"
          else
            # 형식을 먼저 막는다 — date 는 못 읽은 문자열을 조용히 "지금"으로 바꾸지 않지만
            # 부분 해석은 한다("2026-08-29" 는 통과, "8/29" 도 통과하며 다른 날이 된다).
            case "$IN_END" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z) : ;;
              *) echo "end 는 2026-08-29T00:00:00Z 꼴이어야 한다: '$IN_END'" >&2; exit 1 ;;
            esac
            END="$IN_END"
          fi
          # GNU date 는 'T'/'Z' 뒤에 상대항을 붙이면 파싱이 흔들린다 — 공백 형태로 편다.
          BASE="$(printf '%s' "$END" | sed 's/T/ /; s/Z$/ UTC/')"
          START="$(date -u -d "$BASE - $IN_DAYS days" +%Y-%m-%dT00:00:00Z)"
          # 계산이 어긋나면 조용히 빈 창을 돌리느니 여기서 멈춘다.
          [ "$START" \< "$END" ] || { echo "창이 비었다: $START ~ $END" >&2; exit 1; }
          echo "창 $START ~ $END (${IN_DAYS}일)"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Sync
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f8a15e3902ceb00a390635c040a2f551' }}
          CLOUDFLARE_RUM_SITE_TAG: ${{ vars.CLOUDFLARE_RUM_SITE_TAG || 'aa495e04c95449028591a30d7e0f87b4' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.probe || 'false' }}" = "true" ]; then
            python collect_rum_analytics.py \
              --start "${{ steps.win.outputs.start }}" \
              --end "${{ steps.win.outputs.end }}" --probe
          else
            python collect_rum_analytics.py \
              --start "${{ steps.win.outputs.start }}" \
              --end "${{ steps.win.outputs.end }}"
          fi

      # [077] Brevo 리스트 구독자 수 스냅샷 — 일일 성장 보고의 "구독자가 늘었나" 재료.
      # RUM 동기화와 독립이라 앞 스텝이 실패해도 돈다(취소만 제외). probe 실행은 구조
      # 확인이 목적이라 적재하지 않는다. 시크릿은 뉴스레터 발송과 같은 NEWSLETTER_API_KEY.
      - name: Snapshot newsletter subscribers
        if: ${{ !cancelled() && (inputs.probe || 'false') != 'true' }}
        env:
          NEWSLETTER_API_KEY: ${{ secrets.NEWSLETTER_API_KEY }}
          GRM_NEWSLETTER_LIST_ID: ${{ vars.GRM_NEWSLETTER_LIST_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collect_newsletter_subscribers.py

      # [078] Search Console — "무엇을 검색해 들어왔나". RUM 은 google.com 까지만 안다.
      # 앞 스텝과 독립이라 하나가 실패해도 돈다(취소만 제외). 확정 데이터가 2~3일 늦게
      # 오므로 창은 스크립트 기본값(16일)을 쓰고 매번 다시 적재한다.
      - name: Sync Search Console
        if: ${{ !cancelled() }}
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.probe || 'false' }}" = "true" ]; then
            python collect_search_console.py --probe
          else
            python collect_search_console.py
          fi
