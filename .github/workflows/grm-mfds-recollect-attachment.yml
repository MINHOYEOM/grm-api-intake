name: GRM MFDS GMP Attachment Recollect (named ids)

# 식약처 GMP 실사 — 이미 DB 에 있는 행의 첨부 본문을 문서 번호로 다시 받아 채운다.
# dispatch 전용. apply 기본 false(= dry, 쓰기 없음). 설계: 수집 완전성 상시 장치 §4·N3.
#
# 왜 워크플로가 필요한가: 일일 수집은 등록일 창 기반이고 적재는 먼저 쓴 것이 이긴다. 첨부를 한 번도
# 못 받은 행(예: 천일가스 gmpinspect-1PvoSBbO1to)은 일일 수집도 딥 백필도 영원히 채우지 않는다.
#
# ★nedrug 는 해외 IP 를 막는다 — MFDS_HTTP_PROXY(KR egress)가 비면 시작 전에 실패시킨다.
# ★원천 예의: recollect_mfds_gmp_attachment.py 가 수집기와 같은 다운로드 함수(1초 간격)를 쓴다.
#   차단 회피는 하지 않는다.
# ★concurrency 는 grm-mfds-backfill.yml 과 같은 그룹 — 매일 수집·백필과 nedrug 호출이 겹치지 않는다.
# ★가드(본문 후퇴·판정 후퇴)에 걸린 행은 쓰지 않고 보고만 한다 → exit 1 로 잡이 빨갛게 끝난다.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '문서번호(쉼표 구분, 최대 50). 예: 1PvoSBbO1to 또는 gmpinspect-1PvoSBbO1to'
        type: string
        required: true
      apply:
        description: 'true = 실제 반영(대표 승인 뒤에만). 기본 false = dry(쓰기 없음).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mfds-backfill
  cancel-in-progress: false

jobs:
  recollect:
    name: Recollect GMP attachment by id (dry unless apply=true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 프록시 도달성 선점검
        env:
          MFDS_HTTP_PROXY: ${{ secrets.MFDS_HTTP_PROXY }}
        run: |
          if [ -z "$MFDS_HTTP_PROXY" ]; then
            echo "::error::MFDS_HTTP_PROXY 미설정 — nedrug 는 러너 IP 를 차단하므로 전건 실패한다"
            exit 1
          fi
          python probe_mfds_egress.py

      # dispatch 입력은 env 로만 받아 shell 본문 삽입을 피한다.
      - name: Recollect (dry unless apply=true)
        id: recollect
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MFDS_HTTP_PROXY: ${{ secrets.MFDS_HTTP_PROXY }}
          ENABLE_GMP_DEFICIENCY_TABLE: 'true'
          IN_IDS: ${{ inputs.ids }}
          IN_APPLY: ${{ inputs.apply }}
        run: |
          set -o pipefail
          if [ -z "$IN_IDS" ]; then
            echo "::error::ids 가 비었다"
            exit 2
          fi
          if printf '%s' "$IN_IDS" | grep -qvE '^[A-Za-z0-9_,[:space:]-]+$'; then
            echo "::error::ids 에 허용되지 않는 문자가 있다(영숫자·_·-·쉼표만)"
            exit 2
          fi
          args=(--ids "$IN_IDS" --json recollect.json)
          if [ "$IN_APPLY" = "true" ]; then
            args+=(--apply)
          fi
          python recollect_mfds_gmp_attachment.py "${args[@]}"

      - name: Write step summary
        if: always()
        env:
          IN_IDS: ${{ inputs.ids }}
          IN_APPLY: ${{ inputs.apply }}
        run: |
          {
            echo "### GRM MFDS GMP Attachment Recollect"
            echo ""
            echo "ids: \`$IN_IDS\` / apply: \`$IN_APPLY\`"
            echo ""
            if [ -f recollect.json ]; then
              echo '```json'
              cat recollect.json
              echo '```'
              echo ""
              echo "exit 1 = 가드(본문·판정 후퇴) 또는 반영 실패 또는 없는 번호. 쓰기는 가드를 통과한 행만."
            else
              echo "recollect.json 미생성 — 인자/인증/프록시 실패로 조기 종료"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mfds-recollect
          path: recollect.json
          if-no-files-found: warn
