name: GRM Cloud Request (클라우드 요청 마커 → 허용목록 워크플로)

# 클라우드 세션은 워크플로를 직접 깨울 수 없다(`/actions` 403). 대신 브랜치 `claude/request-*` 에
# `company/requests/<id>.json` 하나를 push 하면 이 워크플로가 요청을 검증하고, **허용목록의 워크플로만** 깨운다.
# 결과는 `claude/ops-status` 브랜치의 `requests/<id>.json` 에 남는다. 형식·허용목록은 company/ops/cloud_request.py.
#
# 안전 계약
#   · 검증 코드는 main 의 것을 쓴다 — 요청 파일은 데이터로만 읽고, 요청 브랜치의 어떤 코드도 실행하지 않는다.
#   · 허용 동작: ping · ops-status-refresh · delta-bridge · web-publish · scaffold-mirror · wl-restore-plan.
#     발송·머지·발행 승인·DB 쓰기는 없다. 인자는 정규식·날짜 범위로 좁힌다. 같은 id 는 한 번만 · 시간당 10건.
#   · 깨우는 워크플로는 main 판으로 돈다(--ref main). 라이브 발행은 여전히 대표의 관리자 승인.
#   · 요청 한 건 = 마지막 커밋에 추가된 파일 최대 3개.

on:
  push:
    branches:
      - 'claude/request-**'
    paths:
      - 'company/requests/*.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: grm-cloud-request-${{ github.sha }}
  cancel-in-progress: false

jobs:
  handle:
    name: 요청 검증·실행
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: 처리
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::sha 형식"; exit 1; }
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 2 "$REMOTE" "$SHA"
          FILES=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r --root "$SHA" -- 'company/requests/*.json' | head -3)
          [ -n "$FILES" ] || { echo "추가된 요청 파일 없음"; exit 0; }
          # 처리 이력 사본(중복·과다 판정용)
          rm -rf _res && mkdir _res
          if git ls-remote --exit-code --heads "$REMOTE" claude/ops-status >/dev/null 2>&1; then
            git fetch -q --depth 1 "$REMOTE" claude/ops-status
            git archive FETCH_HEAD requests 2>/dev/null | tar -x -C _res || true
          fi
          CR="$GITHUB_WORKSPACE/company/ops/cloud_request.py"
          for f in $FILES; do
            id=$(basename "$f" .json)
            git show "$SHA:$f" > _req.json
            verdict=$(python3 "$CR" check _req.json "$id" _res/requests); rc=$?
            echo "[$id] rc=$rc $verdict"
            if [ $rc -eq 3 ]; then continue; fi          # 이미 처리 · 과다 — 덮어쓰지 않는다
            if [ $rc -ne 0 ]; then
              echo "$verdict" | bash company/ops/ops_branch.sh "request $id rejected" python3 "$CR" result requests "$id" rejected "$SHA"
              continue
            fi
            wf=$(echo "$verdict" | python3 -c 'import json,sys; print(json.load(sys.stdin)["workflow"] or "")')
            outcome=pinged
            if [ -n "$wf" ]; then
              mapfile -t FIELDS < <(echo "$verdict" | python3 -c 'import json,sys; [print("-f\n%s=%s" % kv) for kv in json.load(sys.stdin)["args"].items()]')
              if gh workflow run "$wf" --ref main "${FIELDS[@]}"; then outcome=dispatched; else outcome=dispatch-failed; fi
            fi
            echo "$verdict" | bash company/ops/ops_branch.sh "request $id $outcome" python3 "$CR" result requests "$id" "$outcome" "$SHA"
          done
